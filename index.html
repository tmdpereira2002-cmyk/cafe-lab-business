<style>

/* motion: views rise in, cards stagger, dialogs slide up, steam drifts */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}70%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@keyframes tick{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:none}}
@keyframes wiggle{0%,100%{transform:none}30%{transform:rotate(-8deg) scale(1.06)}60%{transform:rotate(5deg)}}

#view.anim>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.dcards>*,.cards>*{animation:pop .4s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--j,0)*35ms + 120ms)}
dialog[open]{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1)}dialog[open]::backdrop{animation:fadeIn .3s}
.dlgBody>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*40ms + 80ms)}
.steamA path{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box}.steamA path+path{animation-delay:1.3s}
button,.dcard,.card,.menu button,.seg button{transition:transform .18s cubic-bezier(.34,1.56,.64,1),background-color .25s,color .25s,box-shadow .25s,border-color .25s}
button:active,.dcard:active{transform:scale(.96)}
.dcard:hover,.card:hover{box-shadow:0 6px 18px rgba(40,20,10,.12);transform:translateY(-2px)}

@media (prefers-reduced-motion:no-preference){.dlgArt .kicon.kbig{animation:bzPop .5s cubic-bezier(.34,1.56,.64,1)}.dlgArt .kicon.kbig svg{animation:bzFloat 6s ease-in-out infinite}}
#cafeBar{margin-top:8px}.cafeSel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.cafeSel select{flex:1;min-height:38px;padding:6px 10px;font-weight:600}
.cafeRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.cafeRow.cur{border-color:var(--crema)}
.kchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.kchips::-webkit-scrollbar{display:none}.kchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font:500 14px var(--body);min-height:38px;cursor:pointer}.kchip[aria-pressed="true"]{background:var(--crema);border-color:var(--crema);color:var(--on-crema)}
#dlgBody .mgNav button{border:0;border-radius:12px;padding:10px;font:600 15px var(--body);min-height:44px;cursor:pointer;background:var(--crema);color:var(--on-crema)}#dlgBody .mgNav button.ghost{background:transparent;color:var(--crema);border:1px solid var(--line)}#dlgBody .mgNav button:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.calcH{display:flex;align-items:center;gap:10px}.cico{width:40px;height:40px;flex:none;border-radius:12px;background:var(--crema-soft);display:grid;place-items:center}.cico svg{width:32px;height:32px}
details.card.eq>summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) 22px;gap:12px;align-items:center;padding:2px 0}details.card.eq>summary::-webkit-details-marker{display:none}
details.card.eq>summary::after{content:"+";font:600 22px/1 var(--body);color:var(--muted);text-align:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}details.card.eq[open]>summary::after{transform:rotate(45deg)}
.eqIco{width:44px;height:44px;border-radius:12px;background:var(--crema-soft);display:grid;place-items:center}.eqIco svg{width:38px;height:38px}.eqTxt{min-width:0}.eqTxt b,.eqTxt small{display:block}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 8px}.emptyArt{width:140px;height:auto}
@media (prefers-reduced-motion:no-preference){
.cico svg,.eqIco svg{animation:bzFloat 6s ease-in-out infinite}.panel:nth-child(2n) .cico svg,details.eq:nth-child(2n) .eqIco svg{animation-delay:-3s}@keyframes bzFloat{50%{transform:translateY(-2px)}}
details.eq[open] .eqIco svg{animation:bzPop .5s cubic-bezier(.34,1.56,.64,1)}@keyframes bzPop{50%{transform:scale(1.12) rotate(-4deg)}}
.mdrip{animation:bzDrip 1.8s ease-in infinite}@keyframes bzDrip{0%{opacity:0;transform:translateY(-2px)}40%{opacity:1}100%{opacity:0;transform:translateY(4px)}}
.gburr{transform-box:fill-box;transform-origin:center;animation:bzBuzz 1.2s ease-in-out infinite}@keyframes bzBuzz{50%{transform:translateX(.6px)}}.gbean{animation:bzDrip 2.4s ease-in infinite}
.cspin{transform-origin:24px 24px;animation:bzTick 4s steps(8) infinite}.cspin2{transform-origin:24px 29px;animation:bzTick 6s steps(12) infinite}@keyframes bzTick{to{transform:rotate(360deg)}}
.cnudge{animation:bzNudge 2.4s ease-in-out infinite}@keyframes bzNudge{50%{transform:translateX(2px)}}.cdrop{animation:bzDrip 2s ease-in infinite}.cwave{animation:bzWave 2.6s ease-in-out infinite}@keyframes bzWave{50%{transform:translateY(1.5px)}}
.cline{stroke-dasharray:60;stroke-dashoffset:60;animation:bzDraw 3.5s ease-in-out infinite}@keyframes bzDraw{0%{stroke-dashoffset:60}50%,100%{stroke-dashoffset:0}}
.ewave{transform-origin:86px 27px;animation:bzWaveHand 2.4s ease-in-out infinite}@keyframes bzWaveHand{50%{transform:rotate(8deg)}}
}
.card.ktop{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}.ktop .kicon{width:52px;height:52px;border-radius:14px;background:var(--crema-soft);display:grid;place-items:center}.ktop .kicon svg{width:40px;height:40px}
@media (prefers-reduced-motion:no-preference){.ktop .kicon svg{animation:bzFloat 6s ease-in-out infinite}.ktop:nth-child(2n) .kicon svg{animation-delay:-2s}.ktop:hover .kicon svg{animation:bzPop .5s cubic-bezier(.34,1.56,.64,1)}
.kicon .kflame{transform-box:fill-box;transform-origin:50% 100%;animation:kFlame 1.4s ease-in-out infinite}.kicon .kwave path{animation:kWave 3s ease-in-out infinite}.kicon .kwave path:last-child{animation-delay:1.5s}.kicon .kdrop{animation:kDrop 2.2s ease-in infinite}.kicon .kbeat{transform-box:fill-box;transform-origin:center;animation:kBeat 1.8s ease-in-out infinite}.kicon .kc{transform-box:fill-box;transform-origin:50% 0;animation:kSway 4s ease-in-out infinite}
@keyframes kFlame{50%{transform:scaleY(1.12) scaleX(.94)}}@keyframes kWave{0%{transform:translateY(2px);opacity:0}40%{opacity:1}100%{transform:translateY(-4px);opacity:0}}@keyframes kDrop{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(7px);opacity:0}}@keyframes kBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}45%{transform:scale(1.05)}}@keyframes kSway{50%{transform:rotate(6deg)}}}

<header><div class="wrap">
  <div class="top"><div class="row" style="gap:10px;flex-wrap:nowrap"><img src="icon-192.png" alt="" width="36" height="36" style="flex:none;border-radius:9px"><h1>Café Lab <span style="color:var(--crema)">Business</span></h1></div><div class="row" style="gap:8px;flex-wrap:nowrap"><button type="button" class="lang" id="langBtn" aria-label="Language">NL</button><a href="https://tmdpereira2002-cmyk.github.io/Cafe-lab/" id="persLink" style="font-size:13px;white-space:nowrap">Café Lab →</a></div></div>
  <div class="seg" role="group" style="margin-top:10px"><button type="button" data-role="boss" id="roleBoss">Boss</button><button type="button" data-role="trainee" id="roleTrainee">Trainee</button></div>

</div></header>

<dialog id="dlg"><div style="position:relative"><div class="dlgArt" id="dlgArt"></div><button type="button" class="x" id="dlgX" aria-label="Close">✕</button></div><div class="dlgBody" id="dlgBody"></div></dialog>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>isFinite(n)?(+n).toFixed(d).replace(".",S.lang==="nl"?",":"."):"–";
const eur=n=>isFinite(n)?"€"+fmt(n,2):"–";
const num=v=>parseFloat(String(v??"").replace(",","."));

/* ---------- storage (this device only until café accounts sync) ---------- */
const KEY="cafeWork";
const DEF={role:"boss",section:null,pin:"",machine:"lm-linea-pb",grinder:"mk-e65s",cafe:"",staff:[],signoff:{},menu:null,clean:{},costs:{},plan:{},lang:null};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}
if(!S.lang)S.lang=/^nl/i.test(navigator.language||"")?"nl":"en";
let save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// T(english, dutch); L() reads a value that may be {en,nl} or plain text the owner typed
const T=(en,nl)=>S.lang==="nl"?nl:en;
const L=x=>x&&typeof x==="object"&&!Array.isArray(x)?(x[S.lang]??x.en):x;
const B=(en,nl)=>({en,nl});

/* ---------- commercial equipment ---------- */
const FUNCS={
 vol:[B("Volumetric dosing","Volumetrische dosering"),B("Programmed buttons stop the shot after a set amount of water (counted by a flowmeter). Set them once for the house recipe; check yield on a scale daily because grind and beans change it.","Geprogrammeerde knoppen stoppen de shot na een vaste hoeveelheid water (gemeten met een flowmeter). Stel ze één keer in op het huisrecept; controleer de opbrengst dagelijks op een weegschaal, want maling en bonen veranderen die."),B("Hold the programming button, start the shot with the button you want, stop it at the right yield, release. The machine remembers the pulse count.","Houd de programmeerknop ingedrukt, start de shot met de gewenste knop, stop bij de juiste opbrengst en laat los. De machine onthoudt de hoeveelheid.")],
 manual:[B("Manual / continuous button","Handmatige / doorloopknop"),B("Starts and stops the shot by hand. Use it when dialling in with a scale, and for purging the group.","Start en stopt de shot met de hand. Gebruik hem bij het afstellen met een weegschaal en om de groep door te spoelen."),B("Press once to start, again to stop at your target weight.","Druk één keer om te starten en nog eens om te stoppen op je doelgewicht.")],

const catOf=d=>d.cat||(d.iced?"iced":!d.dose?"nocoffee":d.milk?"milk":"coffee");
// sizes: a drink can come in several sizes, each with its own cup, dose, milk and price
const sizesOf=d=>Array.isArray(d.sizes)&&d.sizes.length?d.sizes:[{label:"",size:d.size,dose:d.dose,yield:d.yield,milk:d.milk,price:d.price}];
const withSize=(d,s)=>Object.assign({},d,{dose:s.dose??d.dose,yield:s.yield??d.yield,milk:s.milk??d.milk,price:s.price??d.price,size:s.size||d.size});
const DEF_OPTS=()=>({milks:[{n:B("Whole milk","Volle melk"),p:0},{n:B("Semi-skimmed","Halfvolle melk"),p:0},{n:B("Oat milk","Havermelk"),p:0.5},{n:B("Soy milk","Sojamelk"),p:0.5},{n:B("Almond milk","Amandelmelk"),p:0.5},{n:B("Lactose-free","Lactosevrij"),p:0.3}],
 extras:[{n:B("Extra shot","Extra shot"),p:0.6},{n:B("Decaf","Cafeïnevrij"),p:0},{n:B("Vanilla syrup","Vanillesiroop"),p:0.5},{n:B("Caramel syrup","Karamelsiroop"),p:0.5},{n:B("Hazelnut syrup","Hazelnootsiroop"),p:0.5},{n:B("Whipped cream","Slagroom"),p:0.5},{n:B("Takeaway cup","Meeneembeker"),p:0}]});
if(!S.opts)S.opts=DEF_OPTS();
let dCat="all";
const meta=d=>{const ss=sizesOf(d);if(ss.length>1)return ss.map(s=>L(s.label)||s.size).join(" · ");return [d.size,d.dose?`${fmt(d.dose,0)} g → ${fmt(d.yield,0)} g`:"",d.milk?`${d.milk} ml ${T("milk","melk")}`:""].filter(Boolean).join(" · ")};
const fromPrice=d=>{const ps=sizesOf(d).map(s=>+s.price).filter(p=>p>0);return ps.length?(ps.length>1?T("from ","vanaf "):"")+eur(Math.min(...ps)):""};
const drinkCost=(d,c)=>{const n=k=>num((c||S.costs.cost||{})[k]);const bag=n("bag")||28,kg=n("kg")||1,milkL=n("milkL")||1.3,waste=isFinite(n("waste"))?n("waste"):8,cup=isFinite(n("cup"))?n("cup"):0.12;
  return ((bag/(kg*1000))*(+d.dose||0)+milkL/1000*(+d.milk||0)+(+d.powderPrice||0)/1000*(+d.powder||0))*(1+waste/100)+cup+(+d.extra||0)};
const vatNow=()=>{const v=num(sv("cost","vat",9));return isFinite(v)?v:9};

VIEWS.recipes=()=>{
 const boss=S.role==="boss";
 const vis=S.menu.filter(d=>boss||!d.hidden);
 const used=Object.keys(CATS).filter(c=>vis.some(d=>catOf(d)===c));
 if(dCat!=="all"&&dCat!=="hidden"&&!used.includes(dCat))dCat="all";
 const list=vis.filter(d=>dCat==="all"?(!d.hidden||boss):dCat==="hidden"?d.hidden:catOf(d)===dCat);
 V(`<div class="panel"><h2>${T("House drinks","Huisdrankjes")}</h2><p class="hint">${boss?T("Your café's menu: tap a drink to see or change it. Drinks can have several sizes, and guests can pick a milk and extras that you set once for the whole menu.","Het menu van je café: tik op een drankje om het te bekijken of aan te passen. Drankjes kunnen meerdere maten hebben, en gasten kiezen een melk en extra's die je één keer voor het hele menu instelt."):T("Our café's standard. Tap a drink for the full recipe. Weigh every shot until these feel automatic.","De standaard van ons café. Tik op een drankje voor het hele recept. Weeg elke shot tot dit vanzelf gaat.")}</p>
 <div class="row"><button type="button" class="ghost" id="board">${T("Menu board","Menukaart")}</button>${boss?`<button type="button" class="ghost" id="optsBtn">${T("Milk & extras","Melk & extra's")}</button><button type="button" class="ghost" id="resetMenu">${T("Reset to the standard menu","Terug naar standaardmenu")}</button>`:""}</div></div>
 <nav class="menu" style="padding-top:0;margin-bottom:10px" aria-label="${T("Categories","Categorieën")}"><button type="button" data-cat="all" aria-current="${dCat==="all"}">${T("All","Alles")}</button>${used.map(c=>`<button type="button" data-cat="${c}" aria-current="${dCat===c}">${L(CATS[c])}</button>`).join("")}${boss&&S.menu.some(d=>d.hidden)?`<button type="button" data-cat="hidden" aria-current="${dCat==="hidden"}">${T("Hidden","Verborgen")}</button>`:""}</nav>
 <div class="dcards">${list.map(d=>`<button type="button" class="dcard" data-drink="${d.id}"${d.hidden?' style="opacity:.55"':""}><div class="art">${cupSVG(d)}</div><div class="txt"><h3>${esc(L(d.name))}</h3><span class="meta">${esc(meta(d))}</span><span class="meta">${fromPrice(d)}${d.hidden?" · "+T("hidden","verborgen"):""}</span></div></button>`).join("")}
 ${boss?`<button type="button" class="dcard add" id="addDrink">+ ${T("Add a drink","Drankje toevoegen")}</button>`:""}</div>`);
 $("#view").onclick=e=>{const c=e.target.closest("[data-drink]");if(c)return showDrink(c.dataset.drink);const k=e.target.closest("[data-cat]");if(k){dCat=k.dataset.cat;return VIEWS.recipes()}
  const b=e.target.closest("button");if(!b)return;if(b.id==="addDrink")pickTemplate();if(b.id==="board")menuBoard();if(b.id==="optsBtn")editOpts();
  if(b.id==="resetMenu")twice(b,()=>{S.menu=DEFAULT_MENU.map(fromTpl);dCat="all";save();VIEWS.recipes()})};
};
function showDrink(id){const d=S.menu.find(x=>x.id===id);if(!d)return;const boss=S.role==="boss";const Ls=(d.layers||[]).filter(l=>l[1]>0),tot=Ls.reduce((a,l)=>a+ +l[1],0)||1;const ss=sizesOf(d),multi=ss.length>1,vat=vatNow();
 const opts=[...(d.milk?S.opts.milks:[]),...S.opts.extras];
 openDlg(cupSVG(d),`<h2>${esc(L(d.name))}</h2>${d.sub?`<p class="hint" style="margin:0">${esc(L(d.sub))}</p>`:""}<div><span class="tag on">${L(CATS[catOf(d)])}</span>${d.hidden?`<span class="tag">${T("hidden from menu","verborgen op menu")}</span>`:""}</div>
 ${multi?`<div class="tableWrap"><table><tr><th>${T("Size","Maat")}</th><th>${T("Cup","Kop")}</th>${d.dose||ss.some(s=>s.dose)?`<th>${T("Coffee","Koffie")}</th>`:""}${d.milk||ss.some(s=>s.milk)?`<th>${T("Milk","Melk")}</th>`:""}<th>${T("Price","Prijs")}</th>${boss?`<th>${T("Margin","Marge")}</th>`:""}</tr>${ss.map(s=>{const x=withSize(d,s),c=drinkCost(x),m=x.price?(1-c/(x.price/(1+vat/100)))*100:NaN;return `<tr><td><b>${esc(L(s.label))}</b></td><td>${esc(x.size)}</td>${d.dose||ss.some(s=>s.dose)?`<td class="num">${x.dose?`${fmt(x.dose,0)} → ${fmt(x.yield||x.dose*2,0)} g`:"–"}</td>`:""}${d.milk||ss.some(s=>s.milk)?`<td class="num">${x.milk||0} ml</td>`:""}<td class="num">${x.price?eur(x.price):"–"}</td>${boss?`<td class="num ${m>=70?"ok":m>=60?"warnT":"badT"}">${isFinite(m)?fmt(m,0)+" %":"–"}</td>`:""}</tr>`}).join("")}</table></div>${d.time?`<p class="hint" style="margin:0">${T("Shot time","Shottijd")}: ${esc(d.time)}</p>`:""}`
 :`<div class="stats">${d.size?`<div><b>${esc(d.size)}</b><span>${T("Cup","Kop")}</span></div>`:""}${d.dose?`<div><b>${fmt(d.dose)} g</b><span>${T("Dose","Dosis")}</span></div><div><b>${fmt(d.yield)} g</b><span>${T("Yield","Opbrengst")} · 1:${fmt(d.yield/d.dose)}</span></div>`:""}${d.time?`<div><b>${esc(d.time)}</b><span>${T("Shot time","Shottijd")}</span></div>`:""}${d.milk?`<div><b>${d.milk} ml</b><span>${T("Milk","Melk")}</span></div>`:""}${d.powder?`<div><b>${fmt(d.powder)} g</b><span>${T("Powder","Poeder")}</span></div>`:""}${d.price?`<div><b>${eur(d.price)}</b><span>${T("Price","Prijs")}</span></div>`:""}</div>`}
 <div style="display:flex;flex-direction:column;gap:4px">${Ls.slice().reverse().map(([c,f])=>`<span class="row" style="gap:8px;font-size:14px;flex-wrap:nowrap"><i class="dot" style="background:${COL[c]}"></i>${L(COLN[c])} <span class="hint" style="margin:0">${Math.round(f/tot*100)}%</span></span>`).join("")}</div>
 ${d.amt.length?`<h3>${T("You need","Je hebt nodig")}</h3><ul>${d.amt.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`:""}
 ${d.steps.length?`<h3>${T("How to make it","Zo maak je het")}</h3><ol>${d.steps.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ol>`:""}
 ${opts.length?`<h3>${T("Guests can choose","Gasten kunnen kiezen")}</h3><div>${opts.map(o=>`<span class="tag on">${esc(L(o.n))}${+o.p?` +${eur(+o.p)}`:""}</span>`).join("")}</div>`:""}
 ${boss?`${!multi?`<p class="hint">${T("Cost per drink","Kosten per drankje")}: <b>${eur(drinkCost(d))}</b>${d.price?` · ${T("margin","marge")} <b>${fmt((1-drinkCost(d)/(d.price/(1+vat/100)))*100,0)} %</b>`:""}</p>`:""}
 <div class="row"><button class="btn" type="button" id="dEdit">${T("Edit","Bewerken")}</button><button class="ghost" type="button" id="dCopy">${T("Duplicate","Dupliceren")}</button><button class="ghost" type="button" id="dHide">${d.hidden?T("Show on menu","Op menu zetten"):T("Hide from menu","Verbergen")}</button></div>
 <div class="row"><button class="ghost" type="button" id="dUp" aria-label="${T("Move earlier","Naar voren")}">← ${T("Earlier","Eerder")}</button><button class="ghost" type="button" id="dDown">${T("Later","Later")} →</button><button class="ghost" type="button" id="dDel">${T("Delete","Verwijderen")}</button></div>`:""}`);
 if(!boss)return;
 const mv=dir=>{const i=S.menu.indexOf(d),j=i+dir;if(j<0||j>=S.menu.length)return;[S.menu[i],S.menu[j]]=[S.menu[j],S.menu[i]];save();VIEWS.recipes();toast(T("Moved","Verplaatst"))};
 $("#dUp").onclick=()=>mv(-1);$("#dDown").onclick=()=>mv(1);
 $("#dHide").onclick=()=>{d.hidden=!d.hidden;save();dlg.close();VIEWS.recipes()};
 $("#dEdit").onclick=()=>editDrink(d);
 $("#dCopy").onclick=()=>{const c=clone(d);c.id="d"+Date.now().toString(36);c.name=L(d.name)+" 2";S.menu.splice(S.menu.indexOf(d)+1,0,c);save();dlg.close();VIEWS.recipes();editDrink(c)};
 $("#dDel").onclick=e=>twice(e.target,()=>{S.menu=S.menu.filter(x=>x.id!==d.id);save();dlg.close();VIEWS.recipes()});
}
function pickTemplate(){
 openDlg("",`<h2>${T("Add a drink","Drankje toevoegen")}</h2><p class="hint" style="margin:0">${T("Start from a template and change it to your café's recipe, or start empty.","Begin met een sjabloon en pas het aan op het recept van je café, of begin leeg.")}</p>
 ${Object.keys(CATS).map(c=>{const ts=TEMPLATES.filter(t=>catOf(t)===c);return ts.length?`<h3>${L(CATS[c])}</h3><div class="dcards">${ts.map(t=>`<button type="button" class="dcard" data-tpl="${t.key}"><div class="art">${cupSVG(t)}</div><div class="txt"><h3>${L(t.name)}</h3></div></button>`).join("")}</div>`:""}).join("")}
 <h3>${T("Your own","Je eigen")}</h3><div class="dcards"><button type="button" class="dcard add" data-tpl="">+ ${T("Empty drink","Leeg drankje")}</button></div>`);
 $("#dlgBody").onclick=e=>{const b=e.target.closest("[data-tpl]");if(!b)return;$("#dlgBody").onclick=null;
   const d=b.dataset.tpl?fromTpl(b.dataset.tpl):Object.assign(D("custom",{name:"",sub:"",cat:"other",layers:[["milk",0.8],["foam",0.2]]}),{id:"d"+Date.now().toString(36)});
   d.isNew=true;editDrink(d)};
}
function editDrink(d){
 const cupOpts=Object.keys(CUPS).map(k=>`<option value="${k}"${k===d.cup?" selected":""}>${L(CUPN[k])}</option>`).join("");
 const catOpts=Object.keys(CATS).map(k=>`<option value="${k}"${k===catOf(d)?" selected":""}>${L(CATS[k])}</option>`).join("");
 const layer=(l,i)=>`<div class="layerRow"><select id="ly${i}" aria-label="${T("Layer","Laag")} ${i+1}"><option value="">—</option>${Object.keys(COL).map(c=>`<option value="${c}"${l&&l[0]===c?" selected":""}>${L(COLN[c])}</option>`).join("")}</select><span></span><input id="lp${i}" class="num" inputmode="decimal" value="${l?Math.round(l[1]*100):""}" placeholder="%" aria-label="%"></div>`;
 const ss=Array.isArray(d.sizes)?d.sizes:[];
 const sizeRow=(s,i)=>`<div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:6px"><input id="sl${i}" value="${esc(s?L(s.label):"")}" placeholder="${[T("Small","Klein"),T("Regular","Normaal"),T("Large","Groot")][i]}" aria-label="${T("Size name","Naam maat")}"><input id="ss${i}" value="${esc(s?s.size:"")}" placeholder="ml" aria-label="${T("Cup size","Kopmaat")}"><input id="sd${i}" class="num" inputmode="decimal" value="${s&&s.dose!=null?s.dose:""}" placeholder="${T("coffee g","koffie g")}" aria-label="${T("Coffee g","Koffie g")}"><input id="sm${i}" class="num" inputmode="decimal" value="${s&&s.milk!=null?s.milk:""}" placeholder="${T("milk ml","melk ml")}" aria-label="${T("Milk ml","Melk ml")}"><input id="sp${i}" class="num" inputmode="decimal" value="${s&&s.price?s.price:""}" placeholder="€" aria-label="€"></div>`;
 const lines=a=>a.map(x=>L(x)).join("\n");
 const f=(id,label,v,attrs="")=>`<label class="field"><span>${label}</span><input id="${id}" value="${esc(v)}" ${attrs}></label>`;
 openDlg(cupSVG(d),`<h2>${d.isNew?T("New drink","Nieuw drankje"):T("Edit drink","Drankje bewerken")}</h2>
 <div class="grid">${f("eName",T("Name","Naam"),L(d.name),`placeholder="${T("e.g. Matcha latte","bijv. Matcha latte")}"`)}${f("eSub",T("Short description","Korte beschrijving"),L(d.sub))}
 <label class="field"><span>${T("Menu section","Menurubriek")}</span><select id="eCat">${catOpts}</select></label>
 <label class="field"><span>${T("Cup","Kop")}</span><select id="eCup">${cupOpts}</select></label>${f("eSize",T("Size","Maat"),d.size,'placeholder="300 ml"')}
 <label class="field"><span>${T("Served","Geserveerd")}</span><select id="eIced"><option value="0">${T("Hot","Warm")}</option><option value="1"${d.iced?" selected":""}>${T("Iced","Met ijs")}</option></select></label>
 ${f("ePrice",T("Menu price € (incl. VAT)","Menuprijs € (incl. btw)"),d.price||"",'class="num" inputmode="decimal"')}</div>
 <h3>${T("Coffee","Koffie")}</h3><p class="hint" style="margin:0">${T("Single shot ≈ 9 g → 18 g, double ≈ 18 g → 36 g. Leave the dose at 0 for drinks without coffee.","Enkele shot ≈ 9 g → 18 g, dubbele ≈ 18 g → 36 g. Laat de dosis op 0 voor drankjes zonder koffie.")}</p>
 <div class="row" style="gap:6px"><button type="button" class="ghost" data-shot="9|18">${T("Single shot","Enkele shot")}</button><button type="button" class="ghost" data-shot="18|36">${T("Double shot","Dubbele shot")}</button><button type="button" class="ghost" data-shot="27|54">${T("Triple shot","Driedubbele shot")}</button><button type="button" class="ghost" data-shot="0|0">${T("No coffee","Geen koffie")}</button></div>
 <div class="grid">${f("eDose",T("Dose g","Dosis g"),d.dose,'class="num" inputmode="decimal"')}${f("eYield",T("Yield g","Opbrengst g"),d.yield,'class="num" inputmode="decimal"')}${f("eTime",T("Shot time","Shottijd"),d.time,'placeholder="27–30 s"')}</div>
 <h3>${T("Milk, powders and extras","Melk, poeders en extra's")}</h3>
 <div class="grid">${f("eMilk",T("Milk ml","Melk ml"),d.milk,'class="num" inputmode="decimal"')}${f("ePowder",T("Powder g (matcha, chai, cocoa)","Poeder g (matcha, chai, cacao)"),d.powder,'class="num" inputmode="decimal"')}${f("ePowderPrice",T("Powder € per kg","Poeder € per kg"),d.powderPrice,'class="num" inputmode="decimal"')}${f("eExtra",T("Other extras € per drink (syrup…)","Overige extra's € per drankje (siroop…)"),d.extra,'class="num" inputmode="decimal"')}</div>
 <h3>${T("Sizes (optional)","Maten (optioneel)")}</h3><p class="hint" style="margin:0">${T("Sell it in up to three sizes: name, cup size, coffee g, milk ml and price. Leave empty for one size.","Verkoop het in maximaal drie maten: naam, kopmaat, koffie g, melk ml en prijs. Laat leeg voor één maat.")}</p>
 <div style="display:flex;flex-direction:column;gap:6px">${[0,1,2].map(i=>sizeRow(ss[i],i)).join("")}</div>
 <h3>${T("What's in the cup (for the drawing)","Wat zit erin (voor de tekening)")}</h3><p class="hint" style="margin:0">${T("Bottom to top, in % of the cup.","Van onder naar boven, in % van de kop.")}</p>
 <div style="display:flex;flex-direction:column;gap:6px">${[0,1,2,3].map(i=>layer(d.layers[i],i)).join("")}</div>
 <label class="field"><span>${T("Ingredients (one per line)","Ingrediënten (één per regel)")}</span><textarea id="eAmt">${esc(lines(d.amt))}</textarea></label>
 <label class="field"><span>${T("Steps (one per line)","Stappen (één per regel)")}</span><textarea id="eSteps">${esc(lines(d.steps))}</textarea></label>
 <label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" id="eHidden" style="width:22px;height:22px;min-height:0;flex:none"${d.hidden?" checked":""}>${T("Hide from the menu for now (e.g. seasonal)","Voorlopig niet op het menu (bijv. seizoensdrankje)")}</label>
 <p class="hint badT" id="eErr" hidden>${T("Give the drink a name.","Geef het drankje een naam.")}</p>
 <div class="row"><button class="btn" type="button" id="eSave">${d.isNew?T("Add to menu","Aan menu toevoegen"):T("Save","Opslaan")}</button><button class="ghost" type="button" id="eCancel">${T("Cancel","Annuleren")}</button></div>`);
 const read=()=>{const v=id=>$("#"+id).value,n=id=>num(v(id))||0,keep=(old,val)=>L(old)===val?old:val,keepList=(old,txt)=>{const ls=txt.split("\n").map(s=>s.trim()).filter(Boolean);return lines(old)===ls.join("\n")?old:ls};
   const layers=[0,1,2,3].map(i=>[v("ly"+i),n("lp"+i)/100]).filter(l=>l[0]&&l[1]>0);
   const sizes=[0,1,2].map(i=>{const lab=v("sl"+i).trim(),sz=v("ss"+i).trim();if(!lab&&!sz&&!v("sp"+i))return null;const dd=num(v("sd"+i)),mm=num(v("sm"+i));
     return {label:keep(ss[i]?ss[i].label:"",lab),size:sz,dose:isFinite(dd)?dd:n("eDose"),yield:isFinite(dd)?(n("eDose")?dd*n("eYield")/n("eDose"):dd*2):n("eYield"),milk:isFinite(mm)?mm:n("eMilk"),price:num(v("sp"+i))||0}}).filter(Boolean);
   return Object.assign({},d,{name:keep(d.name,v("eName").trim()),sub:keep(d.sub,v("eSub").trim()),cat:v("eCat"),cup:v("eCup"),size:v("eSize").trim(),iced:v("eIced")==="1",price:n("ePrice"),dose:n("eDose"),yield:n("eYield"),time:v("eTime").trim(),milk:n("eMilk"),powder:n("ePowder"),powderPrice:n("ePowderPrice"),extra:n("eExtra"),sizes,layers,hidden:$("#eHidden").checked,amt:keepList(d.amt,v("eAmt")),steps:keepList(d.steps,v("eSteps"))})};
 $("#dlgBody").oninput=()=>{$("#dlgArt").innerHTML=cupSVG(read())};$("#dlgBody").onchange=$("#dlgBody").oninput;
 $("#dlgBody").onclick=e=>{const b=e.target.closest("[data-shot]");if(!b)return;const[a,c]=b.dataset.shot.split("|");$("#eDose").value=a;$("#eYield").value=c;if(!+a)$("#eTime").value="";else if(!$("#eTime").value)$("#eTime").value="27–30 s";$("#dlgBody").oninput()};
 $("#eCancel").onclick=()=>dlg.close();
 $("#eSave").onclick=()=>{const nd=read();if(!L(nd.name)){$("#eErr").hidden=false;return}delete nd.isNew;const i=S.menu.findIndex(x=>x.id===nd.id);if(i>=0)S.menu[i]=nd;else S.menu.push(nd);save();$("#dlgBody").oninput=$("#dlgBody").onchange=$("#dlgBody").onclick=null;dlg.close();toast(T("Saved","Opgeslagen"));VIEWS.recipes()};
}
function editOpts(){
 const sec=(k,title,hint)=>`<h3>${title}</h3><p class="hint" style="margin:0">${hint}</p>${S.opts[k].map((o,i)=>`<div class="row" style="flex-wrap:nowrap;gap:6px"><input data-on="${k}|${i}" value="${esc(L(o.n))}" aria-label="${T("Name","Naam")}"><input data-op="${k}|${i}" class="num" inputmode="decimal" value="${o.p}" style="width:80px;flex:none" aria-label="${T("Extra charge €","Toeslag €")}"><button type="button" class="ghost" data-odel="${k}|${i}" aria-label="${T("Remove","Verwijderen")}" style="padding:8px 12px;flex:none">✕</button></div>`).join("")}
  <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="new_${k}" placeholder="${k==="milks"?T("e.g. Coconut milk","bijv. Kokosmelk"):T("e.g. Oat cream topping","bijv. Haverroom topping")}"><button type="button" class="btn" data-oadd="${k}">${T("Add","Toevoegen")}</button></div>`;

 V(`<h2>${T("Order planner","Bestelplanner")}</h2><p class="hint">${T("Average drinks per day → beans, milk and powders to order.","Gemiddeld aantal drankjes per dag → bonen, melk en poeders om te bestellen.")}</p><div class="panel"><div class="grid">
 ${S.menu.map(d=>`<label class="field"><span>${esc(L(d.name))} ${T("/ day","/ dag")}</span><input class="num" inputmode="numeric" data-p="${d.id}" value="${p[d.id]??20}"></label>`).join("")}
 <label class="field"><span>${T("Open days / week","Open dagen / week")}</span><input class="num" id="oDays" value="${p.days??6}"></label><label class="field"><span>${T("Order covers (days)","Bestelling voor (dagen)")}</span><input class="num" id="oCover" value="${p.cover??7}"></label><label class="field"><span>${T("Safety buffer %","Veiligheidsmarge %")}</span><input class="num" id="oBuf" value="${p.buf??15}"></label></div><div class="out" id="oOut"></div></div>`);
 const run=()=>{S.menu.forEach(d=>p[d.id]=num($(`[data-p="${d.id}"]`).value)||0);p.days=num($("#oDays").value)||6;p.cover=num($("#oCover").value)||7;p.buf=num($("#oBuf").value)||0;save();
   let g=0,ml=0,n=0;const pw={};S.menu.forEach(d=>{const q=p[d.id];g+=q*(d.dose||0)*1.08;ml+=q*(d.milk||0)*1.1;n+=q;if(d.powder){const k=L(d.name);pw[k]=(pw[k]||0)+q*d.powder*1.05}});const f=(1+p.buf/100)*p.cover;
   const pws=Object.entries(pw).map(([k,v])=>`${esc(k)}: <b>${fmt(v*f/1000,2)} kg</b>`).join(" · ");
   $("#oOut").innerHTML=`${T("Per day","Per dag")}: <b>${n}</b> ${T("drinks","drankjes")} · <b>${fmt(g/1000,2)} kg</b> ${T("beans","bonen")} · <b>${fmt(ml/1000,1)} L</b> ${T("milk","melk")}<br>${T("Order for","Bestel voor")} ${p.cover} ${T("days","dagen")}: <span class="big">${fmt(g*f/1000,1)} kg</span> ${T("beans","bonen")} · <span class="big">${fmt(ml*f/1000,0)} L</span> ${T("milk","melk")}${pws?`<br>${T("Powders","Poeders")}: ${pws}`:""}<br><small>${T("Includes 8 % coffee waste (purges, dialling in) and 10 % milk waste. Order beans so they arrive 5–7 days after roasting.","Inclusief 8 % koffieverlies (wegmalen, afstellen) en 10 % melkverlies. Bestel bonen zo dat ze 5–7 dagen na het branden binnen zijn.")}</small>`};
 $("#view").oninput=run;run();
};

VIEWS.breakeven=()=>{
 CALCS.be=v=>{const fixed=v.rent+v.staff+v.other+v.lease,perCup=v.avg/(1+v.vat/100)-v.cost,cups=fixed/perCup,day=cups/v.days;
   return `${T("Monthly fixed costs","Vaste kosten per maand")} <b>${eur(fixed)}</b> · ${T("profit per drink","winst per drankje")} ${eur(perCup)}<br>${T("Break-even","Break-even")}: <span class="big">${fmt(cups,0)}</span> ${T("drinks / month","drankjes / maand")} ≈ <span class="big">${fmt(day,0)}</span> ${T("per open day","per open dag")}<br><small>${T("Everything above that is profit before tax.","Alles daarboven is winst voor belasting.")}</small>`};
 V(`<h2>${T("Break-even","Break-even")}</h2><p class="hint">${T("How many drinks a day pay the bills.","Hoeveel drankjes per dag de rekeningen betalen.")}</p>`+calc("be",T("Per month","Per maand"),T("Rough figures are fine.","Ruwe schattingen zijn prima."),[["rent",T("Rent €","Huur €"),sv("be","rent",2500)],["staff",T("Staff wages €","Loonkosten €"),sv("be","staff",6000)],["other",T("Energy, water, insurance, other €","Energie, water, verzekering, overig €"),sv("be","other",1200)],["lease",T("Machine & grinder lease/loan €","Lease/lening machine & molen €"),sv("be","lease",350)],["avg",T("Average drink price incl. VAT €","Gemiddelde prijs incl. btw €"),sv("be","avg",3.9)],["vat",T("VAT %","Btw %"),sv("be","vat",9)],["cost",T("Avg cost per drink €","Gem. kosten per drankje €"),sv("be","cost",0.75)],["days",T("Open days / month","Open dagen / maand"),sv("be","days",26)]]));
 wire();
};

/* routines: the boss's own lists; each section {id,name,weekly,items:[{id,t}]} */
const uid=()=>Math.random().toString(36).slice(2,9);
const defRoutines=()=>Object.entries(ROUTINES).map(([k,[name,list]])=>({id:k,name,weekly:k==="weekly",items:list.map((t,i)=>({id:k+i,t}))}));
if(!Array.isArray(S.routines))S.routines=defRoutines();
let rEdit=false;
VIEWS.routine=()=>{
 const today=new Date().toISOString().slice(0,10);if(S.clean.day!==today)S.clean={day:today};
 const boss=S.role==="boss";if(!boss)rEdit=false;
 const head=`<div class="row spread" style="margin-bottom:6px"><h2 style="margin:0">${boss?T("Cleaning & routines","Schoonmaak & routines"):T("Daily routines","Dagelijkse routines")}</h2>${boss?`<button type="button" class="${rEdit?"btn":"ghost"}" id="rToggle">${rEdit?T("Done","Klaar"):T("Edit lists","Lijsten bewerken")}</button>`:""}</div>`;
 if(!rEdit){
  V(head+`<p class="hint">${T("Tick as you go. Resets every day.","Vink af terwijl je werkt. Elke dag opnieuw.")}${boss?" "+T("Tap “Edit lists” to make these your café's own.","Tik op ‘Lijsten bewerken’ om ze aan te passen aan je café."):""}</p>`+
  (S.routines.length?S.routines.map(sec=>{const d=sec.items.filter(it=>S.clean[it.id]).length;return `<div class="panel"><div class="row spread"><h3>${esc(L(sec.name))}</h3><span class="hint">${d}/${sec.items.length}</span></div>${sec.items.map(it=>`<label class="check"><input type="checkbox" data-c="${it.id}"${S.clean[it.id]?" checked":""}><span>${esc(L(it.t))}</span></label>`).join("")||`<p class="hint">${T("No tasks yet.","Nog geen taken.")}</p>`}</div>`}).join(""):`<p class="hint">${T("No lists yet.","Nog geen lijsten.")}</p>`));
  $("#view").onchange=e=>{const c=e.target.dataset.c;if(c){S.clean[c]=e.target.checked;save();VIEWS.routine()}};
 }else{
  V(head+`<p class="hint">${T("Change any task, add your own, remove what you don't do, or start a new list (e.g. “Milk fridge” or “Saturday deep clean”). Changes save straight away.","Pas elke taak aan, voeg je eigen taken toe, haal weg wat je niet doet, of begin een nieuwe lijst (bijv. ‘Melkkoelkast’ of ‘Grote schoonmaak zaterdag’). Wijzigingen worden meteen bewaard.")}</p>`+
  S.routines.map((sec,si)=>`<div class="panel" style="display:flex;flex-direction:column;gap:8px">
   <div class="row" style="flex-wrap:nowrap"><input id="sn_${sec.id}" data-sname="${si}" value="${esc(L(sec.name))}" aria-label="${T("List name","Naam lijst")}" style="font-weight:600"></div>
   <div class="row" style="gap:6px"><button type="button" class="ghost" data-up="${si}"${si?"":" disabled"} aria-label="${T("Move up","Omhoog")}">↑</button><button type="button" class="ghost" data-down="${si}"${si<S.routines.length-1?"":" disabled"} aria-label="${T("Move down","Omlaag")}">↓</button><button type="button" class="ghost" data-delsec="${si}">${T("Delete list","Lijst verwijderen")}</button></div>
   ${sec.items.map((it,ii)=>`<div class="row" style="flex-wrap:nowrap;gap:6px"><textarea id="it_${it.id}" data-item="${si}|${ii}" rows="2" style="min-height:0;resize:none;font-size:15px" aria-label="${T("Task","Taak")}">${esc(L(it.t))}</textarea><button type="button" class="ghost" data-iup="${si}|${ii}"${ii?"":" disabled"} aria-label="${T("Move up","Omhoog")}" style="padding:8px 10px">↑</button><button type="button" class="ghost" data-idel="${si}|${ii}" aria-label="${T("Remove task","Taak verwijderen")}" style="padding:8px 12px">✕</button></div>`).join("")}
   <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="new_${sec.id}" data-new="${si}" placeholder="${T("New task, e.g. Clean the milk fridge","Nieuwe taak, bijv. Melkkoelkast schoonmaken")}"><button type="button" class="btn" data-add="${si}">${T("Add","Toevoegen")}</button></div></div>`).join("")+
  `<div class="panel"><h3>${T("New list","Nieuwe lijst")}</h3><div class="row" style="flex-wrap:nowrap;gap:6px"><input id="newSec" placeholder="${T("e.g. Saturday deep clean","bijv. Grote schoonmaak zaterdag")}"><button type="button" class="btn" id="addSec">${T("Add list","Lijst toevoegen")}</button></div></div>
  <div class="row"><button type="button" class="ghost" id="rClear">${T("Clear everything and start empty","Alles wissen en leeg beginnen")}</button><button type="button" class="ghost" id="rReset">${T("Back to the standard lists","Terug naar de standaardlijsten")}</button></div>`);
  const v=$("#view"),rr=()=>{save();VIEWS.routine()},ix=s=>s.split("|").map(Number);
  // typing edits text in place; no re-render so the keyboard stays open
  v.oninput=e=>{const a=e.target.dataset;if(a.sname!=null){S.routines[a.sname].name=e.target.value;save()}if(a.item){const[si,ii]=ix(a.item);S.routines[si].items[ii].t=e.target.value;save()}};
  const addItem=si=>{const inp=$(`[data-new="${si}"]`),t=inp.value.trim();if(!t)return;S.routines[si].items.push({id:uid(),t});save();VIEWS.routine();const n=$(`[data-new="${si}"]`);n&&n.focus()};
  v.onkeydown=e=>{if(e.key!=="Enter")return;const a=e.target.dataset;if(a.new!=null)addItem(+a.new);if(e.target.id==="newSec")$("#addSec").click()};
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset;
   if(b.id==="rToggle"){e.stopPropagation();rEdit=false;VIEWS.routine();return}
   if(a.add!=null)return addItem(+a.add);
   if(a.idel){const[si,ii]=ix(a.idel);S.routines[si].items.splice(ii,1);return rr()}
   if(a.iup){const[si,ii]=ix(a.iup),l=S.routines[si].items;[l[ii-1],l[ii]]=[l[ii],l[ii-1]];return rr()}
   if(a.up!=null){const i=+a.up,l=S.routines;[l[i-1],l[i]]=[l[i],l[i-1]];return rr()}
   if(a.down!=null){const i=+a.down,l=S.routines;[l[i+1],l[i]]=[l[i],l[i+1]];return rr()}
   if(a.delsec!=null)return twice(b,()=>{S.routines.splice(+a.delsec,1);rr()});
   if(b.id==="addSec"){const t=$("#newSec").value.trim();if(!t)return;S.routines.push({id:uid(),name:t,items:[]});rr();const n=$(`[data-new="${S.routines.length-1}"]`);n&&n.focus();return}
   if(b.id==="rClear")return twice(b,()=>{S.routines=[];rr()});
   if(b.id==="rReset")return twice(b,()=>{S.routines=defRoutines();rr()});
  };
  return;
 }
 const t=$("#rToggle");if(t)t.onclick=e=>{e.stopPropagation();rEdit=true;VIEWS.routine()};
};

VIEWS.machine=()=>{const m=mach();
 V(`<div class="panel"><h2>${esc(m.brand+" "+m.name)}</h2><p class="hint">${mtype(m)} · ${m.groups} ${T("groups","groepen")}. ${esc(L(m.note))}</p>${!S.cafe?`<p class="note">${T("Your manager hasn't set the café's machine yet; this is the default.","Je manager heeft de machine van het café nog niet ingesteld; dit is de standaard.")}</p>`:""}</div>
 <h3>${T("What this machine does, and how to use it","Wat deze machine kan, en hoe je het gebruikt")}</h3>${m.feat.map(f=>`<div class="panel"><h3>${L(FUNCS[f][0])}</h3><p>${L(FUNCS[f][1])}</p><p class="note"><b>${T("How","Hoe")}:</b> ${L(FUNCS[f][2])}</p></div>`).join("")}
 <details class="panel"><summary>${T("Functions this machine doesn't have","Functies die deze machine niet heeft")}</summary>${Object.keys(FUNCS).filter(f=>!m.feat.includes(f)).map(f=>`<p><b>${L(FUNCS[f][0])}</b> — ${L(FUNCS[f][1])}</p>`).join("")}</details>
 <p class="hint">${T("Exact buttons differ per model year. Keep the manufacturer's manual by the machine.","De precieze knoppen verschillen per bouwjaar. Houd de handleiding bij de machine.")}</p>`)};

VIEWS.grinder=()=>{const g=grind(),step=g.adj!=="dial"||true;
 V(`<div class="panel"><h2>${esc(g.brand+" "+g.name)}</h2><p class="hint">${burr(g.burr)} · ${L(ADJ[g.adj])}</p><p>${esc(L(g.note))}</p><div>${g.feat.map(f=>`<span class="tag on">${L(GF[f])}</span>`).join("")}</div></div>
 <div class="panel"><h3>${T("How to adjust","Zo stel je bij")}</h3><ul>
 <li>${T("<b>Shot too fast / sour</b> → grind <b>finer</b>. <b>Too slow / bitter</b> → <b>coarser</b>.","<b>Shot te snel / zuur</b> → <b>fijner</b> malen. <b>Te langzaam / bitter</b> → <b>grover</b>.")}</li>
 <li>${T("Move in small steps; on a stepless grinder a tiny turn is enough.","Draai in kleine stapjes; bij een traploze molen is een heel klein beetje genoeg.")}</li>
 <li>${T("After every change, purge one dose (the old grind is still in the chute) before the next check shot.","Maal na elke wijziging één dosis weg (de oude maling zit nog in de uitloop) voor de volgende controleshot.")}</li>
 <li>${T("Adjust while the motor runs, so beans don't jam between the burrs.","Stel bij terwijl de motor draait, zodat er geen bonen klem raken tussen de schijven.")}</li>
 ${g.feat.includes("gbw")?`<li>${T("Grind by weight: set the dose in grams; check it on a scale weekly.","Malen op gewicht: stel de dosis in grammen in; controleer wekelijks op een weegschaal.")}</li>`:g.feat.includes("time")?`<li>${T("Time dosing: when you go finer, the dose drops. Weigh it and add a little time.","Dosering op tijd: als je fijner gaat, wordt de dosis kleiner. Weeg na en zet er wat tijd bij.")}</li>`:""}</ul></div>
 <div class="panel"><h3>${T("Dose check","Dosiscontrole")}</h3><p class="hint">${T("Weigh three doses in a row. They should be within ±0.2 g of the house dose.","Weeg drie doses achter elkaar. Ze moeten binnen ±0,2 g van de huisdosis zitten.")}</p></div>`)};

VIEWS.gear=()=>{
 V(`<h2>${T("Commercial equipment guide","Gids professionele apparatuur")}</h2><p class="hint">${T("The 25 espresso machines and 15 grinders you meet most in cafés, and what each can do. Tap one for details.","De 25 espressomachines en 15 molens die je het vaakst in cafés ziet, en wat ze kunnen. Tik er een aan voor details.")}</p>
 <input id="gq" type="search" placeholder="${T("Search, e.g. La Marzocco, gravimetric","Zoek, bijv. La Marzocco, gravimetrisch")}" style="margin-bottom:12px">
 <h3>${T("Espresso machines","Espressomachines")} (${MACHINES.length})</h3><div class="cards" id="gm"></div>
 <h3 style="margin-top:16px">${T("Grinders","Molens")} (${GRINDERS.length})</h3><div class="cards" id="gg"></div>
 <div class="panel" style="margin-top:16px"><h3>${T("All machine functions explained","Alle machinefuncties uitgelegd")}</h3>${Object.values(FUNCS).map(f=>`<details><summary>${L(f[0])}</summary><p>${L(f[1])}</p><p class="note">${L(f[2])}</p></details>`).join("")}</div>
 <p class="hint">${T("Features are for typical current versions; options vary by year and configuration. Check with your dealer.","Functies gelden voor gangbare huidige versies; opties verschillen per jaar en uitvoering. Vraag het je dealer.")}</p>`);
 const boss=S.role==="boss";
 const draw=()=>{const q=$("#gq").value.toLowerCase();
   $("#gm").innerHTML=MACHINES.filter(m=>(m.brand+" "+m.name+" "+mtype(m)+" "+m.feat.map(f=>L(FUNCS[f][0])).join(" ")).toLowerCase().includes(q)).map(m=>`<details class="card eq"><summary><span class="eqIco">${machIco(m)}</span><span class="eqTxt"><b>${esc(m.brand)} ${esc(m.name)}</b><small>${mtype(m)} · ${m.groups} ${T("groups","groepen")}</small></span></summary><p style="font-size:14px">${esc(L(m.note))}</p>${m.feat.map(f=>`<span class="tag on">${L(FUNCS[f][0])}</span>`).join("")}${boss?`<p><button class="ghost" type="button" data-usem="${m.id}">${T("Use in my café","Gebruik in mijn café")}</button></p>`:""}</details>`).join("");
   $("#gg").innerHTML=GRINDERS.filter(g=>(g.brand+" "+g.name+" "+g.burr+" "+g.feat.map(f=>L(GF[f])).join(" ")).toLowerCase().includes(q)).map(g=>`<details class="card eq"><summary><span class="eqIco">${grindIco(g)}</span><span class="eqTxt"><b>${esc(g.brand)} ${esc(g.name)}</b><small>${burr(g.burr)} · ${L(ADJ[g.adj])}</small></span></summary><p style="font-size:14px">${esc(L(g.note))}</p>${g.feat.map(f=>`<span class="tag on">${L(GF[f])}</span>`).join("")}${boss?`<p><button class="ghost" type="button" data-useg="${g.id}">${T("Use in my café","Gebruik in mijn café")}</button></p>`:""}</details>`).join("")};
 $("#gq").oninput=draw;draw();
 $("#view").onclick=e=>{const a=e.target.dataset;if(a.usem){S.machine=a.usem;save();toast(T("Machine set","Machine ingesteld"))}if(a.useg){S.grinder=a.useg;save();toast(T("Grinder set","Molen ingesteld"))}};
};

// Topics: [title, short line, paragraphs[], counter line ("say it like an expert")]
const KTOPICS=[
 [B("Where coffee comes from","Waar koffie vandaan komt"),B("From Ethiopian forests to every café in the world.","Van Ethiopische bossen naar elk café ter wereld."),
  [B("Coffee grows wild in the forests of south-west Ethiopia. The legend says a goat herder, Kaldi, saw his goats dance after eating the red berries.","Koffie groeit wild in de bossen van zuidwest-Ethiopië. Volgens de legende zag geitenhoeder Kaldi zijn geiten dansen nadat ze de rode bessen hadden gegeten."),
   B("In the 1400s Sufi monks in Yemen drank coffee to stay awake for night prayers. The port of Mocha shipped it to the world, which is where the name 'mocha' comes from.","In de 15e eeuw dronken soefi-monniken in Jemen koffie om wakker te blijven voor nachtgebeden. De haven Mokka verscheepte het naar de wereld; daar komt de naam 'mokka' vandaan."),
   B("Coffee houses spread through Istanbul, Venice, London and Amsterdam in the 1600s. People called them 'penny universities' because you could learn the news for the price of a cup.","In de 17e eeuw verspreidden koffiehuizen zich via Istanbul, Venetië, Londen en Amsterdam. Ze heetten 'penny universities', want voor de prijs van een kop hoorde je het nieuws."),
   B("The Dutch were among the first to grow coffee outside Arabia, on Java in the late 1600s. A plant from the Amsterdam botanical garden became the ancestor of much of Latin America's coffee.","De Nederlanders waren bij de eersten die koffie buiten Arabië verbouwden, eind 17e eeuw op Java. Een plant uit de Amsterdamse Hortus werd de voorouder van veel Latijns-Amerikaanse koffie."),
   B("Espresso was born in Italy around 1900; the lever machines of the 1940s gave us crema.","Espresso ontstond rond 1900 in Italië; de hendelmachines uit de jaren 40 gaven ons crema.")],
  B("“Coffee comes from Ethiopia, and the Dutch helped spread it around the world from Java.”","“Koffie komt uit Ethiopië, en de Nederlanders hielpen het via Java over de wereld te verspreiden.”")],
 [B("The coffee plant and species","De koffieplant en soorten"),B("Arabica, robusta and the rare ones.","Arabica, robusta en de zeldzame.")
  ,[B("Coffee beans are the seeds of a cherry. Each cherry usually holds two beans facing each other; a single round one is a 'peaberry'.","Koffiebonen zijn de zaden van een bes. Elke bes heeft meestal twee bonen tegen elkaar; één ronde boon heet een 'peaberry'."),

  B("“This blend has a little robusta for body and crema.”","“Deze blend heeft een beetje robusta voor body en crema.”")],

  [B("After picking, the fruit has to come off the seed. How that happens changes the taste a lot.","Na het plukken moet het vruchtvlees van de boon. Hoe dat gebeurt verandert de smaak flink."),
   B("Washed: fruit removed with water before drying. Clean, bright and clear; typical for Kenya, Colombia and Central America.","Gewassen (washed): het vruchtvlees wordt met water verwijderd voor het drogen. Schoon, fris en helder; typisch voor Kenia, Colombia en Midden-Amerika."),

  B("“It's a natural process, so expect more fruit and sweetness.”","“Het is een natural verwerking, dus verwacht meer fruit en zoetheid.”")],
 [B("Roasting","Branden"),B("Light, medium, dark: what heat does to a bean.","Licht, medium, donker: wat hitte met een boon doet."),
  [B("Green coffee is roasted at about 200–230 °C for 8–15 minutes. Sugars caramelise and hundreds of aromas form.","Groene koffie wordt ongeveer 8–15 minuten gebrand op 200–230 °C. Suikers karamelliseren en er ontstaan honderden aroma's."),
   B("'First crack' is a popping sound when the bean expands; light roasts stop soon after. 'Second crack' comes later; dark roasts go into it and taste smoky and bitter.","De 'first crack' is een knappend geluid als de boon uitzet; lichte brandingen stoppen kort daarna. De 'second crack' komt later; donkere brandingen gaan daarin door en smaken rokerig en bitter."),
   B("Light roast: shows the origin: fruity, floral, more acidity. Medium: balanced, caramel and nuts. Dark: chocolate, roast, less acidity, the bean's origin is harder to taste.","Lichte branding: laat de herkomst zien: fruitig, bloemig, meer frisheid. Medium: in balans, karamel en noten. Donker: chocolade, branding, minder frisheid; de herkomst proef je minder."),
   B("Coffee needs a few days' rest after roasting to release CO₂; espresso is usually best 7–30 days after roasting.","Koffie moet na het branden een paar dagen rusten om CO₂ kwijt te raken; espresso is meestal het best 7–30 dagen na het branden."),
   B("Darker does not mean more caffeine; per bean it's about the same.","Donkerder betekent niet meer cafeïne; per boon is het ongeveer gelijk.")],
  B("“It's a lighter roast, so you taste more of where it comes from.”","“Het is een lichtere branding, dus je proeft meer van waar hij vandaan komt.”")],
 [B("How to taste and describe coffee","Koffie proeven en beschrijven"),B("The words experts use.","De woorden die experts gebruiken."),
  [B("Acidity: the bright, juicy, lively feeling, like fruit. Not the same as sour, which is unpleasant and comes from under-extraction.","Frisheid (aciditeit): het heldere, sappige, levendige gevoel, zoals bij fruit. Niet hetzelfde als zuur, dat onaangenaam is en van onderextractie komt."),
   B("Sweetness: caramel, honey, brown sugar, ripe fruit. Good coffee is sweet without sugar.","Zoetheid: karamel, honing, bruine suiker, rijp fruit. Goede koffie is zoet zonder suiker."),
   B("Body: how heavy it feels in the mouth: light like tea, or thick like syrup.","Body: hoe zwaar het in de mond voelt: licht als thee, of dik als siroop."),
   B("Aftertaste (finish): what stays after you swallow. Long and sweet is good; dry and bitter is not.","Nasmaak (afdronk): wat blijft na het doorslikken. Lang en zoet is goed; droog en bitter niet."),
   B("Flavour families: fruity (berries, citrus), floral (jasmine), nutty and chocolate, caramel, spicy, earthy. Name two or three you really taste; don't guess.","Smaakfamilies: fruitig (bessen, citrus), bloemig (jasmijn), nootachtig en chocolade, karamel, kruidig, aards. Noem er twee of drie die je echt proeft; niet gokken.")],
  B("“It's sweet with notes of milk chocolate and a little red fruit, and a long finish.”","“Hij is zoet met tonen van melkchocolade en een beetje rood fruit, en een lange afdronk.”")],
 [B("Brewing methods","Zetmethodes"),B("Espresso, filter, French press and more.","Espresso, filter, French press en meer."),
  [B("Espresso: hot water pushed through finely ground coffee at about 9 bar in 25–30 s. Short, strong, with crema.","Espresso: heet water dat met ongeveer 9 bar in 25–30 s door fijngemalen koffie wordt geperst. Kort, sterk, met crema."),
   B("Pour-over (V60, Chemex, Kalita): water poured by hand through a paper filter. Clean and clear; shows the origin well.","Pour-over (V60, Chemex, Kalita): water met de hand door een papieren filter gegoten. Schoon en helder; laat de herkomst goed zien."),
   B("Batch brew: a filter machine making litres at once; great for busy mornings.","Batch brew: een filtermachine die liters tegelijk maakt; ideaal voor drukke ochtenden."),
   B("French press: coffee steeps 4 minutes, then a metal mesh is pressed down. Full-bodied, a bit of sediment.","French press: de koffie trekt 4 minuten en dan duw je een metalen zeef naar beneden. Vol, met een beetje drab."),
   B("AeroPress, moka pot, siphon and cold brew (coffee steeped 12–24 h in cold water: smooth, low bitterness) are other popular ways.","AeroPress, moka pot, sifon en cold brew (koffie die 12–24 uur in koud water trekt: zacht, weinig bitter) zijn andere populaire manieren.")],
  B("“For this single origin I'd recommend it as filter: you'll taste the fruit better.”","“Deze single origin raad ik als filter aan: dan proef je het fruit beter.”")],
 [B("Caffeine and health","Cafeïne en gezondheid"),B("Answers to the questions guests ask.","Antwoorden op vragen die gasten stellen."),
  [B("A single espresso has about 60–80 mg of caffeine; a mug of filter coffee often has more (100–150 mg) because it's a bigger drink.","Een enkele espresso heeft ongeveer 60–80 mg cafeïne; een mok filterkoffie vaak meer (100–150 mg), omdat het een groter drankje is."),
   B("Health authorities in Europe say up to about 400 mg a day is fine for most adults, and about 200 mg a day during pregnancy.","Europese gezondheidsinstanties zeggen dat tot ongeveer 400 mg per dag voor de meeste volwassenen prima is, en ongeveer 200 mg per dag tijdens de zwangerschap."),
   B("Decaf has most caffeine removed (at least 97 %) using water, CO₂ or a solvent. Swiss Water decaf uses only water.","Bij cafeïnevrij is het meeste cafeïne verwijderd (minstens 97 %) met water, CO₂ of een oplosmiddel. Swiss Water-decaf gebruikt alleen water."),
   B("For medical questions, guests should ask their doctor; you can tell them what's in the drink.","Bij medische vragen moeten gasten hun arts vragen; jij kunt vertellen wat er in het drankje zit.")],
  B("“A double espresso has roughly the same caffeine as a mug of filter coffee.”","“Een dubbele espresso heeft ongeveer evenveel cafeïne als een mok filterkoffie.”")],
 [B("Fair trade, specialty and price","Fairtrade, specialty en prijs"),B("Why some coffee costs more.","Waarom sommige koffie meer kost."),
  [B("About 12.5 million farms grow coffee, most of them small family farms.","Ongeveer 12,5 miljoen boerderijen verbouwen koffie, de meeste kleine familiebedrijven."),
   B("'Specialty coffee' scores 80+ points out of 100 when tasted by trained graders. It's traceable, often to a single farm.","'Specialty coffee' scoort 80+ van de 100 punten bij geschoolde proevers. Het is traceerbaar, vaak tot één boerderij."),
   B("Labels like Fairtrade and Rainforest Alliance set minimum standards. 'Direct trade' means the roaster buys directly from the farmer, often paying well above market price.","Keurmerken zoals Fairtrade en Rainforest Alliance stellen minimumeisen. 'Direct trade' betekent dat de brander direct bij de boer koopt, vaak ruim boven de marktprijs."),
   B("The Netherlands is one of the biggest coffee drinkers in the world: around 2–3 cups per person per day.","Nederland is een van de grootste koffiedrinkers ter wereld: zo'n 2–3 koppen per persoon per dag.")],
  B("“Our roaster buys this directly from the farm, so the farmer gets a better price.”","“Onze brander koopt dit direct bij de boerderij, dus de boer krijgt een betere prijs.”")]

VIEWS.know=()=>{
 const tabs=[["topics",T("The basics","De basis")],["origins",T("Countries","Landen")],["world",T("Coffee around the world","Koffie in de wereld")],["facts",T("Fun facts","Leuke weetjes")]];
 let body="";
 if(kTab==="topics")body=`<div class="cards">${KTOPICS.map((t,i)=>`<button type="button" class="card ktop" data-kt="${i}" style="cursor:pointer"><span class="kicon" aria-hidden="true">${KICONS[i]||""}</span><span><b>${L(t[0])}</b><small>${L(t[1])}</small></span></button>`).join("")}</div>`;
 if(kTab==="origins"){const regs=[["all",T("All","Alles")],["africa",T("Africa & Arabia","Afrika & Arabië")],["americas",T("The Americas","Amerika")],["asia",T("Asia & Pacific","Azië & Pacific")]];
  body=`<nav class="menu" style="padding-top:0;margin-bottom:10px">${regs.map(([k,l])=>`<button type="button" data-kr="${k}" aria-current="${kReg===k}">${l}</button>`).join("")}</nav><div class="cards">${KORIGINS.filter(o=>kReg==="all"||o[1]===kReg).map(o=>`<div class="card"><b>${S.lang==="nl"?o[4]:o[0]}</b><p style="margin:4px 0;font-size:14px">${L(o[2])}</p><small>${L(o[3])}</small></div>`).join("")}</div>`}
 if(kTab==="world")body=`<div class="cards">${KWORLD.map(w=>`<div class="card"><b>${w[1]} ${esc(w[0])}</b><small>${L(w[2])}</small><p style="margin:4px 0 0;font-size:14px">${L(w[3])}</p></div>`).join("")}</div>`;
 if(kTab==="facts")body=`<div class="panel"><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${KFACTS.map(f=>`<li>${L(f)}</li>`).join("")}</ul></div>`;
 V(`<div class="panel"><h2>${T("Coffee knowledge","Koffiekennis")}</h2><p class="hint" style="margin-bottom:0">${T("Everything to talk about coffee like an expert: where it comes from, how it's grown and roasted, how to describe it, and how the world drinks it.","Alles om als een expert over koffie te praten: waar het vandaan komt, hoe het wordt verbouwd en gebrand, hoe je het beschrijft en hoe de wereld het drinkt.")}</p></div>
 <nav class="menu" style="padding-top:0;margin-bottom:10px">${tabs.map(([k,l])=>`<button type="button" data-ktab="${k}" aria-current="${kTab===k}">${l}</button>`).join("")}</nav>${body}`);
 $("#view").onclick=e=>{const a=e.target.closest("[data-ktab],[data-kr],[data-kt]");if(!a)return;const d=a.dataset;
  if(d.ktab){kTab=d.ktab;return VIEWS.know()}if(d.kr){kReg=d.kr;return VIEWS.know()}
  const t=KTOPICS[+d.kt];openDlg(`<span class="kicon kbig">${KICONS[+d.kt]||""}</span>`,`<h2>${L(t[0])}</h2><p class="hint" style="margin:0">${L(t[1])}</p><ul>${t[2].map(p=>`<li>${L(p)}</li>`).join("")}</ul><div class="out"><b>${T("Say it at the counter","Zeg het aan de toonbank")}</b><br>${L(t[3])}</div>`)};
};

/* ---------- several cafés under one owner ----------
   Each café keeps its own copy of the fields below. The open café's copy lives directly on S
   (so every screen keeps working unchanged); switching swaps it with the stored copy. */
const PER_CAFE=["cafe","machine","grinder","staff","signoff","quiz","menu","menuVer","opts","routines","clean","costs","plan","me","bonus"];
function stashCafe(){if(!S.cafes)return;const c={};PER_CAFE.forEach(k=>{if(S[k]!==undefined)c[k]=S[k]});S.cafes[S.cur]=JSON.parse(JSON.stringify(c))}
function ensureCafeDefaults(){
 if(!S.machine)S.machine="lm-linea-pb";if(!S.grinder)S.grinder="mk-e65s";if(S.cafe==null)S.cafe="";
 if(!Array.isArray(S.staff))S.staff=[];["signoff","quiz","clean","costs","plan"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});
 if(!Array.isArray(S.menu)){S.menu=DEFAULT_MENU.map(fromTpl);S.menuVer=2}
 if(!S.opts)S.opts=DEF_OPTS();if(!Array.isArray(S.routines))S.routines=defRoutines();
 if(!S.bonus)S.bonus={[SKILLS.length-1]:0.1};
}
function loadCafe(id){if(!S.cafes||!S.cafes[id])return;stashCafe();S.cur=id;const c=JSON.parse(JSON.stringify(S.cafes[id]));PER_CAFE.forEach(k=>{S[k]=c[k]});ensureCafeDefaults()}
const cafeName=(id,i)=>{const c=id===S.cur?S:S.cafes[id];return (c&&c.cafe)||T("Café","Café")+" "+(i+1)};
if(!S.cafes){S.cur="c1";S.cafes={};ensureCafeDefaults();stashCafe()}else{ensureCafeDefaults()}
// keep the stored copy of the open café up to date on every save
{const _save=save;save=()=>{stashCafe();_save()}}

function renderCafeBar(){const el=$("#cafeBar");if(!el)return;const ids=Object.keys(S.cafes||{});
 if(ids.length<2){el.hidden=true;el.innerHTML="";return}
 el.hidden=false;el.innerHTML=`<label class="cafeSel"><span>${T("Café","Café")}</span><select id="cafeSel" aria-label="${T("Choose café","Kies café")}">${ids.map((id,i)=>`<option value="${id}"${id===S.cur?" selected":""}>${esc(cafeName(id,i))}</option>`).join("")}</select></label>`;
 $("#cafeSel").onchange=e=>{loadCafe(e.target.value);save();go();toast(T("Switched to ","Gewisseld naar ")+cafeName(S.cur,ids.indexOf(S.cur)))}}
{const _rm=renderMenu;renderMenu=function(){_rm();renderCafeBar()}}

function cafesPanel(){const ids=Object.keys(S.cafes);stashCafe();
 const stat=id=>{const c=S.cafes[id],st=c.staff||[],so=c.signoff||{};const trained=st.filter(n=>REQ.every(k=>(so[n]||{})[k]==="ok")).length,ask=st.reduce((a,n)=>a+SKILLS.filter((_,k)=>(so[n]||{})[k]==="ask").length,0);
   const m=MACHINES.find(x=>x.id===c.machine);return `${st.length} ${T("staff","personeel")} · ${trained} ${T("fully trained","volledig getraind")}${ask?` · <b class="warnT">${ask} ${T("to sign off","af te tekenen")}</b>`:""}${m?` · ${esc(m.brand+" "+m.name)}`:""}`};
 return `<div class="panel" id="cafesPanel"><h2>${T("Your cafés","Jouw cafés")}</h2><p class="hint">${T("Each café has its own staff, training, drinks, prices, cleaning lists and gear. Switch café at the top of the screen.","Elk café heeft eigen personeel, training, drankjes, prijzen, schoonmaaklijsten en apparatuur. Wissel van café bovenaan het scherm.")}</p>
 <div style="display:flex;flex-direction:column;gap:8px">${ids.map((id,i)=>`<div class="cafeRow${id===S.cur?" cur":""}"><span style="min-width:0"><b>${esc(cafeName(id,i))}</b>${id===S.cur?` <span class="tag on">${T("open now","nu open")}</span>`:""}<br><small class="hint">${stat(id)}</small></span>${id===S.cur?"":`<button type="button" class="ghost" data-open-cafe="${id}">${T("Open","Openen")}</button>`}</div>`).join("")}</div>
 <details style="margin-top:10px"><summary>${T("Add a café","Café toevoegen")}</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
  <label class="field"><span>${T("Name of the new café","Naam van het nieuwe café")}</span><input id="ncName" placeholder="${T("e.g. Corner Coffee Centrum","bijv. Koffie Hoek Centrum")}"></label>
  <label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" id="ncCopy" checked style="width:22px;height:22px;min-height:0;flex:none"><span>${T("Copy drinks, milk and extras, cleaning lists, gear and prices from","Kopieer drankjes, melk en extra's, schoonmaaklijsten, apparatuur en prijzen van")} <b>${esc(cafeName(S.cur,ids.indexOf(S.cur)))}</b></span></label>
  <p class="hint" style="margin:0">${T("Staff and training are not copied: every café starts with its own team.","Personeel en training worden niet gekopieerd: elk café begint met een eigen team.")}</p>
  <button type="button" class="btn" id="ncAdd">${T("Add café","Café toevoegen")}</button><p class="hint badT" id="ncErr" hidden>${T("Give the café a name.","Geef het café een naam.")}</p></div></details>
 ${ids.length>1?`<button type="button" class="ghost" id="delCafe" style="margin-top:10px">${T("Delete this café","Dit café verwijderen")}</button>`:""}</div>`}
function wireCafes(){
 document.querySelectorAll("[data-open-cafe]").forEach(b=>b.onclick=()=>{loadCafe(b.dataset.openCafe);save();go()});
 const add=$("#ncAdd");if(add)add.onclick=()=>{const name=$("#ncName").value.trim();if(!name){$("#ncErr").hidden=false;return}
   stashCafe();const id="c"+Date.now().toString(36),src=S.cafes[S.cur],c={cafe:name};
   if($("#ncCopy").checked)["machine","grinder","menu","menuVer","opts","routines","costs","bonus"].forEach(k=>{if(src[k]!==undefined)c[k]=JSON.parse(JSON.stringify(src[k]))});
   S.cafes[id]=c;loadCafe(id);save();go();toast(T("Café added: ","Café toegevoegd: ")+name)};
 const del=$("#delCafe");if(del)del.onclick=()=>twice(del,()=>{const gone=S.cur;delete S.cafes[gone];S.cur=Object.keys(S.cafes)[0];const c=JSON.parse(JSON.stringify(S.cafes[S.cur]));PER_CAFE.forEach(k=>{S[k]=c[k]});ensureCafeDefaults();save();go()});
}
{const _setup=VIEWS.setup;VIEWS.setup=()=>{_setup();$("#view").insertAdjacentHTML("beforeend",cafesPanel());wireCafes();stagger($("#view"));
  const b=$("#cSave");if(b){const o=b.onclick;b.onclick=e=>{o&&o(e);renderCafeBar();const cp=$("#cafesPanel");if(cp){cp.outerHTML=cafesPanel();wireCafes()}}}}}

go();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredInstall=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});addEventListener("appinstalled",()=>{deferredInstall=null;toast(T("Installed. Find Café Lab Business on your home screen.","Geïnstalleerd. Je vindt Café Lab Business op je beginscherm."))});
/* Install bar: one clear way to install, or to get to Chrome when this browser can't install. */
function installBar(o){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;if(standalone)return;
  try{if(localStorage.getItem("cafeLabBusinessInstallHide")==="1")return}catch(e){}
  const ua=navigator.userAgent,android=/android/i.test(ua),ios=/iphone|ipad|ipod/i.test(ua);
  const intent="intent://"+o.url.replace(/^https:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;end";
  const el=document.createElement("div");el.className="instBar";el.setAttribute("role","region");el.setAttribute("aria-label","Install");el.hidden=true;o.place(el);
  let shown=false;
  const close=()=>{el.hidden=true;try{localStorage.setItem("cafeLabBusinessInstallHide","1")}catch(e){}};
  function paint(){const d=o.getDeferred();let h="";
    if(d)h=`<div class="ibTxt"><b>${o.t("Install","Installeer")} ${o.name}</b><span>${o.t("Adds it to your home screen. Works without internet.","Zet het op je beginscherm. Werkt zonder internet.")}</span></div><button type="button" class="ibGo">${o.t("Install","Installeren")}</button>`;
    else if(android)h=`<div class="ibTxt"><b>${o.t("Install","Installeer")} ${o.name}</b><span>${o.t("No Install button? This page is probably open inside another app. Open it in Chrome, then tap Install here. Already installed? Open it from your home screen.","Geen installeerknop? Deze pagina staat waarschijnlijk open in een andere app. Open hem in Chrome en tik hier op Installeren. Al geïnstalleerd? Open hem vanaf je beginscherm.")}</span></div><a class="ibGo" href="${intent}">${o.t("Open in Chrome","Open in Chrome")}</a>`;
    else if(ios)h=`<div class="ibTxt"><b>${o.t("Install","Installeer")} ${o.name}</b><span>${o.t("In Safari, tap Share, then Add to Home Screen.","Tik in Safari op Delen en dan op Zet op beginscherm.")}</span></div>`;
    else{el.hidden=true;return}
    el.innerHTML=h+`<button type="button" class="ibX" aria-label="${o.t("Close","Sluiten")}">✕</button>`;el.hidden=false;shown=true;
    el.querySelector(".ibX").onclick=close;
    const g=el.querySelector("button.ibGo");if(g)g.onclick=async()=>{const dd=o.getDeferred();if(!dd)return;dd.prompt();const r=await dd.userChoice;o.clearDeferred();if(r&&r.outcome==="accepted")el.hidden=true;else paint()}}
  addEventListener("beforeinstallprompt",()=>setTimeout(paint,0));
  addEventListener("appinstalled",()=>{el.hidden=true});
  setTimeout(()=>{if(!shown)paint()},2500);
  return paint;
}

installBar({name:"Café Lab Business",url:"https://tmdpereira2002-cmyk.github.io/cafe-lab-business/",getDeferred:()=>deferredInstall,clearDeferred:()=>{deferredInstall=null},t:T,place:el=>{const h=document.querySelector("header");h.insertAdjacentElement("afterend",el);el.style.margin="12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))"}});

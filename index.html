Object.assign(PT,{"Rest the steam wand in the spout of the jug. The spout is your guide: it holds the wand at the same angle every time and keeps the tip a little off-centre.": "Apoia o vaporizador no bico do jarro. O bico é o teu guia: segura o vaporizador sempre no mesmo ângulo e deixa a ponta um pouco fora do centro.", "Lower the jug until the tip is just under the surface, about 0.5–1 cm deep, with the wand still touching the spout. Off-centre is what makes the milk spin later.": "Baixa o jarro até a ponta ficar mesmo abaixo da superfície, a 0,5–1 cm, com o vaporizador ainda encostado ao bico. Estar fora do centro é o que faz o leite rodar depois.", "As the milk grows, lower the jug slowly, with the wand still resting in the spout, so the tip stays just at the surface.": "À medida que o leite sobe, baixa o jarro devagar, com o vaporizador ainda apoiado no bico, para a ponta ficar sempre à superfície.", "Raise the jug a little so the tip sinks about 1–2 cm, keeping the wand in the spout. The air sound stops and the milk starts to spin.": "Sobe um pouco o jarro para a ponta entrar 1–2 cm, sempre com o vaporizador no bico. O som do ar para e o leite começa a rodar.", "Keep the spin going until the milk is hot. If it stops spinning, tilt the jug a little more while the wand stays in the spout.": "Mantém o leite a rodar até estar quente. Se deixar de rodar, inclina um pouco mais o jarro, com o vaporizador sempre no bico.", "No sound and no spin? The tip is too deep, or the wand has slipped out of the spout to the middle.": "Sem som e sem rodar? A ponta está funda demais, ou o vaporizador saiu do bico para o meio.", "Rests the wand in the spout; tip just under the surface": "Apoia o vaporizador no bico; ponta mesmo abaixo da superfície", "The wand slipped to the centre. Put it back in the spout and tilt the jug a little.": "O vaporizador escorregou para o centro. Volta a apoiá-lo no bico e inclina um pouco o jarro.", "wand in the spout": "vaporizador no bico", "Purge the steam wand, then rest it in the spout of the jug with the tip just under the surface.": "Purga o vaporizador e apoia-o no bico do jarro, com a ponta mesmo abaixo da superfície."});// milk: wand in the spout
Object.assign(PT,{"Affordable heat-exchanger machine for bars. Automatic 5-button or semi-automatic 2-button version, quick steam knobs, VBM 1964 groups.": "Máquina de permutador acessível para bares. Versão automática de 5 botões ou semiautomática de 2 botões, manípulos de vapor rápidos, grupos VBM 1964.", "VBM's first covered machine: retro black body with LEDs. Each group has a 5-button pad with a shot timer and counter; cool-touch wands.": "A primeira máquina carenada da VBM: corpo preto retro com LEDs. Cada grupo tem 5 botões com temporizador e contador; vaporizadores frios ao toque.", "HX² technology: a PID-controlled heater inside each heat exchanger gives every group its own temperature, close to a multi-boiler. A tall version takes 16 oz take-away cups.": "Tecnologia HX²: uma resistência com PID dentro de cada permutador dá a cada grupo a sua temperatura, quase como uma multicaldeira. Há uma versão alta para copos de 16 oz.", "Classic steel machine with VBM 1961 groups (mechanical pre-infusion). Comes as HX, or as Replica 2B with a small boiler per group and a display for temperature and pressure.": "Máquina clássica em aço com grupos VBM 1961 (pré-infusão mecânica). Existe em HX, ou como Replica 2B com uma pequena caldeira por grupo e ecrã de temperatura e pressão.", "Manual (semi-automatic) controls: the barista starts and stops every shot. VBM 1961 groups with mechanical pre-infusion; simple and robust.": "Comandos manuais (semiautomática): o barista começa e para cada extração. Grupos VBM 1961 com pré-infusão mecânica; simples e robusta.", "Lever (piston) machine: pull the lever down and a spring pushes the water through the coffee, with a natural pre-infusion. Classic Italian bar style.": "Máquina de alavanca (pistão): puxas a alavanca e uma mola empurra a água pelo café, com pré-infusão natural. Estilo clássico de bar italiano.", "Multi-boiler: a 0.5 L boiler on each TS group with its own temperature. 4.3\" touch display, low 47.7 cm body so you can talk to guests.": "Multicaldeira: uma caldeira de 0,5 L em cada grupo TS com temperatura própria. Ecrã tátil de 4,3\", corpo baixo de 47,7 cm para falares com os clientes.", "Low energy use (3000 W on 2 groups). Brew temperature settable 90–98 °C, soft infusion at mains pressure, 4.3\" touch display, low 47.7 cm body.": "Baixo consumo (3000 W com 2 grupos). Temperatura regulável 90–98 °C, infusão suave à pressão da rede, ecrã tátil de 4,3\", corpo baixo de 47,7 cm.", "Top VBM home model: dual boiler, 3.5\" touch display, up to 7 pressure profiles. Fine for a small coffee corner, not for a busy bar.": "O modelo doméstico de topo da VBM: duas caldeiras, ecrã tátil de 3,5\", até 7 perfis de pressão. Serve para um pequeno canto de café, não para um bar movimentado.", "Mid-range one-group heat exchanger with an OLED display; water tank or plumbed in. For home, an office or a very small café.": "Permutador de gama média com um grupo e ecrã OLED; com depósito ou ligado à rede. Para casa, escritório ou um café muito pequeno.", "Entry-level VBM home machine with an OLED display. Not built for café volumes.": "Máquina doméstica de entrada da VBM com ecrã OLED. Não foi feita para o volume de um café.", "Current Mahlkönig espresso grinder: weighs every dose with a built-in scale, and with Sync it adjusts its own grind to hit your shot time. Compact.": "O moinho de espresso atual da Mahlkönig: pesa cada dose com uma balança integrada e, com Sync, ajusta sozinho a moagem ao tempo de extração. Compacto.", "Time-dosed version of the E65 Grind-by-Sync, without the built-in scale; Sync still adjusts the grind for you.": "Versão com doseamento por tempo do E65 Grind-by-Sync, sem balança integrada; o Sync continua a ajustar a moagem por ti.", "The bigger Grind-by-Sync grinder for very busy bars: 80 mm burrs, grind by weight and automatic grind adjustment.": "O moinho Grind-by-Sync maior, para bares com muito movimento: mós de 80 mm, moagem por peso e ajuste automático.", "Earlier time-dosed E65S, still in many cafés. Replaced by the E65T Grind-by-Sync.": "O E65S anterior com doseamento por tempo, ainda em muitos cafés. Substituído pelo E65T Grind-by-Sync.", "Grind-by-weight version of the E80S for high volume. Replaced by the E80W Grind-by-Sync.": "Versão do E80S com moagem por peso, para grande volume. Substituído pelo E80W Grind-by-Sync.", "Shorter EK43 for smaller counters, with the same 98 mm burrs. Single-dose espresso, filter and retail bags.": "EK43 mais baixo para balcões pequenos, com as mesmas mós de 98 mm. Espresso em dose única, filtro e pacotes para venda.", "Flagship all-round grinder on EK43 burrs: classic, timed and recipe modes (10 recipes), grind shown in microns, quiet brushless motor.": "Moinho topo de gama para tudo, com mós do EK43: modos clássico, por tempo e por receita (10 receitas), moagem em mícrones, motor sem escovas silencioso.", "Older espresso grinder, still common: grinds on demand with timed doses. Out of production.": "Moinho de espresso mais antigo, ainda comum: mói na hora com doses por tempo. Já não é fabricado.", "Two grinders in one body, with two hoppers: house blend and decaf or a guest coffee. Out of production.": "Dois moinhos num só corpo, com duas tremonhas: lote da casa e descafeinado ou um café convidado. Já não é fabricado.", "High-volume espresso grinder with cooling, the E80's predecessor. Out of production but still found in busy bars.": "Moinho de espresso de grande volume com arrefecimento, antecessor do E80. Já não é fabricado, mas ainda existe em bares movimentados.", "Shop grinder for grinding customers' bags and filter batches. Not for espresso.": "Moinho de loja para moer pacotes dos clientes e fornadas de filtro. Não serve para espresso.", "Compact shop grinder for retail bags. Not for espresso.": "Moinho de loja compacto para pacotes de venda. Não serve para espresso.", "Shop grinder from the same family as the Guatemala, for grinding bags at the counter. Not for espresso.": "Moinho de loja da mesma família do Guatemala, para moer pacotes ao balcão. Não serve para espresso.", "Classic shop grinder for supermarkets and coffee shops. Not for espresso.": "Moinho de loja clássico para supermercados e lojas de café. Não serve para espresso.", "Industrial grinders for roasteries, grinding many kilos per hour. Not a café grinder.": "Moinhos industriais para torrefações, que moem muitos quilos por hora. Não é um moinho de café.", "All-round home grinder for espresso and filter. Too slow for café service.": "Moinho doméstico para espresso e filtro. Demasiado lento para o serviço de um café.", "Single-dose home grinder: weigh the beans, grind, almost nothing stays inside.": "Moinho doméstico de dose única: pesas o grão, moes, quase nada fica lá dentro.", "Home espresso grinder that grinds by weight.": "Moinho doméstico de espresso com moagem por peso.", "Older home grinder with ceramic burrs, for espresso and filter.": "Moinho doméstico mais antigo com mós cerâmicas, para espresso e filtro.", "Doses by weight, not time; for years the most common specialty café grinder. Replaced by the E65W Grind-by-Sync.": "Doseia por peso, não por tempo; durante anos o moinho mais comum nos cafés de especialidade. Substituído pelo E65W Grind-by-Sync.", "The espresso machines and grinders you meet most in cafés, and what each can do. Tap one for details.": "As máquinas de espresso e os moinhos que mais se encontram nos cafés, e o que cada um faz. Toca num para ver os detalhes.", "VBM (Vibiemme)": "VBM (Vibiemme)"});// VBM and Mahlkönig
Object.assign(PT,{"The café workhorse. Saturated groups with dual boilers; very stable temperature.": "O cavalo de batalha dos cafés. Grupos saturados com duas caldeiras; temperatura muito estável.", "Simple, robust update of the original Linea.": "Atualização simples e robusta da Linea original.", "Linea internals with a different body and a display per group.": "O interior da Linea com outra carroçaria e um ecrã por grupo.", "Straight-in portafilter and automatic flush between shots; built for high volume.": "Porta-filtro que entra a direito e lavagem automática entre extrações; feita para grande volume.", "Paddle or programmed flow profiling per group.": "Perfil de fluxo por alavanca ou programado em cada grupo.", "Low-energy design (NEO system); compact and low.": "Desenho de baixo consumo (sistema NEO); compacta e baixa.", "Gravitech scales stop shots by weight. A competition favourite.": "As balanças Gravitech param as extrações pelo peso. Uma favorita das competições.", "Soft infusion and optional Easy Cream automatic milk; easy for new staff.": "Infusão suave e leite automático Easy Cream opcional; fácil para quem começa.", "Affordable and very common in small cafés.": "Acessível e muito comum em cafés pequenos.", "Needle-valve flow control for a long, low-flow pre-brew.": "Controlo de fluxo por válvula de agulha para uma pré-infusão longa e lenta.", "Programmable pressure profiles per group; very temperature stable.": "Perfis de pressão programáveis por grupo; temperatura muito estável.", "Dutch-made; a paddle sets the pressure through the shot.": "Feita nos Países Baixos; uma alavanca regula a pressão durante a extração.", "Distinctive open-frame design with independent group temperatures.": "Desenho aberto inconfundível, com temperatura independente por grupo.", "Variable-pressure profiles stored per button.": "Perfis de pressão variável guardados em cada botão.", "Top Cimbali with programmable profiles and Turbosteam milk.": "A Cimbali de topo, com perfis programáveis e leite Turbosteam.", "Mid-range Cimbali with an optional Turbosteam automatic wand.": "Cimbali de gama média com vaporizador automático Turbosteam opcional.", "Programmable pressure; touch display per group.": "Pressão programável; ecrã tátil por grupo.", "Large touch display; iSteam automatic wand option.": "Ecrã tátil grande; vaporizador automático iSteam opcional.", "Simple and very reliable; common in starter cafés.": "Simples e muito fiável; comum em cafés que estão a começar.", "Independent group temperatures and optional automatic milk.": "Temperatura independente por grupo e leite automático opcional.", "Multi-boiler with per-group temperature and recipe settings.": "Multicaldeira com temperatura e receitas por grupo.", "Super-automatic that rivals manual espresso in busy cafés and hotels.": "Superautomática que rivaliza com o espresso manual em cafés e hotéis com muito movimento.", "Common in hotels, offices and petrol-station cafés.": "Comum em hotéis, escritórios e cafés de estações de serviço.", "High-capacity super-automatic with a self-cleaning milk system.": "Superautomática de grande capacidade com sistema de leite que se limpa sozinho.", "Used by many large coffee chains.": "Usada por muitas grandes cadeias de café.", "Doses by weight, not time; the most common specialty café grinder.": "Doseia por peso, não por tempo; o moinho mais comum nos cafés de especialidade.", "For busy bars: fast and cool-running.": "Para bares com muito movimento: rápido e não aquece.", "The standard for filter and retail bean grinding; also used single-dose for espresso.": "A referência para moer café de filtro e para venda ao público; também usado em dose única para espresso.", "Robust high-volume Italian grinder.": "Moinho italiano robusto para grande volume.", "Conical burrs for very high volume and a chocolatey cup.": "Mós cónicas para muito volume e uma chávena achocolatada.", "Mid-volume conical grinder.": "Moinho cónico para volume médio.", "Precise and quick; popular in specialty bars.": "Preciso e rápido; popular nos bares de especialidade.", "Keeps the burrs at a constant temperature so the grind drifts less through the day.": "Mantém as mós a temperatura constante para a moagem mudar menos ao longo do dia.", "Gravimetric version that weighs each dose.": "Versão gravimétrica que pesa cada dose.", "Quiet; fits small cafés and coffee bars.": "Silencioso; ideal para cafés e bares pequenos.", "Very common, affordable café grinder.": "Moinho de café muito comum e acessível.", "Large burrs for higher volume.": "Mós grandes para mais volume.", "Spanish workhorse for high-volume bars.": "Cavalo de batalha espanhol para bares com muito volume.", "Fast, cool and low retention.": "Rápido, não aquece e retém pouco café.", "Swiss; used for filter brewing and retail bags.": "Suíço; usado para café de filtro e pacotes para venda."});// equipment notes
Object.assign(PT,{"Today": "Hoje", "Team": "Equipa", "Menu": "Carta", "Learn": "Aprender", "Training": "Formação", "Bar": "Balcão", "Drinks": "Bebidas", "Sections": "Secções", "skills waiting for your sign-off": "competências à espera da tua aprovação", "baristas fully trained": "baristas com formação completa", "cleaning tasks ticked today": "tarefas de limpeza feitas hoje", "drinks under 60 % margin": "bebidas com menos de 60 % de margem", "Waiting for your sign-off": "À espera da tua aprovação", "Open staff training": "Abrir formação da equipa", "Start here": "Começa aqui", "Add your baristas, check the house drinks and prices, and set your machine and grinder.": "Acrescenta os teus baristas, revê as bebidas da casa e os preços, e escolhe a tua máquina e o teu moinho.", "Add baristas": "Adicionar baristas", "Low margin": "Margem baixa", "Check costs and prices": "Ver custos e preços", "Today's routines": "Rotinas de hoje", "Search the equipment guide": "Procurar no guia de equipamento", "Offline. Everything still works and saves on this device.": "Sem internet. Tudo continua a funcionar e a guardar neste aparelho."});
Object.assign(PT,{"Stretch":"Esticar","Texture":"Textura","Stop":"Parar","Fill line":"Encher até","bottom of":"base do","the spout":"bico","bottom of|the spout":"base do|bico","fridge-cold":"do frigorífico","Water out first":"Primeiro a água","open fully, 1–2 s":"abre tudo, 1–2 s","Aim into the drip tray":"Aponta para o tabuleiro","Full open":"Tudo aberto","Tip 0.5–1 cm":"Ponta a 0,5–1 cm","under the surface":"abaixo da superfície","Seen from above":"Visto de cima","tip at 3 o'clock":"ponta às 3 horas","like tearing paper":"como papel a rasgar","Lower the jug":"Baixa o jarro","as the milk grows":"com o leite a subir","Milk grows":"Leite sobe","Air only until":"Ar só até","about 37 °C":"cerca de 37 °C","Tip 1–2 cm deeper":"Ponta 1–2 cm mais funda","air sound stops":"o som do ar para","Whirlpool":"Remoinho","big bubbles shrink":"bolhas grandes encolhem","add air only here":"ar só aqui","55–65 °C: stop":"55–65 °C: parar","sweetest ~60 °C":"mais doce ~60 °C","70 °C and up":"70 °C ou mais","foam collapses":"a espuma desfaz-se","Hand test":"Teste da mão","too hot after 2–3 s":"quente demais após 2–3 s","Damp cloth":"Pano húmido","only for the wand":"só para o vaporizador","Then purge":"Depois purga","1–2 seconds":"1–2 segundos","Dried milk blocks the holes":"Leite seco entope os furos","Tap 1–2 times":"Bate 1–2 vezes","then swirl":"depois roda","✓ Glossy":"✓ Brilhante","like wet paint":"como tinta fresca","✕ Dull, stiff":"✕ Baço, rígido","big bubbles":"bolhas grandes","Pour within":"Serve em","30 seconds":"30 segundos","1. High and thin":"1. Alto e fino","mix under the crema":"mistura sob o creme","2. Low and faster":"2. Baixo, rápido","foam stays on top":"espuma por cima","Heart":"Coração","pull through":"puxa pelo meio","How much foam each drink gets":"Quanta espuma leva cada bebida","Start with cold milk":"Começa com leite frio","Use milk straight from the fridge (3–5 °C) and a cold, clean jug. Cold milk gives you more time to add air and spin it before it gets too hot.":"Usa leite acabado de sair do frigorífico (3–5 °C) e um jarro frio e limpo. O leite frio dá-te mais tempo para meter ar e pô-lo a rodar antes de aquecer demais.","Fill to just below the bottom of the spout, about a third of the jug. The milk grows while steaming, so it needs room.":"Enche até um pouco abaixo da base do bico, cerca de um terço do jarro. O leite cresce ao vaporizar, por isso precisa de espaço.","Pour only what the drink needs. Milk that is steamed twice never foams well again.":"Deita só o que a bebida precisa. Leite vaporizado duas vezes nunca mais faz boa espuma.","Use a 350 ml jug for one drink and a 600 ml jug for two.":"Usa um jarro de 350 ml para uma bebida e de 600 ml para duas.","Purge the wand":"Purga o vaporizador","Point the wand into the drip tray or a cloth and open it fully for 1–2 seconds. This blows out water that has condensed in the wand.":"Aponta o vaporizador para o tabuleiro ou para um pano e abre-o todo durante 1–2 segundos. Isto tira a água que condensou lá dentro.","Water left in the wand makes the milk thinner and cooler.":"Água que fica no vaporizador deixa o leite mais aguado e mais frio.","Hold the cloth over the tip: the steam is hot.":"Segura o pano por cima da ponta: o vapor queima.","Put the tip in the right place":"Põe a ponta no sítio certo","Put the tip just under the surface, about 0.5–1 cm deep, a little off-centre (around 3 o'clock if the handle is at 6).":"Põe a ponta mesmo abaixo da superfície, a 0,5–1 cm, um pouco fora do centro (por volta das 3 horas se a pega estiver nas 6).","Tilt the jug slightly towards you. Off-centre is what makes the milk start to spin later.":"Inclina o jarro um pouco para ti. Estar fora do centro é o que faz o leite começar a rodar mais tarde.","Only open the steam once the tip is in the milk, or it sprays.":"Só abre o vapor depois de a ponta estar no leite, senão salpica.","Open the steam fully: half power gives big, loose bubbles.":"Abre o vapor todo: a meia potência fazem-se bolhas grandes e soltas.","Stretch: add the air":"Esticar: meter ar","Keep the tip at the surface so it draws in air. You should hear a soft, steady \"tss-tss\", like tearing paper.":"Mantém a ponta à superfície para puxar ar. Deves ouvir um \"tss-tss\" suave e constante, como papel a rasgar.","As the milk grows, lower the jug slowly so the tip stays just at the surface.":"À medida que o leite sobe, baixa o jarro devagar para a ponta ficar sempre à superfície.","Add air only while the milk is still cool, up to about body temperature (around 37 °C, when the jug just feels warm). After that, bubbles stay big.":"Mete ar só enquanto o leite ainda está frio, até cerca da temperatura do corpo (perto de 37 °C, quando o jarro começa a ficar morno). Depois disso as bolhas ficam grandes.","How long: about 2–3 seconds for a flat white, 3–5 for a latte, 5–8 for a cappuccino.":"Quanto tempo: cerca de 2–3 segundos para um flat white, 3–5 para um latte, 5–8 para um cappuccino.","Loud screeching: tip too deep. Big spitting bubbles: tip too high.":"Chiadeira forte: ponta funda demais. Bolhas grandes a cuspir: ponta alta demais.","Texture: make the whirlpool":"Textura: fazer o remoinho","Raise the jug a little so the tip sinks about 1–2 cm. The air sound stops and the milk starts to spin.":"Sobe um pouco o jarro para a ponta entrar 1–2 cm. O som do ar para e o leite começa a rodar.","The whirlpool pulls big bubbles under and breaks them into tiny ones: that is microfoam.":"O remoinho puxa as bolhas grandes para baixo e parte-as em bolhas minúsculas: isso é a microespuma.","Keep the spin going until the milk is hot. If it stops spinning, move the tip a little further off-centre.":"Mantém o leite a rodar até estar quente. Se deixar de rodar, afasta a ponta um pouco mais do centro.","No sound and no spin? The tip is too deep or in the middle.":"Sem som e sem rodar? A ponta está funda demais ou no meio.","Stop at the right temperature":"Para à temperatura certa","Stop at 55–65 °C. Milk tastes sweetest around 60 °C.":"Para aos 55–65 °C. O leite é mais doce por volta dos 60 °C.","No thermometer? Keep a hand flat on the jug: when it is too hot to hold for more than 2–3 seconds, stop.":"Sem termómetro? Põe a mão espalmada no jarro: quando já não aguentas mais de 2–3 segundos, para.","Above about 70 °C the milk proteins break down: the foam collapses and the milk tastes cooked.":"Acima de cerca de 70 °C as proteínas do leite estragam-se: a espuma desfaz-se e o leite sabe a cozido.","Close the steam before you take the tip out, or the milk sprays.":"Fecha o vapor antes de tirar a ponta, senão o leite salpica.","Plant milks: stop a bit cooler, around 55–60 °C.":"Bebidas vegetais: para um pouco mais frio, cerca de 55–60 °C.","Wipe and purge straight away":"Limpa e purga logo","Wipe the wand with a damp cloth kept only for the wand, then purge 1–2 seconds.":"Limpa o vaporizador com um pano húmido só para isso e depois purga 1–2 segundos.","Milk dries in seconds and blocks the holes; it also spoils and taints the next jug.":"O leite seca em segundos e entope os furos; também se estraga e dá mau gosto ao jarro seguinte.","Do it every time, even in a rush.":"Faz isto sempre, mesmo com pressa.","Tap and swirl":"Bate e roda","Tap the jug firmly on the counter once or twice to pop any big bubbles left on top.":"Bate o jarro com firmeza no balcão uma ou duas vezes para rebentar as bolhas grandes que ficaram por cima.","Swirl the milk in the jug until it looks glossy, like wet paint. Swirling keeps foam and milk mixed.":"Roda o leite no jarro até parecer brilhante, como tinta fresca. Rodar mantém a espuma e o leite misturados.","Pour within about 30 seconds; foam that waits separates from the milk.":"Serve em cerca de 30 segundos; espuma que espera separa-se do leite.","Dull and stiff on top? Too much air. Thin and watery? Not enough.":"Baço e rígido por cima? Ar a mais. Fino e aguado? Ar a menos.","Pour":"Servir","Start a little higher with a thin stream so the milk goes under the crema and mixes.":"Começa um pouco mais alto, com um fio fino, para o leite entrar por baixo do creme e misturar.","When the cup is about half full, bring the jug close to the surface and pour a bit faster: the white foam now stays on top.":"Quando a chávena estiver meio cheia, aproxima o jarro da superfície e deita um pouco mais depressa: a espuma branca fica agora por cima.","For a heart: let a white circle form, then lift slightly and pull through the middle.":"Para um coração: deixa formar um círculo branco, depois sobe um pouco e puxa pelo meio.","Practise pouring with water and a drop of dish soap to save milk.":"Treina a servir com água e uma gota de detergente da loiça para poupar leite.","Fills cold milk to the bottom of the spout, right amount for the drink":"Enche com leite frio até à base do bico, a quantidade certa para a bebida","Purges the wand before and after, every time":"Purga o vaporizador antes e depois, sempre","Starts with the tip just under the surface, off-centre":"Começa com a ponta mesmo abaixo da superfície, fora do centro","Steady soft “tss” only at the start, no screeching":"“tss” suave e constante só no início, sem chiar","Milk spins in a whirlpool; no big bubbles":"O leite roda em remoinho; sem bolhas grandes","Stops at 55–65 °C (check with a thermometer)":"Para aos 55–65 °C (confirma com um termómetro)","Right foam for the drink: flat white, latte, cappuccino":"Espuma certa para a bebida: flat white, latte, cappuccino","Tap and swirl: glossy like wet paint":"Bate e roda: brilhante como tinta fresca","Pours within 30 seconds, foam on top, clean cup":"Serve em 30 segundos, espuma por cima, chávena limpa","Plant milk: less air, stops cooler, no splitting":"Bebida vegetal: menos ar, para mais frio, sem talhar","thin, silky layer; 2–3 s of air":"camada fina e sedosa; 2–3 s de ar","about 1 cm of foam; 3–5 s of air":"cerca de 1 cm de espuma; 3–5 s de ar","1.5–2 cm of thick foam; 5–8 s of air":"1,5–2 cm de espuma espessa; 5–8 s de ar","Proteins trap the air. They wrap around each bubble and link up, which is what makes foam last. More protein means firmer foam.":"As proteínas prendem o ar. Envolvem cada bolha e ligam-se umas às outras, e é isso que faz a espuma durar. Mais proteína quer dizer espuma mais firme.","Fat gives the creamy taste but weakens foam: it competes with the proteins at the bubble. Whole milk makes the silkiest, sweetest drinks; skimmed milk makes stiffer, drier foam.":"A gordura dá o sabor cremoso, mas enfraquece a espuma: compete com as proteínas na bolha. O leite gordo faz as bebidas mais sedosas e doces; o magro faz uma espuma mais rígida e seca.","Heat helps up to a point: warm milk feels sweeter. Too hot (above about 70 °C) damages the proteins and the foam collapses.":"O calor ajuda até certo ponto: o leite morno parece mais doce. Quente demais (acima de cerca de 70 °C) estraga as proteínas e a espuma desfaz-se.","Air goes in early, spin comes later. Bubbles made while the milk is cold become small and stable; air added late stays as big bubbles.":"O ar entra cedo, o remoinho vem depois. As bolhas feitas com o leite frio ficam pequenas e estáveis; o ar que entra tarde fica em bolhas grandes.","Use \"barista\" versions: they have extra fat, protein and stabilisers so they foam well and don't split in coffee.":"Usa versões \"barista\": têm mais gordura, proteína e estabilizantes, por isso fazem boa espuma e não talham no café.","Shake the carton and keep it cold.":"Agita o pacote e mantém-no frio.","Add less air than with cow's milk: plant proteins hold less. A short stretch, then a long spin.":"Mete menos ar do que com leite de vaca: as proteínas vegetais seguram menos. Esticar pouco e depois rodar muito.","Stop cooler, around 55–60 °C. Heat and the acidity of coffee make plant milk split.":"Para mais frio, cerca de 55–60 °C. O calor e a acidez do café fazem talhar as bebidas vegetais.","Oat is the most forgiving. Soy foams firmly but can split in very fresh or acidic coffee. Almond and coconut make thin foam.":"A de aveia é a mais fácil. A de soja faz espuma firme mas pode talhar em café muito fresco ou ácido. A de amêndoa e a de coco fazem espuma fina.","Pour straight away: plant foam breaks down faster.":"Serve logo: a espuma vegetal desfaz-se mais depressa.","Big bubbles on top":"Bolhas grandes por cima","Too much air, or air added too late. Shorter stretch, start the whirlpool earlier, tap and swirl.":"Ar a mais, ou ar metido tarde demais. Estica menos tempo, começa o remoinho mais cedo, bate e roda.","No foam, watery milk":"Sem espuma, leite aguado","Tip went in too deep at the start: you never heard \"tss\". Start right at the surface.":"A ponta entrou funda demais no início: nunca ouviste o \"tss\". Começa mesmo à superfície.","Loud screeching":"Chiadeira forte","Tip too deep or touching the jug wall. Raise it a little and keep it off the wall.":"Ponta funda demais ou a tocar na parede do jarro. Sobe-a um pouco e afasta-a da parede.","Milk sprays everywhere":"O leite salpica para todo o lado","Tip too high, or steam opened before the tip was in. Lower the tip slightly.":"Ponta alta demais, ou vapor aberto antes de a ponta estar no leite. Baixa um pouco a ponta.","Milk doesn't spin":"O leite não roda","Tip is in the centre. Move it off-centre and tilt the jug a little.":"A ponta está no centro. Afasta-a do centro e inclina um pouco o jarro.","Foam and milk separate":"A espuma e o leite separam-se","The jug waited too long. Swirl until glossy and pour within 30 seconds.":"O jarro esperou demasiado. Roda até brilhar e serve em 30 segundos.","Tastes cooked or flat":"Sabe a cozido ou a pouco","Overheated. Stop at 55–65 °C; use the hand test.":"Aqueceu demais. Para aos 55–65 °C; usa o teste da mão.","Plant milk splits in the cup":"A bebida vegetal talha na chávena","Too hot or a very acidic coffee. Stop cooler, use a barista version, pour gently.":"Quente demais ou café muito ácido. Para mais frio, usa uma versão barista, deita com suavidade.","Step by step":"Passo a passo","How much foam":"Quanta espuma","Why it works":"Porque funciona","Plant milks":"Bebidas vegetais","Problems":"Problemas","Sign-off check":"Verificação para aprovação","Step":"Passo","Tip":"Dica","Back":"Voltar","Next":"Seguinte","How much the milk grows while steaming, per drink.":"Quanto cresce o leite ao vaporizar, por bebida.","Growth":"Aumento","What you aim for":"O que procuras","What a trainer should see before signing off milk steaming. Check yourself first, then show your trainer three drinks in a row.":"O que um formador deve ver antes de aprovar o vaporizar do leite. Verifica-te primeiro e depois mostra ao formador três bebidas seguidas.","Problem":"Problema","Cause and fix":"Causa e solução","Sources":"Fontes","Steaming milk":"Vaporizar o leite","Silky microfoam, step by step.":"Microespuma sedosa, passo a passo.","1. Start with cold milk":"1. Começa com leite frio","2. Purge the wand":"2. Purga o vaporizador","3. Put the tip in the right place":"3. Põe a ponta no sítio certo","4. Stretch: add the air":"4. Esticar: meter ar","5. Texture: make the whirlpool":"5. Textura: fazer o remoinho","6. Stop at the right temperature":"6. Para à temperatura certa","7. Wipe and purge straight away":"7. Limpa e purga logo","8. Tap and swirl":"8. Bate e roda","9. Pour":"9. Servir"});// milk guide

  quiz:[Q(B("How long does the machine need to warm up?","Hoe lang moet de machine opwarmen?"),[B("About 5 minutes","Ongeveer 5 minuten"),B("About 30 minutes","Ongeveer 30 minuten"),B("It's ready when you switch it on","Hij is klaar zodra je hem aanzet")],1),
   Q(B("Why do you leave the portafilters in the group?","Waarom laat je de pistons in de groep zitten?"),[B("So they stay warm","Zodat ze warm blijven"),B("So nobody steals them","Zodat niemand ze meeneemt"),B("It cleans them","Dan worden ze schoon")],0)]},
 {learn:[B("Finer grind = water flows slower = longer shot. Coarser grind = faster shot.","Fijner malen = water loopt langzamer = langere shot. Grover malen = snellere shot."),B("Move the grinder in small steps. A tiny turn can change the shot by several seconds.","Draai de molen in kleine stapjes. Een heel klein beetje kan de shot een paar seconden veranderen."),B("After a change, grind one dose and throw it away: old coffee is still in the grinder.","Maal na een wijziging één dosis en gooi die weg: er zit nog oude koffie in de molen."),B("Adjust while the motor runs so beans don't get stuck between the burrs.","Stel bij terwijl de motor draait, zodat er geen bonen klem raken tussen de schijven.")],
  quiz:[Q(B("Your shot runs too fast. What do you do?","Je shot loopt te snel. Wat doe je?"),[B("Grind finer","Fijner malen"),B("Grind coarser","Grover malen"),B("Use less coffee","Minder koffie gebruiken")],0),
   Q(B("What do you do right after changing the grind?","Wat doe je direct na het bijstellen van de maling?"),[B("Serve the next shot straight away","De volgende shot meteen serveren"),B("Grind one dose and throw it away","Eén dosis malen en weggooien"),B("Turn the machine off and on","De machine uit en aan zetten")],1)]},
 {learn:[B("Always use the house dose (see House drinks). Weigh it: ±0.2 g is the goal.","Gebruik altijd de huisdosis (zie Huisdrankjes). Weeg hem: ±0,2 g is het doel."),B("Spread the coffee evenly in the basket before tamping, so water can't find an easy path.","Verdeel de koffie gelijkmatig in het filter voor je tampt, zodat het water geen makkelijke weg vindt."),B("Tamp straight and firm once. Level matters more than how hard you press.","Tamp één keer recht en stevig. Recht is belangrijker dan hoe hard je drukt."),B("Wipe the rim of the basket clean so the portafilter seals well.","Veeg de rand van het filter schoon zodat de piston goed afsluit.")],
  quiz:[Q(B("What matters most when tamping?","Wat is het belangrijkst bij het tampen?"),[B("Pressing as hard as you can","Zo hard mogelijk drukken"),B("Keeping it level","Het recht houden"),B("Tamping three times","Drie keer tampen")],1),
   Q(B("Why do you weigh the dose?","Waarom weeg je de dosis?"),[B("So every coffee tastes the same","Zodat elke koffie hetzelfde smaakt"),B("Because the boss likes numbers","Omdat de baas van getallen houdt"),B("You don't need to","Dat hoeft niet")],0)]},
 {learn:[B("A shot has three numbers: dose in (g), yield out (g) and time (s).","Een shot heeft drie getallen: dosis erin (g), opbrengst eruit (g) en tijd (s)."),B("The ratio is yield ÷ dose. 18 g in and 36 g out is 1:2.","De verhouding is opbrengst ÷ dosis. 18 g erin en 36 g eruit is 1:2."),B("Start the timer when you press the button; stop the shot at the target weight on the scale.","Start de timer als je op de knop drukt; stop de shot bij het doelgewicht op de weegschaal."),B("Good shot: even flow like warm honey, then it turns lighter in colour near the end.","Goede shot: gelijkmatige straal als warme honing, en tegen het einde wordt hij lichter van kleur.")],
  quiz:[Q(B("18 g in and 36 g out is which ratio?","18 g erin en 36 g eruit is welke verhouding?"),[B("1:1","1:1"),B("1:2","1:2"),B("1:3","1:3")],1),
   Q(B("When do you stop the shot?","Wanneer stop je de shot?"),[B("When the cup looks full","Als het kopje vol lijkt"),B("At the target weight on the scale","Bij het doelgewicht op de weegschaal"),B("After exactly 20 seconds","Na precies 20 seconden")],1)]},
 {learn:[B("Beans, weather and the grinder warming up all change the shot during the day.","Bonen, het weer en het opwarmen van de molen veranderen de shot gedurende de dag."),B("Every morning: pull a check shot, weigh dose and yield, time it.","Elke ochtend: zet een controleshot, weeg dosis en opbrengst, meet de tijd."),B("Too fast → finer. Too slow → coarser. Change only one thing at a time.","Te snel → fijner. Te langzaam → grover. Verander maar één ding tegelijk."),B("Use the Calculators → Grind change tool if you're unsure how far to turn.","Gebruik Rekenhulpen → Maling bijstellen als je niet zeker weet hoever je moet draaien.")],
  quiz:[Q(B("The check shot took 38 s; the target is 28 s. What do you do?","De controleshot duurde 38 s; het doel is 28 s. Wat doe je?"),[B("Grind coarser","Grover malen"),B("Grind finer","Fijner malen"),B("Add more coffee","Meer koffie gebruiken")],0),
   Q(B("How many things do you change at once?","Hoeveel dingen verander je tegelijk?"),[B("One","Eén"),B("Everything that seems wrong","Alles wat fout lijkt"),B("Two or three","Twee of drie")],0)]},
 {learn:[B("Sour, sharp, thin and salty = under-extracted: usually too fast or too coarse.","Zuur, scherp, dun en zoutig = onderextractie: meestal te snel of te grof."),B("Bitter, dry, harsh and empty at the end = over-extracted: usually too slow or too fine.","Bitter, droog, ruw en leeg in de nasmaak = overextractie: meestal te langzaam of te fijn."),B("Balanced = sweet, round and pleasant aftertaste.","In balans = zoet, rond en een prettige nasmaak."),B("Taste a little espresso every time you adjust, before you serve guests.","Proef een beetje espresso elke keer dat je bijstelt, voordat je gasten bedient.")],
  quiz:[Q(B("The espresso tastes sour and thin. What is the fix?","De espresso smaakt zuur en dun. Wat is de oplossing?"),[B("Grind finer","Fijner malen"),B("Grind coarser","Grover malen"),B("Add sugar","Suiker toevoegen")],0),
   Q(B("A dry, harsh, bitter shot is usually…","Een droge, ruwe, bittere shot is meestal…"),[B("Under-extracted","Onderextractie"),B("Over-extracted","Overextractie"),B("Perfect","Perfect")],1)]},
 {learn:[B("Start with cold milk in a clean jug, filled to just below the spout.","Begin met koude melk in een schone kan, gevuld tot net onder de tuit."),B3("Purge the wand, rest it in the spout of the jug with the tip just under the surface, and open fully. The spout is your guide: same angle every time.","Blaas de stoompijp door, leg hem in de tuit van de kan met de tip net onder het oppervlak, en draai helemaal open. De tuit is je gids: elke keer dezelfde hoek.","Purga o vaporizador, apoia-o no bico do jarro com a ponta mesmo abaixo da superfície e abre tudo. O bico é o teu guia: sempre o mesmo ângulo."),B("For microfoam: only a short burst of air (gentle 'tsss'), then sink the tip a little so the milk spins.","Voor microschuim: maar heel kort lucht (zacht 'tsss'), laat de tip dan iets zakken zodat de melk draait."),B("Stop at 55–65 °C: the jug is too hot to hold for more than 2 seconds. Tap and swirl until glossy.","Stop bij 55–65 °C: de kan is te heet om langer dan 2 seconden vast te houden. Tik en walsen tot het glanst.")],
  quiz:[Q(B3("Where does the steam wand rest while you steam?","Waar ligt de stoompijp tijdens het opschuimen?","Onde fica apoiado o vaporizador enquanto vaporizas?"),[B3("In the spout of the jug","In de tuit van de kan","No bico do jarro"),B3("In the middle of the jug","In het midden van de kan","No meio do jarro"),B3("Against the handle side","Tegen de kant van het handvat","Do lado da pega")],0),
   Q(B("What temperature do you stop at?","Bij welke temperatuur stop je?"),[B("40 °C","40 °C"),B("55–65 °C","55–65 °C"),B("80 °C","80 °C")],1),
   Q(B("How should good microfoam look?","Hoe ziet goed microschuim eruit?"),[B("Glossy like wet paint, no big bubbles","Glanzend als natte verf, geen grote bellen"),B("Stiff and dry","Stijf en droog"),B("Lots of big bubbles","Veel grote bellen")],0)]},
 {learn:[B("Cappuccino needs more foam than a latte: about 1–1.5 cm on top.","Een cappuccino heeft meer schuim dan een latte: ongeveer 1–1,5 cm erop."),B("Add air for longer (3–5 s) at the start, while the milk is still cold.","Voeg aan het begin langer lucht toe (3–5 s), terwijl de melk nog koud is."),B("Then sink the tip and let it spin to mix the foam through the milk.","Laat de tip dan zakken en de melk draaien, zodat het schuim zich mengt."),B("Pour straight away; foam that waits separates from the milk.","Schenk meteen; schuim dat staat te wachten scheidt van de melk.")],
  quiz:[Q(B("When do you add air?","Wanneer voeg je lucht toe?"),[B("At the start, while the milk is cold","Aan het begin, als de melk nog koud is"),B("At the end, when it's hot","Aan het einde, als het heet is"),B("The whole time","De hele tijd")],0),
   Q(B("How much foam does a cappuccino have?","Hoeveel schuim heeft een cappuccino?"),[B("None","Geen"),B("About 1–1.5 cm","Ongeveer 1–1,5 cm"),B("Half the cup","Een halve kop")],1)]},
 {learn:[B("Oat and soy milk burn and split faster than cow's milk.","Haver- en sojamelk verbranden en schiften sneller dan koemelk."),B("Use a 'barista' version: it foams better.","Gebruik een 'barista'-versie: die schuimt beter."),B("Add less air and stop cooler, around 55–60 °C.","Voeg minder lucht toe en stop koeler, rond 55–60 °C."),B("Keep plant milks cold and shake the carton before use.","Houd plantaardige melk koud en schud het pak voor gebruik.")],
  quiz:[Q(B("Where do you stop steaming oat milk?","Wanneer stop je met opschuimen van havermelk?"),[B("Around 55–60 °C","Rond 55–60 °C"),B("Around 75 °C","Rond 75 °C"),B("When it boils","Als het kookt")],0),
   Q(B("Which oat milk do you use?","Welke havermelk gebruik je?"),[B("Any cheap one","Elke goedkope"),B("A barista version","Een barista-versie"),B("Oat milk from the fridge door at home","Havermelk uit de koelkast thuis")],1)]},
 {learn:[B("Matcha: sift it first, then whisk with water at 75–80 °C. Boiling water makes it bitter.","Matcha: eerst zeven, dan kloppen met water van 75–80 °C. Kokend water maakt het bitter."),B("Whisk in a fast W or zigzag motion until there are no lumps and it's frothy.","Klop snel in een W- of zigzagbeweging tot er geen klontjes meer zijn en het schuimt."),B("Chai: mix powder or concentrate with a splash of hot water first, then add steamed milk.","Chai: meng poeder of concentraat eerst met een scheutje heet water, voeg dan opgeschuimde melk toe."),B("Follow the amounts in House drinks so every cup tastes the same.","Volg de hoeveelheden in Huisdrankjes zodat elke kop hetzelfde smaakt.")],
  quiz:[Q(B("What water temperature do you use for matcha?","Welke watertemperatuur gebruik je voor matcha?"),[B("Boiling, 100 °C","Kokend, 100 °C"),B("75–80 °C","75–80 °C"),B("Cold","Koud")],1),
   Q(B("What do you do first with matcha powder?","Wat doe je eerst met matchapoeder?"),[B("Sift it","Zeven"),B("Steam it with the milk","Met de melk opschuimen"),B("Add sugar","Suiker toevoegen")],0)]},
 {learn:[B("Art needs silky microfoam: thin and glossy, not stiff.","Latte art heeft zijdezacht microschuim nodig: dun en glanzend, niet stijf."),B("Tilt the cup, pour from high first to mix the milk under the crema.","Kantel de kop en schenk eerst van hoog om de melk onder de crema te mengen."),B("When the cup is half full, bring the jug very close and pour faster: a white circle appears.","Als de kop half vol is, breng je de kan heel dichtbij en schenk je sneller: er verschijnt een witte cirkel."),B("Lift up a little and pull through the middle to make the heart.","Til iets op en trek door het midden om het hartje te maken.")],
  quiz:[Q(B("When do you bring the jug close to the cup?","Wanneer breng je de kan dicht bij de kop?"),[B("Right at the start","Meteen aan het begin"),B("When the cup is about half full","Als de kop ongeveer half vol is"),B("Never","Nooit")],1),
   Q(B("What milk works for latte art?","Welke melk werkt voor latte art?"),[B("Stiff, dry foam","Stijf, droog schuim"),B("Glossy microfoam","Glanzend microschuim"),B("Unsteamed cold milk","Koude melk zonder opschuimen")],1)]},
 {learn:[B("A tulip is several small hearts pushed into each other, then pulled through.","Een tulp bestaat uit een paar kleine hartjes die in elkaar geduwd worden en dan doorgetrokken."),B("A rosetta: wiggle the jug side to side while moving back, then pull through.","Een rosetta: wiebel de kan heen en weer terwijl je achteruit beweegt, en trek dan door."),B("Steady flow matters more than speed. Practise with water and a drop of soap to save milk.","Een gelijkmatige straal is belangrijker dan snelheid. Oefen met water en een druppel zeep om melk te besparen."),B("Finish by lifting the jug and cutting through the middle.","Eindig door de kan op te tillen en door het midden te trekken.")],
  quiz:[Q(B("How do you make a rosetta?","Hoe maak je een rosetta?"),[B("Wiggle side to side while moving back","Heen en weer wiebelen terwijl je achteruit beweegt"),B("Pour from very high the whole time","De hele tijd van heel hoog schenken"),B("Stir with a spoon","Roeren met een lepel")],0),
   Q(B("What matters most when pouring art?","Wat is het belangrijkst bij latte art schenken?"),[B("A steady flow","Een gelijkmatige straal"),B("Pouring as fast as possible","Zo snel mogelijk schenken"),B("A cold cup","Een koude kop")],0)]},
 {learn:[B("Open House drinks and learn each drink: cup, size, dose and milk.","Open Huisdrankjes en leer elk drankje: kop, maat, dosis en melk."),B("Group them: espresso drinks, milk drinks, drinks without coffee.","Deel ze in: espressodrankjes, melkdrankjes, drankjes zonder koffie."),B("Practise by saying the recipe out loud before you make it.","Oefen door het recept hardop te zeggen voor je het maakt."),B("When unsure during a rush, check the app instead of guessing.","Twijfel je tijdens drukte, kijk dan in de app in plaats van te gokken.")],
  quiz:[Q(B("Where do you find our café's recipes?","Waar vind je de recepten van ons café?"),[B("House drinks in this app","Huisdrankjes in deze app"),B("On the internet","Op internet"),B("You make them up","Die verzin je zelf")],0),
   Q(B("You're unsure about a recipe during a rush. What do you do?","Je twijfelt over een recept tijdens drukte. Wat doe je?"),[B("Guess","Gokken"),B("Check the app","In de app kijken"),B("Skip the drink","Het drankje overslaan")],1)]},
 {learn:[B("Work in a fixed order: grind and pull the shot first, steam the milk while it runs.","Werk in een vaste volgorde: eerst malen en de shot starten, melk opschuimen terwijl die loopt."),B("Steam milk for two drinks in one jug when they're the same type.","Schuim melk voor twee drankjes in één kan als ze hetzelfde zijn."),B("Keep your station clean as you go: wipe, purge, knock out.","Houd je plek schoon terwijl je werkt: afvegen, doorblazen, uitkloppen."),B("Speed comes from calm, repeated movements, not from rushing.","Snelheid komt van rustige, herhaalde bewegingen, niet van haasten."),{en:"In a rush, split the jobs: one person on the till, one on the bar, and a runner when it is really busy. Make drinks in the order they were paid.",nl:"Verdeel bij drukte het werk: één persoon aan de kassa, één achter de bar, en een loper als het echt druk is. Maak de drankjes in de volgorde waarin ze zijn betaald.",pt:"Na hora de ponta, divide o trabalho: uma pessoa na caixa, uma ao balcão e alguém a levar as bebidas quando há muito movimento. Faz as bebidas pela ordem em que foram pagas."},{en:"Check the shot time again at opening and around midday: the grinder warms up and the shots drift.",nl:"Controleer de shottijd opnieuw bij opening en rond het middaguur: de molen warmt op en de shots verlopen.",pt:"Volta a ver o tempo de extração na abertura e por volta do meio-dia: o moinho aquece e as extrações mudam."}],
  quiz:[Q(B("What do you do while the shot runs?","Wat doe je terwijl de shot loopt?"),[B("Wait and watch","Wachten en kijken"),B("Steam the milk","De melk opschuimen"),B("Clean the floor","De vloer schoonmaken")],1),
   Q(B("Where does speed come from?","Waar komt snelheid vandaan?"),[B("Rushing","Haasten"),B("Calm, repeated movements","Rustige, herhaalde bewegingen"),B("Skipping the scale","De weegschaal overslaan")],1)]},
 {learn:[B("Follow the Closing list in Daily routines, every day, in order.","Volg de lijst Sluiten in Dagelijkse routines, elke dag, op volgorde."),B("Backflush with detergent, then rinse without, or the next coffee tastes of soap.","Spoel terug met reiniger en daarna zonder, anders smaakt de volgende koffie naar zeep."),B("Clean the steam wand tips: milk left inside spoils and blocks the holes.","Maak de stoompijptips schoon: achtergebleven melk bederft en verstopt de gaatjes."),B("Leave the bar the way you would want to find it in the morning.","Laat de bar achter zoals je hem 's ochtends zou willen aantreffen.")],
  quiz:[Q(B("What do you do after backflushing with detergent?","Wat doe je na terugspoelen met reiniger?"),[B("Nothing","Niets"),B("Rinse again without detergent","Nog eens spoelen zonder reiniger"),B("Turn the machine off straight away","De machine meteen uitzetten")],1),
   Q(B("Why clean the steam wand tips?","Waarom maak je de stoompijptips schoon?"),[B("Milk spoils and blocks the holes","Melk bederft en verstopt de gaatjes"),B("It makes the machine shine","Dan glimt de machine"),B("It isn't needed","Dat is niet nodig")],0)]},
 {learn:[B("Know where today's beans come from and two or three tastes (e.g. chocolate, nuts, red fruit).","Weet waar de bonen van vandaag vandaan komen en twee of drie smaken (bijv. chocolade, noten, rood fruit)."),B("Keep it short and friendly; ask what the guest likes.","Houd het kort en vriendelijk; vraag wat de gast lekker vindt."),B("Suggest a drink: milk lovers a flat white, fruity coffee fans a filter or espresso.","Raad een drankje aan: melkliefhebbers een flat white, liefhebbers van fruitige koffie een filter of espresso."),B("If you don't know an answer, say so and find out.","Weet je een antwoord niet, zeg dat dan en zoek het uit."),{en:"Dutch guests: “een koffie” usually means a lungo or a filter coffee, not an espresso. Know koffie verkeerd, latte macchiato, Wiener melange (with whipped cream) and koffie met slagroom.",nl:"Nederlandse gasten: met “een koffie” bedoelen ze meestal een lungo of filterkoffie, geen espresso. Ken koffie verkeerd, latte macchiato, Wiener melange (met slagroom) en koffie met slagroom.",pt:"Clientes neerlandeses: “een koffie” quer normalmente dizer um lungo ou café de filtro, não um espresso. Conhece o koffie verkeerd, o latte macchiato, o Wiener melange (com natas batidas) e o koffie met slagroom."},{en:"Suggest, don't push: a bigger size, another milk, a pastry that goes with the coffee, or the bean of the week. If a guest isn't happy, remake the drink without arguing.",nl:"Stel voor, dring niet aan: een groter formaat, een andere melk, een gebakje dat bij de koffie past of de boon van de week. Is een gast niet tevreden, maak het drankje dan zonder discussie opnieuw.",pt:"Sugere sem insistir: um tamanho maior, outro leite, um bolo que combine com o café ou o café da semana. Se um cliente não estiver contente, refaz a bebida sem discutir."}],
  quiz:[Q(B("A guest asks a question you can't answer. What do you do?","Een gast stelt een vraag die je niet kunt beantwoorden. Wat doe je?"),[B("Make something up","Iets verzinnen"),B("Say you'll find out, then ask","Zeggen dat je het uitzoekt, en het dan vragen"),B("Ignore it","Negeren")],1),
   Q(B("What do you tell a guest about the coffee?","Wat vertel je een gast over de koffie?"),[B("Origin and 2–3 tastes, short and friendly","Herkomst en 2–3 smaken, kort en vriendelijk"),B("Everything you know, for ten minutes","Alles wat je weet, tien minuten lang"),B("Nothing","Niets")],0)]},
 {learn:[B("Tamping presses the coffee into a firm, level puck so water flows through it evenly. Level matters most: a tilted tamp lets water rush through the low side.","Tampen drukt de koffie tot een stevige, vlakke koek zodat het water er gelijkmatig doorheen loopt. Vlak is het belangrijkst: scheef tampen laat het water langs de lage kant schieten."),
   B("Pressing harder packs the puck a little tighter and slows the shot by a second or two; pressing lighter speeds it up a little. Once the puck is fully pressed, extra force changes very little.","Harder drukken maakt de koek iets vaster en vertraagt de shot met een seconde of twee; lichter drukken maakt hem iets sneller. Als de koek helemaal is aangedrukt, verandert extra kracht weinig."),
   B("Small drift during service (1–3 s off) with an automatic tamper (like a Puqpress): set it one step firmer or lighter for the next shots, and change one thing at a time, so you don't have to touch the grinder mid-rush.","Kleine afwijking tijdens service (1–3 s) met een automatische tamper (zoals een Puqpress): zet hem één stand steviger of lichter voor de volgende shots, en verander één ding tegelijk, zodat je de molen tijdens de drukte niet hoeft aan te raken."),
   B("Tamping by hand? Keep your tamp the same every time. For a small drift, change the dose by 0.2–0.5 g or stop the shot 1–2 g earlier or later: that is a stronger fix and also leaves the grinder alone.","Tamp je met de hand? Houd je tamp elke keer gelijk. Bij een kleine afwijking verander je de dosis met 0,2–0,5 g of stop je de shot 1–2 g eerder of later: dat werkt beter en je laat de molen ook met rust."),
   B("Bigger change (more than about 3 s), new beans or the start of the day: adjust the grind. Pressure can't fix a big difference, and tamping very hard all day strains your wrist.","Groter verschil (meer dan ongeveer 3 s), nieuwe bonen of aan het begin van de dag: verstel de maling. Druk lost geen groot verschil op, en de hele dag heel hard tampen belast je pols."),
   B("Stay consistent: same dose, same distribution, same pressure. A calibrated tamper that clicks at a set pressure helps every barista tamp the same.","Blijf constant: dezelfde dosis, dezelfde verdeling, dezelfde druk. Een gekalibreerde tamper die klikt bij een vaste druk helpt elke barista hetzelfde te tampen.")],
  quiz:[Q(B("During a rush the shot runs 2 s too fast. What is the quickest safe fix?","Tijdens drukte loopt de shot 2 s te snel. Wat is de snelste veilige oplossing?"),[B("Set the automatic tamper one step firmer, or add 0.3 g if you tamp by hand","De automatische tamper één stand steviger zetten, of 0,3 g meer doseren als je met de hand tampt"),B("Turn the grinder a lot finer","De molen veel fijner zetten"),B("Add 3 g more coffee","3 g meer koffie gebruiken")],0),
   Q(B("After opening a new bag, shots run 8 s too fast. What do you do?","Na het openen van een nieuwe zak lopen de shots 8 s te snel. Wat doe je?"),[B("Tamp much harder","Veel harder tampen"),B("Adjust the grind finer","De maling fijner zetten"),B("Nothing, it will settle","Niets, het komt vanzelf goed")],1)]}
];

 ${opts.length?`<h3>${T("Guests can choose","Gasten kunnen kiezen")}</h3><div>${opts.map(o=>`<span class="tag on">${esc(L(o.n))}${+o.p?` +${eur(+o.p)}`:""}</span>`).join("")}</div>`:""}
 ${boss?`${!multi?`<p class="hint">${T("Cost per drink","Kosten per drankje")}: <b>${eur(drinkCost(d))}</b>${d.price?` · ${T("margin","marge")} <b>${fmt((1-drinkCost(d)/(d.price/(1+vat/100)))*100,0)} %</b>`:""}</p>`:""}

 <div class="row"><button class="btn" type="button" id="dEdit">${T("Edit","Bewerken")}</button><button class="ghost" type="button" id="dCopy">${T("Duplicate","Dupliceren")}</button><button class="ghost" type="button" id="dHide">${d.hidden?T("Show on menu","Op menu zetten"):T("Hide from menu","Verbergen")}</button></div>

 const lines=a=>a.map(x=>L(x)).join("\n");

 <label class="field"><span>${T("Served","Geserveerd")}</span><select id="eIced"><option value="0">${T("Hot","Warm")}</option><option value="1"${d.iced?" selected":""}>${T("Iced","Met ijs")}</option></select></label>
 ${f("ePrice",T("Menu price € (incl. VAT)","Menuprijs € (incl. btw)"),d.price||"",'class="num" inputmode="decimal"')}</div>
 <h3>${T("Coffee","Koffie")}</h3><p class="hint" style="margin:0">${T("Single shot ≈ 9 g → 18 g, double ≈ 18 g → 36 g. Leave the dose at 0 for drinks without coffee.","Enkele shot ≈ 9 g → 18 g, dubbele ≈ 18 g → 36 g. Laat de dosis op 0 voor drankjes zonder koffie.")}</p>
 <div class="row" style="gap:6px"><button type="button" class="ghost" data-shot="9|18">${T("Single shot","Enkele shot")}</button><button type="button" class="ghost" data-shot="18|36">${T("Double shot","Dubbele shot")}</button><button type="button" class="ghost" data-shot="27|54">${T("Triple shot","Driedubbele shot")}</button><button type="button" class="ghost" data-shot="0|0">${T("No coffee","Geen koffie")}</button></div>
 <div class="grid">${f("eDose",T("Dose g","Dosis g"),d.dose,'class="num" inputmode="decimal"')}${f("eYield",T("Yield g","Opbrengst g"),d.yield,'class="num" inputmode="decimal"')}${f("eTime",T("Shot time","Shottijd"),d.time,'placeholder="27–30 s"')}</div>

 <label class="field"><span>${T("Ingredients (one per line)","Ingrediënten (één per regel)")}</span><textarea id="eAmt">${esc(lines(d.amt))}</textarea></label>
 <label class="field"><span>${T("Steps (one per line)","Stappen (één per regel)")}</span><textarea id="eSteps">${esc(lines(d.steps))}</textarea></label>
 <label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" id="eHidden" style="width:22px;height:22px;min-height:0;flex:none"${d.hidden?" checked":""}>${T("Hide from the menu for now (e.g. seasonal)","Voorlopig niet op het menu (bijv. seizoensdrankje)")}</label>

 const read=()=>{const v=id=>$("#"+id).value,n=id=>num(v(id))||0,keep=(old,val)=>L(old)===val?old:val,keepList=(old,txt)=>{const ls=txt.split("\n").map(s=>s.trim()).filter(Boolean);return lines(old)===ls.join("\n")?old:ls};

VIEWS.gear=()=>{

 if(kTab==="origins"){const regs=[["all",T("All","Alles")],["africa",T("Africa & Arabia","Afrika & Arabië")],["americas",T("The Americas","Amerika")],["asia",T("Asia & Pacific","Azië & Pacific")]];

 if(kTab==="world")body=`<div class="cards">${KWORLD.map(w=>`<div class="card"><b>${w[1]} ${esc(w[0])}</b><small>${L(w[2])}</small><p style="margin:4px 0 0;font-size:14px">${L(w[3])}</p></div>`).join("")}</div>`;
 if(kTab==="facts")body=`<div class="panel"><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${KFACTS.map(f=>`<li>${L(f)}</li>`).join("")}</ul></div>`;
 V(`<div class="panel"><h2>${T("Coffee knowledge","Koffiekennis")}</h2><p class="hint" style="margin-bottom:0">${T("Everything to talk about coffee like an expert: where it comes from, how it's grown and roasted, how to describe it, and how the world drinks it.","Alles om als een expert over koffie te praten: waar het vandaan komt, hoe het wordt verbouwd en gebrand, hoe je het beschrijft en hoe de wereld het drinkt.")}</p></div>

/* ---------- several cafés under one owner ----------
   Each café keeps its own copy of the fields below. The open café's copy lives directly on S
   (so every screen keeps working unchanged); switching swaps it with the stored copy. */
const PER_CAFE=["cafe","machine","grinder","staff","signoff","quiz","menu","menuVer","opts","routines","routinesVer","filter","cleanW","milkSeen","dial","tamper","clean","costs","plan","me","bonus"];
function stashCafe(){if(!S.cafes)return;const c={};PER_CAFE.forEach(k=>{if(S[k]!==undefined)c[k]=S[k]});S.cafes[S.cur]=JSON.parse(JSON.stringify(c))}
function ensureCafeDefaults(){
 if(!S.machine)S.machine="lm-linea-pb";if(!S.grinder)S.grinder="mk-e65s";if(S.cafe==null)S.cafe="";
 if(!Array.isArray(S.staff))S.staff=[];["signoff","quiz","clean","costs","plan"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});
 if(!Array.isArray(S.menu)){S.menu=DEFAULT_MENU.map(fromTpl);S.menuVer=2}
 if(!S.filter||typeof S.filter!=="object")S.filter={on:false,brewer:"moccamaster",grinder:"ek43"};
 if(!S.opts)S.opts=DEF_OPTS();if(!Array.isArray(S.routines))S.routines=defRoutines();
 if((S.routinesVer||1)<4&&Array.isArray(S.routines)){addDialItem(S.routines);addFullItem(S.routines);if((S.routinesVer||1)>=2)S.routinesVer=4}
 if((S.routinesVer||1)<2){if(!S.routines.some(r=>r.id==="hygiene")){const h=defRoutines().find(r=>r.id==="hygiene");if(h){const w=S.routines.findIndex(r=>r.weekly);S.routines.splice(w<0?S.routines.length:w,0,h)}}S.routinesVer=4}
 if(!S.bonus)S.bonus={[WORLD_SK]:0.1};
 // one-time fix: the old americano recipe said water first (that is a long black)
 S.menu.forEach(d=>{if(d.key==="americano"&&Array.isArray(d.steps)&&d.steps[0]&&(d.steps[0].en||d.steps[0])==="Hot water in the cup first."){const t=TEMPLATES.find(x=>x.key==="americano");if(t)d.steps=JSON.parse(JSON.stringify(t.steps))}});
}
function loadCafe(id){if(!S.cafes||!S.cafes[id])return;stashCafe();S.cur=id;const c=JSON.parse(JSON.stringify(S.cafes[id]));PER_CAFE.forEach(k=>{S[k]=c[k]});ensureCafeDefaults()}
const cafeName=(id,i)=>{const c=id===S.cur?S:S.cafes[id];return (c&&c.cafe)||T("Café","Café")+" "+(i+1)};
if(!S.cafes){S.cur="c1";S.cafes={};ensureCafeDefaults();stashCafe()}else{ensureCafeDefaults()}
// keep the stored copy of the open café up to date on every save
{const _save=save;save=()=>{stashCafe();_save()}}

function renderCafeBar(){const el=$("#cafeBar");if(!el)return;const ids=Object.keys(S.cafes||{});
 if(ids.length<2){el.hidden=true;el.innerHTML="";return}
 el.hidden=false;el.innerHTML=`<label class="cafeSel"><span>${T("Café","Café")}</span><select id="cafeSel" aria-label="${T("Choose café","Kies café")}">${ids.map((id,i)=>`<option value="${id}"${id===S.cur?" selected":""}>${esc(cafeName(id,i))}</option>`).join("")}</select></label>`;
 $("#cafeSel").onchange=e=>{loadCafe(e.target.value);save();go();toast(T("Switched to ","Gewisseld naar ")+cafeName(S.cur,ids.indexOf(S.cur)))}}
{const _rm=renderMenu;renderMenu=function(){_rm();renderCafeBar()}}

function cafesPanel(){const ids=Object.keys(S.cafes);stashCafe();
 const stat=id=>{const c=S.cafes[id],st=c.staff||[],so=c.signoff||{};const trained=st.filter(n=>reqFor(c.filter).every(k=>(so[n]||{})[k]==="ok")).length,ask=st.reduce((a,n)=>a+SKILLS.filter((_,k)=>(so[n]||{})[k]==="ask").length,0);
   const m=allM().find(x=>x.id===c.machine);return `${st.length} ${T("staff","personeel")} · ${trained} ${T("fully trained","volledig getraind")}${ask?` · <b class="warnT">${ask} ${T("to sign off","af te tekenen")}</b>`:""}${m?` · ${esc(m.brand+" "+m.name)}`:""}`};
 return `<div class="panel" id="cafesPanel"><h2>${T("Your cafés","Jouw cafés")}</h2><p class="hint">${T("Each café has its own staff, training, drinks, prices, cleaning lists and gear. Switch café at the top of the screen.","Elk café heeft eigen personeel, training, drankjes, prijzen, schoonmaaklijsten en apparatuur. Wissel van café bovenaan het scherm.")}</p>
 <div style="display:flex;flex-direction:column;gap:8px">${ids.map((id,i)=>`<div class="cafeRow${id===S.cur?" cur":""}"><span style="min-width:0"><b>${esc(cafeName(id,i))}</b>${id===S.cur?` <span class="tag on">${T("open now","nu open")}</span>`:""}<br><small class="hint">${stat(id)}</small></span>${id===S.cur?"":`<button type="button" class="ghost" data-open-cafe="${id}">${T("Open","Openen")}</button>`}</div>`).join("")}</div>
 <details style="margin-top:10px"><summary>${T("Add a café","Café toevoegen")}</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
  <label class="field"><span>${T("Name of the new café","Naam van het nieuwe café")}</span><input id="ncName" placeholder="${T("e.g. Corner Coffee Centrum","bijv. Koffie Hoek Centrum")}"></label>
  <label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" id="ncCopy" checked style="width:22px;height:22px;min-height:0;flex:none"><span>${T("Copy drinks, milk and extras, cleaning lists, gear and prices from","Kopieer drankjes, melk en extra's, schoonmaaklijsten, apparatuur en prijzen van")} <b>${esc(cafeName(S.cur,ids.indexOf(S.cur)))}</b></span></label>
  <p class="hint" style="margin:0">${T("Staff and training are not copied: every café starts with its own team.","Personeel en training worden niet gekopieerd: elk café begint met een eigen team.")}</p>
  <button type="button" class="btn" id="ncAdd">${T("Add café","Café toevoegen")}</button><p class="hint badT" id="ncErr" hidden>${T("Give the café a name.","Geef het café een naam.")}</p></div></details>
 ${ids.length>1?`<button type="button" class="ghost" id="delCafe" style="margin-top:10px">${T("Delete this café","Dit café verwijderen")}</button>`:""}</div>`}
function wireCafes(){
 document.querySelectorAll("[data-open-cafe]").forEach(b=>b.onclick=()=>{loadCafe(b.dataset.openCafe);save();go()});
 const add=$("#ncAdd");if(add)add.onclick=()=>{const name=$("#ncName").value.trim();if(!name){$("#ncErr").hidden=false;return}

 if(c.includes("email-already-in-use"))return loginT("That username is already taken. Pick another one, or sign in if it's yours.","Die gebruikersnaam is al bezet. Kies een andere, of log in als hij van jou is.");

async function cloudCheck(){
 try{const C=await cloudReady();const u=await C.current();
  if(!u){if(navigator.onLine){try{localStorage.removeItem("clbActive")}catch(e){}location.reload()}return}
  if(u.uid!==ACCOUNT.uid){try{localStorage.setItem("clbActive",u.uid);localStorage.setItem("clbUser",u.username)}catch(e){}location.reload();return}
  const r=await C.load();if(r&&r.json){let remote;try{remote=JSON.parse(r.json)}catch(e){return}
   if((remote.savedAt||0)>(S.savedAt||0)+1000){try{localStorage.setItem(KEY,r.json)}catch(e){}location.reload()}

    else if(android)h=`<div class="ibTxt"><b>${o.t("Install","Installeer")} ${o.name}</b><span>${o.t("No Install button? This page is probably open inside another app. Open it in Chrome, then tap Install here. Already installed? Open it from your home screen.","Geen installeerknop? Deze pagina staat waarschijnlijk open in een andere app. Open hem in Chrome en tik hier op Installeren. Al geïnstalleerd? Open hem vanaf je beginscherm.")}</span></div><a class="ibGo" href="${intent}">${o.t("Open in Chrome","Open in Chrome")}</a>`;
    else if(ios)h=`<div class="ibTxt"><b>${o.t("Install","Installeer")} ${o.name}</b><span>${o.t("In Safari, tap Share, then Add to Home Screen.","Tik in Safari op Delen en dan op Zet op beginscherm.")}</span></div>`;
    else{el.hidden=true;return}
    el.innerHTML=h+`<button type="button" class="ibX" aria-label="${o.t("Close","Sluiten")}">✕</button>`;el.hidden=false;shown=true;
    el.querySelector(".ibX").onclick=close;
    const g=el.querySelector("button.ibGo");if(g)g.onclick=async()=>{const dd=o.getDeferred();if(!dd)return;dd.prompt();const r=await dd.userChoice;o.clearDeferred();if(r&&r.outcome==="accepted")el.hidden=true;else paint()}}
  addEventListener("beforeinstallprompt",()=>setTimeout(paint,0));

  return paint;
}

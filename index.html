details.rList.full>summary{color:var(--good)}details.rList[open]{padding-bottom:12px}details.rList .bar{margin:0 0 6px}
.rRow{display:flex;align-items:stretch;gap:6px;border-top:1px solid var(--line)}
.rTask{flex:1;display:flex;align-items:flex-start;gap:12px;padding:12px 2px;min-height:52px;cursor:pointer;font-size:16px;line-height:1.35}

.rTask.done>span{color:var(--muted);text-decoration:line-through}
.rMeta{display:block;font-size:12px;color:var(--good);text-decoration:none}
.rPen{flex:none;width:44px;min-height:44px;align-self:center;background:none;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:18px;cursor:pointer}
.rEdit{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.rEdit textarea{font-size:16px;resize:vertical}
.rAdd{display:flex;gap:6px;margin-top:10px}.rAdd input{flex:1;min-width:0}
.rListEd{margin-top:6px;font-size:14px;background:none;border:0;padding:10px 0;min-height:44px;color:var(--crema);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit}
.undoBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.undoBar button{background:var(--crema);color:var(--on-crema);border:0;border-radius:10px;min-height:40px;padding:0 14px;font:inherit;cursor:pointer}
.bnav .nBadge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crema);color:var(--on-crema);font-size:11px;line-height:18px;font-weight:700}
.stageH{margin:14px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.stageH:first-child{margin-top:4px}
.locked{opacity:.6}
.tcardNext{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--crema);background:var(--crema-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:12px;font:inherit;cursor:pointer}.tcardNext small{color:var(--muted);font-weight:600}.tcardNext b{font-size:17px}.tcardNext span{color:var(--ink);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.dialStat{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-weight:700}
.tasteRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tBtn{min-height:52px;padding:6px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer;line-height:1.15}
.tBtn[aria-pressed="true"]{background:var(--crema);border-color:var(--crema);color:var(--on-crema)}
.dialAdv{margin-top:12px;padding:12px 14px;border:2px solid var(--crema);border-radius:14px;background:var(--crema-soft)}.dialAdv.good{border-color:var(--good)}.dialAdv h3{margin:0 0 6px}.dialAdv ol{margin:0;padding-left:20px}.dialAdv li{margin:4px 0}
.dialRow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.dialRow>span:first-child{width:18px;flex:none;font-weight:700}
.rDial{flex:none;align-self:center;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--crema);background:var(--crema);color:var(--on-crema);font:700 14px var(--body);cursor:pointer;white-space:nowrap}
.tcardNext.dialNow{border-color:var(--warn);background:var(--sunk)}
.fullSteps{margin:0;padding-left:20px}.fullSteps li{margin:8px 0}

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>isFinite(n)?(+n).toFixed(d).replace(".",S.lang==="en"?".":","):"–";
const LOC=()=>S.lang==="nl"?"nl-NL":S.lang==="pt"?"pt-PT":"en-GB";
const eur=n=>{if(!isFinite(n))return "–";try{return "€"+(+n).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2})}catch(e){return "€"+fmt(n,2)}};
const num=v=>parseFloat(String(v??"").replace(",","."));

/* ---------- storage (this device only until café accounts sync) ---------- */
const KEY=(()=>{try{const u=localStorage.getItem("clbActive");return u?"cafeWork:"+u:"cafeWork:guest"}catch(e){return "cafeWork:guest"}})();
const DEF={role:"boss",section:null,pin:"",machine:"lm-linea-pb",grinder:"mk-e65s",cafe:"",staff:[],signoff:{},menu:null,clean:{},costs:{},plan:{},lang:null};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}
if(!S.lang)S.lang=(()=>{try{for(const l of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""])){const c=String(l).slice(0,2).toLowerCase();if(c==="nl"||c==="pt"||c==="en")return c}}catch(e){}return "en"})();
let save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// T(english, dutch); L() reads a value that may be {en,nl} or plain text the owner typed
const PT={"Brazil":"Brasil","Ethiopia":"Etiópia","Italy":"Itália","Vietnam":"Vietname","Colombia":"Colômbia","1–2 spoons of milk foam":"1–2 colheres de espuma de leite","Pull a single shot into a small glass.":"Tira um simples para um copo pequeno.","Pull a double into a slightly bigger glass.":"Tira um duplo para um copo um pouco maior.","About 120 ml milk, very thin foam":"Cerca de 120 ml de leite, espuma muito fina","About 200 ml milk with plenty of foam":"Cerca de 200 ml de leite com muita espuma","A tall 300 ml glass":"Um copo alto de 300 ml","The Dutch 'wrong coffee': more milk than coffee.":"O 'café errado' neerlandês: mais leite do que café.","150–180 ml hot milk, a little foam":"150–180 ml de leite quente, um pouco de espuma","Steam the milk to 60–65 °C with only a little foam.":"Vaporiza o leite até 60–65 °C com só um pouco de espuma.","Pour the milk into the coffee.":"Deita o leite no café.","A glass of ice":"Um copo com gelo","200 ml milk":"200 ml de leite","Fill a glass with ice and cold milk.":"Enche um copo com gelo e leite frio.","Steam the milk as for a latte.":"Vaporiza o leite como para um latte.","Close":"Fechar","All":"Tudo","Drink":"Bebida","Where coffee comes from":"De onde vem o café","From Ethiopian forests to every café in the world.":"Das florestas da Etiópia para todos os cafés do mundo.","Coffee grows wild in the forests of south-west Ethiopia. The legend says a goat herder, Kaldi, saw his goats dance after eating the red berries.":"O café cresce de forma selvagem nas florestas do sudoeste da Etiópia. Diz a lenda que um pastor de cabras, Kaldi, viu as cabras a dançar depois de comerem as bagas vermelhas.","In the 1400s Sufi monks in Yemen drank coffee to stay awake for night prayers. The port of Mocha shipped it to the world, which is where the name 'mocha' comes from.":"No século XV, monges sufis no Iémen bebiam café para ficarem acordados nas orações da noite. O porto de Moca enviava-o para o mundo, e é daí que vem o nome 'moca'.","Coffee houses spread through Istanbul, Venice, London and Amsterdam in the 1600s. People called them 'penny universities' because you could learn the news for the price of a cup.":"No século XVII, os cafés espalharam-se por Istambul, Veneza, Londres e Amesterdão. Chamavam-lhes 'universidades de um cêntimo', porque pelo preço de uma chávena se ficava a saber as notícias.","The Dutch were among the first to grow coffee outside Arabia, on Java in the late 1600s. A plant from the Amsterdam botanical garden became the ancestor of much of Latin America's coffee.":"Os neerlandeses foram dos primeiros a cultivar café fora da Arábia, em Java, no fim do século XVII. Uma planta do jardim botânico de Amesterdão deu origem a grande parte do café da América Latina.","Espresso was born in Italy around 1900; the lever machines of the 1940s gave us crema.":"O espresso nasceu em Itália por volta de 1900; as máquinas de alavanca dos anos 40 deram-nos o creme.","“Coffee comes from Ethiopia, and the Dutch helped spread it around the world from Java.”":"“O café vem da Etiópia, e os neerlandeses ajudaram a espalhá-lo pelo mundo a partir de Java.”","The coffee plant and species":"A planta do café e as espécies","Arabica, robusta and the rare ones.":"Arábica, robusta e as raras.","Coffee beans are the seeds of a cherry. Each cherry usually holds two beans facing each other; a single round one is a 'peaberry'.":"O grão de café é a semente de uma cereja. Cada cereja tem normalmente dois grãos virados um para o outro; um único grão redondo chama-se 'peaberry' (caracol).","Arabica: about 60 % of the world's coffee. Grows high (often 1,000–2,200 m), sweeter, more acidity and aroma, about half the caffeine of robusta.":"Arábica: cerca de 60 % do café do mundo. Cresce em altitude (muitas vezes 1000–2200 m), é mais doce, com mais acidez e aroma, e cerca de metade da cafeína do robusta.","Robusta (Coffea canephora): hardier, grows lower and hotter, more bitter and earthy, more caffeine and thick crema. Common in Italian and Portuguese blends and in Vietnam.":"Robusta (Coffea canephora): mais resistente, cresce mais baixo e com mais calor, mais amargo e terroso, com mais cafeína e creme espesso. Comum nos lotes italianos e portugueses e no Vietname.","Liberica and excelsa are rare species from West Africa and South-East Asia, with big, irregular beans and fruity, smoky tastes.":"Liberica e excelsa são espécies raras da África Ocidental e do Sudeste Asiático, com grãos grandes e irregulares e sabores frutados e fumados.","Within arabica there are varieties, like grapes in wine: Typica, Bourbon, Caturra, Catuaí, SL28 (Kenya), Pacamara and the famous Gesha (Geisha), known for jasmine and bergamot.":"Dentro do arábica há variedades, como as castas no vinho: Typica, Bourbon, Caturra, Catuaí, SL28 (Quénia), Pacamara e o famoso Gesha (Geisha), conhecido pelo jasmim e pela bergamota.","“This blend has a little robusta for body and crema.”":"“Este lote tem um pouco de robusta para dar corpo e creme.”","From cherry to bean: processing":"Da cereja ao grão: o processamento","Washed, natural, honey: why it changes the taste.":"Lavado, natural, honey: porque muda o sabor.","After picking, the fruit has to come off the seed. How that happens changes the taste a lot.":"Depois da colheita, é preciso tirar o fruto da semente. A forma como isso se faz muda muito o sabor.","Washed: fruit removed with water before drying. Clean, bright and clear; typical for Kenya, Colombia and Central America.":"Lavado: o fruto é retirado com água antes de secar. Limpo, vivo e claro; típico do Quénia, da Colômbia e da América Central.","Natural (dry): the whole cherry dries in the sun. Fruity, sweet, heavy body, flavours like blueberry and wine; classic in Ethiopia and Brazil.":"Natural (seco): a cereja inteira seca ao sol. Frutado, doce, encorpado, com sabores como mirtilo e vinho; clássico na Etiópia e no Brasil.","Honey: some of the sticky fruit stays on while drying. Between washed and natural: sweet and round. Popular in Costa Rica.":"Honey: parte do fruto pegajoso fica no grão enquanto seca. Entre o lavado e o natural: doce e redondo. Popular na Costa Rica.","Wet-hulled (Giling Basah): used in Sumatra; earthy, herbal and very full-bodied. Anaerobic and carbonic fermentation are newer experiments with very intense fruity flavours.":"Descasque húmido (Giling Basah): usado em Samatra; terroso, herbáceo e muito encorpado. As fermentações anaeróbica e carbónica são experiências mais recentes, com sabores frutados muito intensos.","“It's a natural process, so expect more fruit and sweetness.”":"“É um processo natural, por isso conta com mais fruta e doçura.”","Roasting":"Torra","Light, medium, dark: what heat does to a bean.":"Clara, média, escura: o que o calor faz ao grão.","Green coffee is roasted at about 200–230 °C for 8–15 minutes. Sugars caramelise and hundreds of aromas form.":"O café verde é torrado a cerca de 200–230 °C durante 8–15 minutos. Os açúcares caramelizam e formam-se centenas de aromas.","'First crack' is a popping sound when the bean expands; light roasts stop soon after. 'Second crack' comes later; dark roasts go into it and taste smoky and bitter.":"O 'primeiro crack' é um estalido quando o grão se expande; as torras claras param pouco depois. O 'segundo crack' vem mais tarde; as torras escuras entram nele e ficam fumadas e amargas.","Light roast: shows the origin: fruity, floral, more acidity. Medium: balanced, caramel and nuts. Dark: chocolate, roast, less acidity, the bean's origin is harder to taste.":"Torra clara: mostra a origem: frutada, floral, mais acidez. Média: equilibrada, caramelo e frutos secos. Escura: chocolate, torrado, menos acidez, a origem do grão nota-se menos.","Coffee needs a few days' rest after roasting to release CO₂; espresso is usually best 7–30 days after roasting.":"O café precisa de alguns dias de descanso depois da torra para libertar CO₂; o espresso costuma estar melhor 7–30 dias depois da torra.","Darker does not mean more caffeine; per bean it's about the same.":"Mais escuro não quer dizer mais cafeína; por grão é mais ou menos igual.","“It's a lighter roast, so you taste more of where it comes from.”":"“É uma torra mais clara, por isso sente-se mais a origem.”","How to taste and describe coffee":"Como provar e descrever café","The words experts use.":"As palavras que os especialistas usam.","Acidity: the bright, juicy, lively feeling, like fruit. Not the same as sour, which is unpleasant and comes from under-extraction.":"Acidez: a sensação viva, suculenta e alegre, como na fruta. Não é o mesmo que azedo, que é desagradável e vem da subextração.","Sweetness: caramel, honey, brown sugar, ripe fruit. Good coffee is sweet without sugar.":"Doçura: caramelo, mel, açúcar mascavado, fruta madura. Um bom café é doce sem açúcar.","Body: how heavy it feels in the mouth: light like tea, or thick like syrup.":"Corpo: o peso que se sente na boca: leve como chá ou espesso como xarope.","Aftertaste (finish): what stays after you swallow. Long and sweet is good; dry and bitter is not.":"Final (retrogosto): o que fica depois de engolir. Longo e doce é bom; seco e amargo não.","Flavour families: fruity (berries, citrus), floral (jasmine), nutty and chocolate, caramel, spicy, earthy. Name two or three you really taste; don't guess.":"Famílias de sabores: frutado (frutos vermelhos, citrinos), floral (jasmim), frutos secos e chocolate, caramelo, especiado, terroso. Diz dois ou três que sentes mesmo; não adivinhes.","“It's sweet with notes of milk chocolate and a little red fruit, and a long finish.”":"“É doce, com notas de chocolate de leite e um pouco de fruta vermelha, e tem um final longo.”","Brewing methods":"Métodos de preparação","Espresso, filter, French press and more.":"Espresso, filtro, cafeteira de êmbolo e mais.","Espresso: hot water pushed through finely ground coffee at about 9 bar in 25–30 s. Short, strong, with crema.":"Espresso: água quente empurrada através de café moído fino a cerca de 9 bar em 25–30 s. Curto, forte, com creme.","Pour-over (V60, Chemex, Kalita): water poured by hand through a paper filter. Clean and clear; shows the origin well.":"Filtro manual (V60, Chemex, Kalita): água deitada à mão através de um filtro de papel. Limpo e claro; mostra bem a origem.","Batch brew: a filter machine making litres at once; great for busy mornings.":"Café de filtro em máquina (batch brew): uma máquina que faz litros de uma vez; ótimo para manhãs com muito movimento.","French press: coffee steeps 4 minutes, then a metal mesh is pressed down. Full-bodied, a bit of sediment.":"Cafeteira de êmbolo: o café fica em infusão 4 minutos e depois empurra-se uma rede de metal. Encorpado, com algum depósito.","AeroPress, moka pot, siphon and cold brew (coffee steeped 12–24 h in cold water: smooth, low bitterness) are other popular ways.":"AeroPress, moka, sifão e cold brew (café em infusão 12–24 h em água fria: suave, pouco amargo) são outras formas populares.","“For this single origin I'd recommend it as filter: you'll taste the fruit better.”":"“Para esta origem única recomendo em filtro: sente-se melhor a fruta.”","Caffeine and health":"Cafeína e saúde","Answers to the questions guests ask.":"Respostas às perguntas que os clientes fazem.","A single espresso has about 60–80 mg of caffeine; a mug of filter coffee often has more (100–150 mg) because it's a bigger drink.":"Um espresso simples tem cerca de 60–80 mg de cafeína; uma caneca de café de filtro tem muitas vezes mais (100–150 mg), porque é uma bebida maior.","Health authorities in Europe say up to about 400 mg a day is fine for most adults, and about 200 mg a day during pregnancy.":"As autoridades de saúde europeias dizem que até cerca de 400 mg por dia é seguro para a maioria dos adultos, e cerca de 200 mg por dia durante a gravidez.","Decaf has almost all the caffeine removed with water, CO₂ or a solvent: in the EU at most 0.1 % caffeine may be left in the roasted beans. Swiss Water decaf uses only water.":"O descafeinado tem quase toda a cafeína retirada com água, CO₂ ou um solvente: na UE pode ficar no máximo 0,1 % de cafeína no grão torrado. O descafeinado Swiss Water usa só água.","For medical questions, guests should ask their doctor; you can tell them what's in the drink.":"Para questões médicas, o cliente deve falar com o médico; tu podes dizer o que tem a bebida.","“A double espresso has roughly the same caffeine as a mug of filter coffee.”":"“Um espresso duplo tem mais ou menos a mesma cafeína que uma caneca de café de filtro.”","Fair trade, specialty and price":"Comércio justo, especialidade e preço","Why some coffee costs more.":"Porque é que alguns cafés custam mais.","About 12.5 million farms grow coffee, most of them small family farms.":"Cerca de 12,5 milhões de quintas cultivam café, a maioria pequenas quintas familiares.","'Specialty coffee' scores 80+ points out of 100 when tasted by trained graders. It's traceable, often to a single farm.":"O 'café de especialidade' tem 80 ou mais pontos em 100 quando provado por provadores certificados. É rastreável, muitas vezes até uma única quinta.","Labels like Fairtrade and Rainforest Alliance set minimum standards. 'Direct trade' means the roaster buys directly from the farmer, often paying well above market price.":"Selos como Fairtrade e Rainforest Alliance definem padrões mínimos. 'Comércio direto' quer dizer que o torrador compra diretamente ao produtor, muitas vezes bem acima do preço de mercado.","The Netherlands is one of the biggest coffee drinkers in the world: around 2–3 cups per person per day.":"Os Países Baixos estão entre os maiores bebedores de café do mundo: cerca de 2–3 chávenas por pessoa por dia.","“Our roaster buys this directly from the farm, so the farmer gets a better price.”":"“O nosso torrador compra este café diretamente à quinta, por isso o produtor recebe um preço melhor.”","Floral and fruity: jasmine, bergamot, blueberry, lemon.":"Floral e frutado: jasmim, bergamota, mirtilo, limão.","Birthplace of coffee. Famous regions: Yirgacheffe, Sidamo, Guji. Washed = tea-like and floral, natural = blueberry jam.":"O berço do café. Regiões famosas: Yirgacheffe, Sidamo, Guji. Lavado = leve como chá e floral; natural = doce de mirtilo.","Juicy and bright: blackcurrant, grapefruit, tomato-like.":"Suculento e vivo: groselha preta, toranja, lembra tomate.","SL28 and SL34 varieties; beans graded by size (AA is the largest).":"Variedades SL28 e SL34; grãos classificados por tamanho (AA é o maior).","Sweet and clean: red apple, black tea, citrus.":"Doce e limpo: maçã vermelha, chá preto, citrinos.","Small farms on 'the land of a thousand hills'; mostly Bourbon variety.":"Pequenas quintas na 'terra das mil colinas'; sobretudo variedade Bourbon.","Robusta from Uganda; bright arabica from Kilimanjaro.":"Robusta do Uganda; arábica vivo do Kilimanjaro.","Uganda is Africa's second-largest producer and a home of wild robusta.":"O Uganda é o segundo maior produtor de África e uma terra de robusta selvagem.","Wild and complex: dried fruit, spice, chocolate.":"Selvagem e complexo: fruta seca, especiarias, chocolate.","The original 'Mocha' coffee; grown on terraces, dried naturally, rare and expensive.":"O 'Moca' original; cultivado em socalcos, seco ao natural, raro e caro.","Nutty and chocolatey, low acidity, heavy body.":"Frutos secos e chocolate, pouca acidez, muito corpo.","World's biggest producer (about a third of all coffee). The base of many espresso blends.":"O maior produtor do mundo (cerca de um terço de todo o café). A base de muitos lotes de espresso.","Balanced and sweet: caramel, red fruit, citrus.":"Equilibrado e doce: caramelo, fruta vermelha, citrinos.","Two harvests a year in many regions; mostly washed. Famous for its coffee-growing landscape (UNESCO).":"Duas colheitas por ano em muitas regiões; sobretudo lavado. Famoso pela sua paisagem cafeeira (UNESCO).","Chocolate, spice, brown sugar; sometimes smoky.":"Chocolate, especiarias, açúcar mascavado; às vezes fumado.","Volcanic soils; Antigua and Huehuetenango are famous regions.":"Solos vulcânicos; Antigua e Huehuetenango são regiões famosas.","Clean and sweet: honey, citrus, stone fruit.":"Limpo e doce: mel, citrinos, fruta de caroço.","Known for honey processing and 'micro-mills' where farmers process their own coffee.":"Conhecido pelo processo honey e pelos 'micro-mills', onde os produtores processam o próprio café.","Sweet and soft: caramel, apricot, milk chocolate.":"Doce e suave: caramelo, alperce, chocolate de leite.","Honduras is Central America's largest producer; El Salvador is home of the Pacamara variety.":"As Honduras são o maior produtor da América Central; El Salvador é a terra da variedade Pacamara.","Gesha: jasmine, bergamot, peach, very delicate.":"Gesha: jasmim, bergamota, pêssego, muito delicado.","Panama Gesha set world-record auction prices, sometimes thousands of euros per kilo.":"O Gesha do Panamá bateu recordes mundiais em leilões, às vezes milhares de euros por quilo.","Soft and nutty, cocoa, gentle acidity.":"Suave e com frutos secos, cacau, acidez delicada.","Large producers of organic and Fairtrade coffee.":"Grandes produtores de café biológico e Fairtrade.","Blue Mountain: mild, smooth, clean.":"Blue Mountain: suave, macio, limpo.","Grown in the Blue Mountains; very limited and pricey; much of it goes to Japan.":"Cultivado nas Blue Mountains; muito limitado e caro; grande parte vai para o Japão.","Kona: smooth, sweet, buttery.":"Kona: macio, doce, amanteigado.","One of the few places in the USA where coffee grows.":"Um dos poucos sítios nos EUA onde se cultiva café.","Strong robusta: dark chocolate, earthy, bold.":"Robusta forte: chocolate negro, terroso, intenso.","World's second-largest producer, mostly robusta.":"O segundo maior produtor do mundo, sobretudo robusta.","Sumatra: earthy, herbal, cedar, heavy body. Java: spicy, low acidity.":"Samatra: terroso, herbáceo, cedro, muito corpo. Java: especiado, pouca acidez.","Wet-hulled processing gives the typical Sumatra taste. Also home of kopi luwak, which many now avoid for animal welfare reasons.":"O descasque húmido dá o sabor típico de Samatra. É também a terra do kopi luwak, que hoje muitos evitam por razões de bem-estar animal.","Spicy, low acidity; 'Monsooned Malabar' tastes woody and mellow.":"Especiado, pouca acidez; o 'Monsooned Malabar' sabe a madeira e é suave.","Coffee often grows in the shade of pepper and spice plants.":"O café cresce muitas vezes à sombra de pimenteiras e outras especiarias.","PNG: fruity and sweet. Yunnan (China): soft, nutty, growing fast in quality.":"PNG: frutado e doce. Yunnan (China): suave, com frutos secos, a melhorar depressa em qualidade.","New origins you'll see more of in specialty cafés.":"Origens novas que vais ver cada vez mais em cafés de especialidade.","Short and strong, drunk standing at the bar in a few sips. Cappuccino is only for the morning.":"Curto e forte, bebido de pé ao balcão em poucos goles. O cappuccino é só para a manhã.","Bica is Lisbon's short coffee; galão is milky coffee in a tall glass.":"A bica é o café curto de Lisboa; o galão é café com muito leite num copo alto.","Spain":"Espanha","Bombón: espresso over sweet condensed milk. Carajillo: espresso with brandy or rum.":"Bombón: espresso sobre leite condensado. Carajillo: espresso com aguardente ou rum.","Netherlands":"Países Baixos","'Wrong coffee': more milk than coffee. Traditionally served with a koekje (biscuit).":"'Café errado': mais leite do que café. Tradicionalmente servido com um koekje (bolacha).","Austria":"Áustria","Vienna's coffee house classic: espresso with steamed milk and foam, served with a glass of water.":"O clássico dos cafés de Viena: espresso com leite vaporizado e espuma, servido com um copo de água.","Türkiye":"Turquia","Very fine coffee boiled with water (and sugar) in a cezve; unfiltered, with foam. UNESCO cultural heritage.":"Café muito fino fervido com água (e açúcar) numa cezve; sem filtrar, com espuma. Património cultural da UNESCO.","Greece":"Grécia","Instant coffee shaken with ice and water into a thick foam. Freddo espresso is the modern iced version.":"Café instantâneo batido com gelo e água até fazer uma espuma espessa. O freddo espresso é a versão gelada moderna.","Sweden / Finland":"Suécia / Finlândia","Hot coffee poured over cubes of squeaky cheese, eaten with a spoon. Nordic countries drink the most coffee per person.":"Café quente deitado sobre cubos de queijo que chia nos dentes, comido à colher. Os países nórdicos são os que bebem mais café por pessoa.","Ireland":"Irlanda","Hot coffee, Irish whiskey and brown sugar with a layer of lightly whipped cream.":"Café quente, whiskey irlandês e açúcar mascavado com uma camada de natas meio batidas.","Australia / New Zealand":"Austrália / Nova Zelândia","Both countries claim it: a double shot with thin, velvety milk. Australians also made the 'long black'.":"Os dois países dizem que o inventaram: um duplo com leite fino e aveludado. Os australianos também criaram o 'long black'.","Strong robusta dripped through a phin filter onto sweet condensed milk, then over ice.":"Robusta forte a pingar por um filtro phin sobre leite condensado, depois com gelo.","Hanoi's speciality: coffee topped with egg yolk whipped with sugar and condensed milk, like a custard foam.":"A especialidade de Hanói: café coberto com gema de ovo batida com açúcar e leite condensado, como uma espuma de creme.","Coffee mixed with milk tea, hot or iced.":"Café misturado com chá com leite, quente ou gelado.","Malaysia / Singapore":"Malásia / Singapura","Coffee roasted with butter and sugar, brewed in a cloth 'sock' and served with condensed milk.":"Café torrado com manteiga e açúcar, coado numa 'meia' de pano e servido com leite condensado.","South India":"Sul da Índia","Coffee with chicory from a metal filter, mixed with hot milk and poured between two cups to froth it.":"Café com chicória num filtro de metal, misturado com leite quente e passado entre duas chávenas para fazer espuma.","South Korea":"Coreia do Sul","Instant coffee, sugar and water whipped into a fluffy cream on top of cold milk.":"Café instantâneo, açúcar e água batidos até ficar um creme fofo por cima de leite frio.","Japan":"Japão","Japan loves hot and cold canned coffee from vending machines, and slow hand-poured coffee in old 'kissaten' cafés.":"O Japão adora café em lata, quente e frio, das máquinas de venda, e café filtrado à mão com calma nos velhos 'kissaten'.","The coffee ceremony: beans roasted in a pan, ground by hand and brewed in a clay jebena; three rounds, often with incense and popcorn.":"A cerimónia do café: o grão é torrado numa panela, moído à mão e preparado numa jebena de barro; três rondas, muitas vezes com incenso e pipocas.","Saudi Arabia / Gulf":"Arábia Saudita / Golfo","Lightly roasted coffee with cardamom (sometimes saffron), served in tiny cups with dates as a sign of welcome.":"Café de torra clara com cardamomo (às vezes açafrão), servido em chávenas minúsculas com tâmaras, em sinal de boas-vindas.","Mexico":"México","Coffee brewed in a clay pot with cinnamon and piloncillo (raw cane sugar).":"Café feito numa panela de barro com canela e piloncillo (açúcar de cana bruto).","Espresso whipped with sugar into a sweet foam ('espumita'), shared in small cups.":"Espresso batido com açúcar até fazer uma espuma doce ('espumita'), partilhado em chávenas pequenas.","A small black filter coffee sold everywhere on the street, often sweetened with panela.":"Um pequeno café de filtro, sem leite, vendido em toda a parte na rua, muitas vezes adoçado com panela.","A small, strong, sweet cup offered as a welcome in homes and shops.":"Uma chávena pequena, forte e doce, oferecida como boas-vindas em casas e lojas.","Coffee is the world's most traded tropical agricultural product; around 2 to 3 billion cups are drunk every day.":"O café é o produto agrícola tropical mais comercializado do mundo; bebem-se cerca de 2 a 3 mil milhões de chávenas por dia.","Coffee cherries are mostly picked by hand; one tree gives roughly 0.5–1 kg of roasted coffee a year.":"As cerejas de café são quase sempre apanhadas à mão; uma árvore dá cerca de 0,5–1 kg de café torrado por ano.","The word 'coffee' comes via Dutch 'koffie' from Turkish 'kahve' and Arabic 'qahwa'.":"A palavra 'café' vem, através do neerlandês 'koffie' e do turco 'kahve', do árabe 'qahwa'.","Crema is made of oils and CO₂ bubbles. Robusta and fresh coffee give more of it, but more crema does not mean better taste.":"O creme é feito de óleos e bolhas de CO₂. O robusta e o café fresco dão mais creme, mas mais creme não quer dizer melhor sabor.","Cascara is the dried skin of the coffee cherry, brewed like a fruity tea.":"Cascara é a pele seca da cereja do café, preparada como um chá frutado.","Cold water extracts less bitterness, which is why cold brew tastes so smooth.":"A água fria extrai menos amargor, e é por isso que o cold brew é tão suave.","Espresso means 'pressed out' in Italian, not 'fast'.":"Espresso quer dizer 'espremido' em italiano, não 'rápido'.","Coffee is about 98 % water in the cup, so water quality matters a lot.":"O café na chávena é cerca de 98 % água, por isso a qualidade da água importa muito.","The basics":"O básico","Countries":"Países","Fun facts":"Curiosidades","Africa & Arabia":"África e Arábia","The Americas":"As Américas","Asia & Pacific":"Ásia e Pacífico","Volumetric dosing":"Doseamento volumétrico","Programmed buttons stop the shot after a set amount of water (counted by a flowmeter). Set them once for the house recipe; check yield on a scale daily because grind and beans change it.":"Os botões programados param a extração depois de uma quantidade fixa de água (contada por um fluxómetro). Programa-os uma vez para a receita da casa; confirma o rendimento na balança todos os dias, porque a moagem e o grão mudam-no.","Hold the programming button, start the shot with the button you want, stop it at the right yield, release. The machine remembers the pulse count.":"Mantém carregado o botão de programação, começa a extração com o botão que queres, para no rendimento certo e larga. A máquina memoriza a contagem de impulsos.","Manual / continuous button":"Botão manual / contínuo","Starts and stops the shot by hand. Use it when dialling in with a scale, and for purging the group.":"Começa e para a extração à mão. Usa-o para afinar com a balança e para purgar o grupo.","Press once to start, again to stop at your target weight.":"Carrega uma vez para começar e outra para parar no peso que queres.","PID temperature control":"Controlo de temperatura PID","Electronic control keeps brew water within about ±0.5 °C. Light roasts like it hotter (93–95 °C), dark roasts cooler (88–91 °C).":"O controlo eletrónico mantém a água a cerca de ±0,5 °C. As torras claras gostam de mais calor (93–95 °C), as escuras de menos (88–91 °C).","Change temperature in the service menu or display; wait 10 minutes after a change before judging taste.":"Muda a temperatura no menu técnico ou no ecrã; espera 10 minutos depois de mudar antes de avaliar o sabor.","Independent group boilers":"Caldeiras independentes por grupo","Each group has its own boiler, so two groups can brew at different temperatures (e.g. house blend and a guest single origin).":"Cada grupo tem a sua caldeira, por isso dois grupos podem extrair a temperaturas diferentes (p. ex. o lote da casa e uma origem convidada).","Label each group with the bean it is set for.":"Identifica cada grupo com o café para que está regulado.","Pre-infusion":"Pré-infusão","Wets the puck at low pressure before full pressure. Fewer channels, more even extraction, especially with fine light roasts.":"Molha o café com pouca pressão antes da pressão total. Menos canalização, extração mais uniforme, sobretudo com torras claras e moagem fina.","Set the pre-infusion time (usually 2–8 s). Longer pre-infusion = slightly longer total shot time.":"Define o tempo de pré-infusão (normalmente 2–8 s). Pré-infusão mais longa = tempo total de extração um pouco maior.","Pressure / flow profiling":"Perfil de pressão / fluxo","The barista or a stored program changes pressure or flow during the shot (e.g. soft start, 9 bar, taper to 6 bar).":"O barista ou um programa guardado muda a pressão ou o fluxo durante a extração (p. ex. início suave, 9 bar, a descer até 6 bar).","Start with the factory flat 9 bar profile; change one stage at a time and compare taste.":"Começa com o perfil de fábrica, 9 bar constantes; muda uma fase de cada vez e compara o sabor.","Gravimetric (scales in the drip tray)":"Gravimétrico (balança no tabuleiro)","Scales under the cup stop the shot at a target weight in grams instead of a water volume. Most consistent yield.":"A balança debaixo da chávena para a extração num peso em gramas em vez de um volume de água. O rendimento mais constante.","Tare happens automatically; keep the drip tray clean and dry or weights drift.":"A tara é automática; mantém o tabuleiro limpo e seco, senão o peso desvia-se.","Shot timer display":"Temporizador de extração no ecrã","Shows the extraction time per group. Shot time is your fastest signal of grind drift.":"Mostra o tempo de extração de cada grupo. O tempo é o sinal mais rápido de que a moagem mudou.","Note the time with each check shot; aim for the house window, usually 25–32 s.":"Aponta o tempo em cada extração de controlo; procura a janela da casa, normalmente 25–32 s.","Automatic milk steaming":"Vaporização automática do leite","A temperature probe in the wand stops steaming at a set temperature; some machines also set the foam amount.":"Uma sonda no vaporizador para o vapor a uma temperatura definida; algumas máquinas também regulam a quantidade de espuma.","Set stop temperature 55–65 °C; still purge and wipe the wand after every jug.":"Define a paragem nos 55–65 °C; continua a purgar e a limpar o vaporizador depois de cada jarro.","Cool-touch steam wands":"Vaporizadores frios ao toque","Insulated wands stay cool so milk does not bake on. Faster cleaning, fewer burns.":"Os vaporizadores isolados ficam frios, por isso o leite não coze lá. Limpeza mais rápida, menos queimaduras.","Still purge before and after, and wipe with a dedicated damp cloth.":"Purga na mesma antes e depois, e limpa com um pano húmido só para isso.","Hot water tap with mix":"Torneira de água quente com mistura","Delivers water for Americanos and tea; a mixing valve sets the temperature so it doesn't spit or scald.":"Dá água para americanos e chá; uma válvula de mistura regula a temperatura para não salpicar nem escaldar.","Use it for Americanos and tea; never to rinse portafilters with detergent in them.":"Usa-a para americanos e chá; nunca para passar porta-filtros com detergente.","Eco / standby mode":"Modo eco / espera","Lowers boiler temperatures or switches off groups during quiet hours to save energy.":"Baixa a temperatura das caldeiras ou desliga grupos nas horas calmas para poupar energia.","Program it to wake 30 minutes before opening.":"Programa-a para acordar 30 minutos antes de abrir.","Automatic cleaning cycle":"Ciclo de limpeza automático","Runs the backflush program with a blind basket and detergent at the press of a button.":"Faz o programa de contralavagem com filtro cego e detergente ao carregar num botão.","Daily at closing: blind basket + 1 tablet/scoop of detergent per group, run the cycle, then a rinse cycle without detergent.":"Todos os dias ao fechar: filtro cego + 1 pastilha/medida de detergente por grupo, corre o ciclo e depois um ciclo de enxaguamento sem detergente.","Telemetry / connectivity":"Telemetria / ligação","Sends shot counts, errors and maintenance alerts to an app or the technician.":"Envia contagens de extrações, erros e avisos de manutenção para uma app ou para o técnico.","Owners can see shot counts per group and when filters or gaskets are due.":"O dono vê as extrações por grupo e quando é preciso mudar filtros ou borrachas.","Pump pressure & boiler gauges":"Manómetros da bomba e da caldeira","Show brew pressure (about 9 bar while brewing) and steam boiler pressure (usually 1–1.5 bar).":"Mostram a pressão de extração (cerca de 9 bar a extrair) e a pressão da caldeira de vapor (normalmente 1–1,5 bar).","If brew pressure drops or steam pressure is low, call the technician; don't adjust the pump yourself.":"Se a pressão de extração cair ou a de vapor estiver baixa, chama o técnico; não mexas tu na bomba.","Cup warmer":"Aquecedor de chávenas","Keeps cups warm so the espresso doesn't lose heat and crema when it hits the cup.":"Mantém as chávenas quentes para o espresso não perder calor e creme ao cair na chávena.","Store only clean, dry cups upside-down on the warmer.":"Põe só chávenas limpas e secas, viradas para baixo, no aquecedor.","Built-in grinder and milk system (super-automatic)":"Moinho e sistema de leite incorporados (superautomática)","Grinds, tamps, brews and textures milk by itself at the press of a drink button. The barista's job becomes setup, cleaning and quality checks.":"Mói, calca, extrai e texturiza o leite sozinha ao carregar no botão da bebida. O trabalho do barista passa a ser preparar, limpar e controlar a qualidade.","Run the daily milk-system and brew-unit clean; check one espresso on a scale every morning.":"Faz a limpeza diária do sistema de leite e da unidade de extração; verifica um espresso na balança todas as manhãs.","Traditional":"Tradicional","Multi-boiler":"Multicaldeira","Dual boiler":"Duas caldeiras","Heat exchanger":"Permutador de calor","Super-automatic":"Superautomática","pressure/flow profiling":"perfil de pressão/fluxo","gravimetric":"gravimétrico","Stepless":"Sem passos","Stepless dial with numbers":"Regulação contínua com números","Grind by weight":"Moagem por peso","Time dosing":"Doseamento por tempo","Display":"Ecrã","Burr cooling":"Arrefecimento das mós","Single dose":"Dose única","Filter and retail":"Filtro e venda ao público","Heated burr chamber":"Câmara das mós aquecida","Quiet":"Silencioso","Safety & hygiene":"Segurança e higiene","Hot surfaces, steam and cleaning chemicals; washes hands; knows allergens (milk types)":"Superfícies quentes, vapor e produtos de limpeza; lava as mãos; conhece os alergénios (tipos de leite)","Machine start-up":"Ligar a máquina","Opening routine alone: flush groups, check gauges, warm cups":"Rotina de abertura sozinho: passar água nos grupos, ver os manómetros, aquecer chávenas","Grinder basics":"O básico do moinho","Knows which way is finer/coarser and how much to move it":"Sabe para que lado é mais fino/grosso e quanto rodar","Dose and distribute":"Dosear e distribuir","Hits the house dose ±0.2 g; even distribution; level tamp":"Acerta na dose da casa ±0,2 g; distribuição uniforme; calca direito","Pull a balanced shot alone":"Tirar sozinho um espresso equilibrado","Within the house ratio and time window; tastes balanced":"Dentro do rácio e do tempo da casa; sabe equilibrado","Dial in the morning":"Afinar de manhã","Adjusts the grinder from a check shot with the scale":"Ajusta o moinho a partir de uma extração de controlo com a balança","Taste: sour vs bitter":"Sabor: ácido vs amargo","Tells under- from over-extraction and says the fix":"Distingue sub- de sobre-extração e diz a solução","Steam milk: silky microfoam":"Vaporizar leite: microespuma sedosa","Flat white texture, 55–65 °C, no big bubbles":"Textura de flat white, 55–65 °C, sem bolhas grandes","Steam milk: cappuccino foam":"Vaporizar leite: espuma de cappuccino","Thicker foam that holds its shape":"Espuma mais espessa que mantém a forma","Plant-milk steaming":"Vaporizar bebidas vegetais","Oat/soy without splitting or overheating":"Aveia/soja sem talhar nem aquecer demais","Matcha & chai":"Matcha e chai","Whisks matcha without lumps; makes chai to the house recipe":"Bate o matcha sem grumos; faz o chai pela receita da casa","Latte art: heart":"Latte art: coração","Centred heart, good contrast":"Coração centrado, bom contraste","Latte art: tulip / rosetta":"Latte art: tulipa / roseta","Clean layered pattern":"Desenho limpo, em camadas","Full house menu from memory":"Toda a carta da casa de cor","Every drink, size and recipe":"Todas as bebidas, tamanhos e receitas","Speed: 2 drinks in 3 min":"Rapidez: 2 bebidas em 3 min","Two milk drinks to standard during a rush":"Duas bebidas com leite bem feitas durante a hora de ponta","Closing & cleaning alone":"Fechar e limpar sozinho","Backflush, wands, grinder, drip trays, floors":"Contralavagem, vaporizadores, moinho, tabuleiros, chão","Explain the coffee to a customer":"Explicar o café a um cliente","Origin, taste and why we brew it like this":"Origem, sabor e porque o preparamos assim","Tamping pressure":"Pressão ao calcar","Tamps level and the same every time; for small drifts uses the automatic tamper setting, or dose and yield by hand, and the grinder for big ones":"Calca direito e sempre igual; para pequenos desvios usa a regulação do calcador automático, ou dose e rendimento à mão, e o moinho para os grandes","Steam wands, group heads and the hot-water tap can burn you. Point the wand into the drip tray when you purge.":"Os vaporizadores, os grupos e a torneira de água quente queimam. Aponta o vaporizador para o tabuleiro quando purgas.","Wash your hands at the start of a shift, after the bathroom and after handling money or bins.":"Lava as mãos no início do turno, depois da casa de banho e depois de mexer em dinheiro ou no lixo.","Cleaning powder for the machine never goes near drinks. Rinse everything well.":"O pó de limpeza da máquina nunca chega perto das bebidas. Enxagua tudo bem.","Milk is an allergen. Use a separate, clean jug and wand purge for plant milks when a guest asks for no dairy.":"O leite é um alergénio. Usa um jarro separado e limpo e purga o vaporizador para bebidas vegetais quando o cliente pede sem lactose/leite.","A guest has a milk allergy and orders an oat latte. What do you do?":"Um cliente tem alergia ao leite e pede um latte de aveia. O que fazes?","Use the same jug as the last cow's-milk latte":"Usar o mesmo jarro do último latte com leite de vaca","Use a clean jug and purge the wand first":"Usar um jarro limpo e purgar primeiro o vaporizador","Nothing special, oat is fine":"Nada de especial, a aveia não faz mal","When do you wash your hands?":"Quando lavas as mãos?","Only at the start of the day":"Só no início do dia","Start of shift, after the toilet, after money or bins":"Início do turno, depois da casa de banho, depois de dinheiro ou lixo","Only when they look dirty":"Só quando parecem sujas","The machine needs about 30 minutes to heat up fully, even if the lights say it is ready.":"A máquina precisa de cerca de 30 minutos para aquecer bem, mesmo que as luzes digam que está pronta.","Check the gauges: about 1–1.5 bar on the steam boiler, about 9 bar while a shot runs.":"Vê os manómetros: cerca de 1–1,5 bar na caldeira de vapor, cerca de 9 bar durante a extração.","Flush each group for a few seconds and lock in the portafilters so they heat up too.":"Passa água em cada grupo alguns segundos e encaixa os porta-filtros para aquecerem também.","The first shot of the day is a check shot: weigh it, time it and taste it before serving guests.":"A primeira extração do dia é de controlo: pesa, cronometra e prova antes de servir clientes.","How long does the machine need to warm up?":"Quanto tempo precisa a máquina para aquecer?","About 5 minutes":"Cerca de 5 minutos","About 30 minutes":"Cerca de 30 minutos","It's ready when you switch it on":"Está pronta quando a ligas","Why do you leave the portafilters in the group?":"Porque deixas os porta-filtros no grupo?","So they stay warm":"Para ficarem quentes","So nobody steals them":"Para ninguém os roubar","It cleans them":"Assim limpam-se","Finer grind = water flows slower = longer shot. Coarser grind = faster shot.":"Moagem mais fina = a água passa mais devagar = extração mais longa. Moagem mais grossa = extração mais rápida.","Move the grinder in small steps. A tiny turn can change the shot by several seconds.":"Mexe no moinho aos poucos. Uma rotação pequenina pode mudar a extração vários segundos.","After a change, grind one dose and throw it away: old coffee is still in the grinder.":"Depois de mudar, mói uma dose e deita-a fora: ainda há café antigo no moinho.","Adjust while the motor runs so beans don't get stuck between the burrs.":"Ajusta com o motor a trabalhar para o grão não ficar preso entre as mós.","Your shot runs too fast. What do you do?":"A tua extração corre depressa demais. O que fazes?","Grind finer":"Moer mais fino","Grind coarser":"Moer mais grosso","Use less coffee":"Usar menos café","What do you do right after changing the grind?":"O que fazes logo a seguir a mudar a moagem?","Serve the next shot straight away":"Servir logo a extração seguinte","Grind one dose and throw it away":"Moer uma dose e deitá-la fora","Turn the machine off and on":"Desligar e ligar a máquina","Always use the house dose (see House drinks). Weigh it: ±0.2 g is the goal.":"Usa sempre a dose da casa (vê Bebidas da casa). Pesa-a: o objetivo é ±0,2 g.","Spread the coffee evenly in the basket before tamping, so water can't find an easy path.":"Espalha o café por igual no filtro antes de calcar, para a água não encontrar um caminho fácil.","Tamp straight and firm once. Level matters more than how hard you press.":"Calca uma vez, direito e com firmeza. Estar nivelado importa mais do que a força.","Wipe the rim of the basket clean so the portafilter seals well.":"Limpa a borda do filtro para o porta-filtro vedar bem.","What matters most when tamping?":"O que importa mais ao calcar?","Pressing as hard as you can":"Carregar com toda a força","Keeping it level":"Ficar nivelado","Tamping three times":"Calcar três vezes","Why do you weigh the dose?":"Porque pesas a dose?","So every coffee tastes the same":"Para todos os cafés saberem igual","Because the boss likes numbers":"Porque o patrão gosta de números","You don't need to":"Não é preciso","A shot has three numbers: dose in (g), yield out (g) and time (s).":"Uma extração tem três números: dose (g), rendimento (g) e tempo (s).","The ratio is yield ÷ dose. 18 g in and 36 g out is 1:2.":"O rácio é rendimento ÷ dose. 18 g de café e 36 g na chávena é 1:2.","Start the timer when you press the button; stop the shot at the target weight on the scale.":"Começa o temporizador quando carregas no botão; para a extração no peso certo na balança.","Good shot: even flow like warm honey, then it turns lighter in colour near the end.":"Boa extração: fluxo uniforme como mel quente, que fica mais claro perto do fim.","18 g in and 36 g out is which ratio?":"18 g de café e 36 g na chávena é que rácio?","When do you stop the shot?":"Quando paras a extração?","When the cup looks full":"Quando a chávena parece cheia","At the target weight on the scale":"No peso certo na balança","After exactly 20 seconds":"Ao fim de exatamente 20 segundos","Beans, weather and the grinder warming up all change the shot during the day.":"O grão, o tempo e o moinho a aquecer mudam a extração ao longo do dia.","Every morning: pull a check shot, weigh dose and yield, time it.":"Todas as manhãs: faz uma extração de controlo, pesa a dose e o rendimento e cronometra.","Too fast → finer. Too slow → coarser. Change only one thing at a time.":"Rápido demais → mais fino. Lento demais → mais grosso. Muda só uma coisa de cada vez.","Use the Calculators → Grind change tool if you're unsure how far to turn.":"Usa Calculadoras → Mudança de moagem se não tens a certeza de quanto rodar.","The check shot took 38 s; the target is 28 s. What do you do?":"A extração de controlo levou 38 s; o objetivo é 28 s. O que fazes?","Add more coffee":"Pôr mais café","How many things do you change at once?":"Quantas coisas mudas de uma vez?","One":"Uma","Everything that seems wrong":"Tudo o que parece estar mal","Two or three":"Duas ou três","Sour, sharp, thin cisa de mais espuma do que o latte: cerca de 1–1,5 cm por cima.","Add air for longer (3–5 s) at the start, while the milk is still cold.":"Mete ar mais tempo (3–5 s) no início, enquanto o leite ainda está frio.","Then sink the tip and let it spin to mix the foam through the milk.":"Depois afunda a ponta e deixa rodar para misturar a espuma no leite.","Pour straight away; foam that waits separates from the milk.":"Serve logo; espuma que espera separa-se do leite.","When do you add air?":"Quando metes ar?","At the start, while the milk is cold":"No início, com o leite frio","At the end, when it's hot":"No fim, quando está quente","The whole time":"O tempo todo","How much foam does a cappuccino have?":"Quanta espuma tem um cappuccino?","None":"Nenhuma","About 1–1.5 cm":"Cerca de 1–1,5 cm","Half the cup":"Meia chávena","Oat and soy milk burn and split faster than cow's milk.":"As bebidas de aveia e soja queimam e talham mais depressa do que o leite de vaca.","Use a 'barista' version: it foams better.":"Usa uma versão 'barista': faz melhor espuma.","Add less air and stop cooler, around 55–60 °C.":"Mete menos ar e para mais frio, por volta dos 55–60 °C.","Keep plant milks cold and shake the carton before use.":"Mantém as bebidas vegetais frias e agita o pacote antes de usar.","Where do you stop steaming oat milk?":"Onde paras ao vaporizar bebida de aveia?","Around 55–60 °C":"Por volta dos 55–60 °C","Around 75 °C":"Por volta dos 75 °C","When it boils":"Quando ferve","Which oat milk do you use?":"Que bebida de aveia usas?","Any cheap one":"Uma qualquer barata","A barista version":"Uma versão barista","Oat milk from the fridge door at home":"A bebida de aveia que tens no frigorífico em casa","Matcha: sift it first, then whisk with water at 75–80 °C. Boiling water makes it bitter.":"Matcha: peneira primeiro e depois bate com água a 75–80 °C. Água a ferver deixa-o amargo.","Whisk in a fast W or zigzag motion until there are no lumps and it's frothy.":"Bate depressa em W ou ziguezague até não haver grumos e ficar com espuma.","Chai: mix powder or concentrate with a splash of hot water first, then add steamed milk.":"Chai: mistura primeiro o pó ou o concentrado com um pouco de água quente e depois junta o leite vaporizado.","Follow the amounts in House drinks so every cup tastes the same.":"Segue as quantidades em Bebidas da casa para todas as chávenas saberem igual.","What water temperature do you use for matcha?":"Que temperatura de água usas para o matcha?","Boiling, 100 °C":"A ferver, 100 °C","Cold":"Fria","What do you do first with matcha powder?":"O que fazes primeiro com o pó de matcha?","Sift it":"Peneirá-lo","Steam it with the milk":"Vaporizá-lo com o leite","Art needs silky microfoam: thin and glossy, not stiff.":"O desenho precisa de microespuma sedosa: fina e brilhante, não rígida.","Tilt the cup, pour from high first to mix the milk under the crema.":"Inclina a chávena e deita primeiro de alto para o leite misturar por baixo do creme.","When the cup is half full, bring the jug very close and pour faster: a white circle appears.":"Com a chávena meio cheia, aproxima muito o jarro e deita mais depressa: aparece um círculo branco.","Lift up a little and pull through the middle to make the heart.":"Sobe um pouco e puxa pelo meio para fazer o coração.","When do you bring the jug close to the cup?":"Quando aproximas o jarro da chávena?","Right at the start":"Logo no início","When the cup is about half full":"Quando a chávena está mais ou menos meio cheia","Never":"Nunca","What milk works for latte art?":"Que leite serve para latte art?","Stiff, dry foam":"Espuma rígida e seca","Glossy microfoam":"Microespuma brilhante","Unsteamed cold milk":"Leite frio sem vaporizar","A tulip is several small hearts pushed into each other, then pulled through.":"Uma tulipa são vários corações pequenos empurrados uns contra os outros e depois cortados pelo meio.","A rosetta: wiggle the jug side to side while moving back, then pull through.":"Uma roseta: abana o jarro de um lado para o outro enquanto recuas e depois corta pelo meio.","Steady flow matters more than speed. Practise with water and a drop of soap to save milk.":"Um fluxo constante importa mais do que a rapidez. Treina com água e uma gota de detergente para poupar leite.","Finish by lifting the jug and cutting through the middle.":"Acaba a subir o jarro e a cortar pelo meio.","How do you make a rosetta?":"Como fazes uma roseta?","Wiggle side to side while moving back":"Abanar de um lado para o outro enquanto recuas","Pour from very high the whole time":"Deitar sempre de muito alto","Stir with a spoon":"Mexer com uma colher","What matters most when pouring art?":"O que importa mais ao desenhar?","A steady flow":"Um fluxo constante","Pouring as fast as possible":"Deitar o mais depressa possível","A cold cup":"Uma chávena fria","Open House drinks and learn each drink: cup, size, dose and milk.":"Abre Bebidas da casa e aprende cada bebida: chávena, tamanho, dose e leite.","Group them: espresso drinks, milk drinks, drinks without coffee.":"Agrupa-as: bebidas de espresso, bebidas com leite, bebidas sem café.","Practise by saying the recipe out loud before you make it.":"Treina dizendo a receita em voz alta antes de a fazer.","When unsure during a rush, check the app instead of guessing.":"Se tiveres dúvidas na hora de ponta, vê a app em vez de adivinhar.","Where do you find our café's recipes?":"Onde encontras as receitas do nosso café?","House drinks in this app":"Em Bebidas da casa nesta app","On the internet":"Na internet","You make them up":"Inventas tu","You're unsure about a recipe during a rush. What do you do?":"Tens dúvidas sobre uma receita na hora de ponta. O que fazes?","Guess":"Adivinhar","Check the app":"Ver na app","Skip the drink":"Não fazer a bebida","Work in a fixed order: grind and pull the shot first, steam the milk while it runs.":"Trabalha sempre pela mesma ordem: mói e tira primeiro o café, vaporiza o leite enquanto corre.","Steam milk for two drinks in one jug when they're the same type.":"Vaporiza leite para duas bebidas no mesmo jarro quando são do mesmo tipo.","Keep your station clean as you go: wipe, purge, knock out.":"Mantém o posto limpo enquanto trabalhas: limpa, purga, bate a borra.","Speed comes from calm, repeated movements, not from rushing.":"A rapidez vem de movimentos calmos e repetidos, não da pressa.","What do you do while the shot runs?":"O que fazes enquanto o café corre?","Wait and watch":"Esperar e olhar","Steam the milk":"Vaporizar o leite","Clean the floor":"Limpar o chão","Where does speed come from?":"De onde vem a rapidez?","Rushing":"Da pressa","Calm, repeated movements":"De movimentos calmos e repetidos","Skipping the scale":"De saltar a balança","Follow the Closing list in Daily routines, every day, in order.":"Segue a lista Fecho em Rotinas diárias, todos os dias, pela ordem.","Backflush with detergent, then rinse without, or the next coffee tastes of soap.":"Faz contralavagem com detergente e depois sem, senão o café seguinte sabe a sabão.","Clean the steam wand tips: milk left inside spoils and blocks the holes.":"Limpa as pontas do vaporizador: o leite que fica lá dentro estraga-se e entope os furos.","Leave the bar the way you would want to find it in the morning.":"Deixa o balcão como gostarias de o encontrar de manhã.","What do you do after backflushing with detergent?":"O que fazes depois da contralavagem com detergente?","Nothing":"Nada","Rinse again without detergent":"Enxaguar outra vez sem detergente","Turn the machine off straight away":"Desligar logo a máquina","Why clean the steam wand tips?":"Porque limpas as pontas do vaporizador?","Milk spoils and blocks the holes":"O leite estraga-se e entope os furos","It makes the machine shine":"Para a máquina brilhar","It isn't needed":"Não é preciso","Know where today's beans come from and two or three tastes (e.g. chocolate, nuts, red fruit).":"Sabe de onde vem o café de hoje e dois ou três sabores (p. ex. chocolate, frutos secos, fruta vermelha).","Keep it short and friendly; ask what the guest likes.":"Sê breve e simpático; pergunta o que o cliente gosta.","Suggest a drink: milk lovers a flat white, fruity coffee fans a filter or espresso.":"Sugere uma bebida: a quem gosta de leite um flat white, a quem gosta de café frutado um filtro ou um espresso.","If you don't know an answer, say so and find out.":"Se não souberes uma resposta, diz que não sabes e informa-te.","A guest asks a question you can't answer. What do you do?":"Um cliente faz uma pergunta a que não sabes responder. O que fazes?","Make something up":"Inventar qualquer coisa","Say you'll find out, then ask":"Dizer que vais saber e depois perguntar","Ignore it":"Ignorar","What do you tell a guest about the coffee?":"O que dizes a um cliente sobre o café?","Origin and 2–3 tastes, short and friendly":"Origem e 2–3 sabores, breve e simpático","Everything you know, for ten minutes":"Tudo o que sabes, durante dez minutos","Tamping presses the coffee into a firm, level puck so water flows through it evenly. Level matters most: a tilted tamp lets water rush through the low side.":"Calcar comprime o café num disco firme e nivelado para a água passar por igual. Estar nivelado é o mais importante: calcar torto deixa a água fugir pelo lado mais baixo.","Pressing harder packs the puck a little tighter and slows the shot by a second or two; pressing lighter speeds it up a little. Once the puck is fully pressed, extra force changes very little.":"Calcar com mais força compacta um pouco mais o café e atrasa a extração um ou dois segundos; com menos força acelera um pouco. Quando o café já está bem comprimido, mais força muda muito pouco.","Small drift during service (1–3 s off) with an automatic tamper (like a Puqpress): set it one step firmer or lighter for the next shots, and change one thing at a time, so you don't have to touch the grinder mid-rush.":"Pequeno desvio durante o serviço (1–3 s) com calcador automático (como um Puqpress): põe-no um nível mais firme ou mais leve para as extrações seguintes, e muda uma coisa de cada vez, para não teres de mexer no moinho em plena hora de ponta.","Tamping by hand? Keep your tamp the same every time. For a small drift, change the dose by 0.2–0.5 g or stop the shot 1–2 g earlier or later: that is a stronger fix and also leaves the grinder alone.":"Calcas à mão? Calca sempre da mesma maneira. Para um pequeno desvio, muda a dose 0,2–0,5 g ou para a extração 1–2 g antes ou depois: funciona melhor e também deixa o moinho em paz.","Bigger change (more than about 3 s), new beans or the start of the day: adjust the grind. Pressure can't fix a big difference, and tamping very hard all day strains your wrist.":"Mudança maior (mais de uns 3 s), grão novo ou início do dia: ajusta a moagem. A pressão não corrige uma diferença grande, e calcar com muita força o dia todo cansa o pulso.","Stay consistent: same dose, same distribution, same pressure. A calibrated tamper that clicks at a set pressure helps every barista tamp the same.":"Sê constante: mesma dose, mesma distribuição, mesma pressão. Um calcador calibrado que dá um clique a uma pressão fixa ajuda todos os baristas a calcar igual.","During a rush the shot runs 2 s too fast. What is the quickest safe fix?":"Na hora de ponta a extração corre 2 s depressa demais. Qual é a solução segura mais rápida?","Set the automatic tamper one step firmer, or add 0.3 g if you tamp by hand":"Pôr o calcador automático um nível mais firme, ou mais 0,3 g se calcas à mão","Turn the grinder a lot finer":"Pôr o moinho muito mais fino","Add 3 g more coffee":"Pôr mais 3 g de café","After opening a new bag, shots run 8 s too fast. What do you do?":"Depois de abrir um pacote novo, as extrações correm 8 s depressa demais. O que fazes?","Tamp much harder":"Calcar com muito mais força","Adjust the grind finer":"Pôr a moagem mais fina","Nothing, it will settle":"Nada, passa sozinho","Where should the steam wand point when ixo do bico","A quarter full":"Um quarto","Can you steam the same milk twice?":"Podes vaporizar o mesmo leite duas vezes?","No, always use fresh milk":"Não, usa sempre leite fresco","Yes, if it's still warm":"Sim, se ainda estiver morno","Yes, any time":"Sim, sempre","When does foam separate from the milk?":"Quando se separa a espuma do leite?","When you pour straight away":"Quando serves logo","When the drink waits before pouring":"Quando a bebida espera antes de servir","Why do you use a barista version of oat milk?":"Porque usas uma versão barista da bebida de aveia?","It foams better":"Faz melhor espuma","It's cheaper":"É mais barata","It stays colder":"Fica mais fria","How do you whisk matcha?":"Como bates o matcha?","Slowly in a circle":"Devagar, em círculo","Fast in a W or zigzag until smooth":"Depressa, em W ou ziguezague, até ficar liso","Shake it in a closed cup":"Agitado num copo fechado","Where do you pour from at the start?":"De onde deitas no início?","From higher up, to mix under the crema":"De mais alto, para misturar por baixo do creme","Right on the surface":"Mesmo à superfície","Down the side of the cup":"Pela parede da chávena","How do you finish a rosetta?":"Como acabas uma roseta?","Stop and stir":"Parar e mexer","Lift the jug and pull through the middle":"Subir o jarro e cortar pelo meio","Add foam with a spoon":"Pôr espuma com uma colher","A new drink was added to the menu. Where do you check the recipe?":"Entrou uma bebida nova na carta. Onde vês a receita?","Ask a guest":"Perguntar a um cliente","What keeps you fast during a rush?":"O que te mantém rápido na hora de ponta?","Skipping the purge":"Saltar a purga","Keeping your station clean as you go":"Manter o posto limpo enquanto trabalhas","Using yesterday's milk":"Usar o leite de ontem","Where do you find what to clean today?":"Onde vês o que há para limpar hoje?","Daily routines in this app":"Em Rotinas diárias nesta app","Nowhere":"Em lado nenhum","Ask the guests":"Perguntar aos cliente
